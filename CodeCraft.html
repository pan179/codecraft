<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeCraft · 多语言编程训练场</title>
<meta name="description" content="Python / C / C++ / Java / JavaScript 五门语言的中文训练场：分章节精讲、在线敲代码、智能批改、学习计划与每日打卡。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232f6be0'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23fff' font-family='sans-serif' font-weight='bold'>CC</text></svg>">
<style>
/* ==== assets/css/main.css ==== */
/* =========================================================
   PyCraft · 设计系统
   ========================================================= */
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --line:#e4e8f0;
  --line-soft:#eef2f8;
  --txt:#1c2431;
  --txt-2:#4b5768;
  --mut:#7c8798;
  --acc:#2f6be0;
  --acc-soft:#eaf1fe;
  --acc-deep:#1d4ed8;
  --py-blue:#3776ab;
  --py-yellow:#ffd43b;
  --ok:#0f9d58;
  --ok-soft:#e8f7ef;
  --bad:#e04a4a;
  --bad-soft:#fdecec;
  --warn:#b7791f;
  --warn-soft:#fdf6e3;
  --radius:14px;
  --radius-sm:10px;
  --shadow:0 1px 2px rgba(20,30,50,.04), 0 8px 24px -16px rgba(20,30,50,.18);
  --shadow-lg:0 12px 40px -18px rgba(20,30,50,.28);
  --mono:"JetBrains Mono","Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--txt);
  font-size:15px;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:none}
button{font-family:inherit}
::selection{background:#cfe0ff}

/* ---------- 滚动条 ---------- */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cfd7e4;border-radius:8px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#b6c1d2}
::-webkit-scrollbar-track{background:transparent}

/* =========================================================
   顶栏
   ========================================================= */
.topbar{
  position:fixed;top:0;left:0;right:0;height:62px;z-index:60;
  display:flex;align-items:center;gap:14px;
  padding:0 22px;
  background:rgba(255,255,255,.86);
  backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;color:var(--txt)}
.brand-mark{
  width:36px;height:36px;border-radius:11px;flex:none;
  background:linear-gradient(145deg,#4d8fd6,#2f6be0 70%);
  color:#fff;font-weight:800;font-size:15px;letter-spacing:-.5px;
  display:grid;place-items:center;
  box-shadow:0 6px 16px -8px rgba(47,107,224,.9);
  position:relative;
}
.brand-mark::after{
  content:"";position:absolute;inset:0;border-radius:11px;
  border:2px solid rgba(255,212,59,.55);border-right-color:transparent;border-bottom-color:transparent;
}
.brand-text{display:flex;flex-direction:column;line-height:1.15}
.brand-text strong{font-size:16px;letter-spacing:-.2px}
.brand-text em{font-style:normal;font-size:11px;color:var(--mut);letter-spacing:.4px}
.topbar-spacer{flex:1}
.top-actions{display:flex;align-items:center;gap:10px}

.level-switch{display:flex;background:#eef2f8;border-radius:10px;padding:3px;gap:2px}
.level-switch button{
  border:0;background:transparent;color:var(--txt-2);
  font-size:12.5px;padding:5px 11px;border-radius:8px;cursor:pointer;
  transition:.18s;font-weight:600;
}
.level-switch button:hover{color:var(--acc)}
.level-switch button.on{background:#fff;color:var(--acc);box-shadow:0 1px 4px rgba(20,30,50,.1)}

.streak-pill{
  display:flex;align-items:center;gap:4px;
  background:#fff6e5;border:1px solid #f6dfb3;color:#a9621a;
  padding:5px 12px;border-radius:999px;font-size:13px;
}
.streak-pill b{font-size:14px}
.streak-pill span{font-size:12px;opacity:.8}
.streak-pill .flame{filter:saturate(1.2)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid transparent;border-radius:10px;cursor:pointer;
  font-size:14px;font-weight:600;padding:9px 16px;transition:.18s;white-space:nowrap;
  text-decoration:none;
}
.btn-sm{padding:7px 13px;font-size:13px;border-radius:9px}
.btn-primary{background:var(--acc);color:#fff;box-shadow:0 8px 18px -12px rgba(47,107,224,.9)}
.btn-primary:hover{background:var(--acc-deep)}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--txt-2)}
.btn-ghost:hover{border-color:#c9d5ea;color:var(--acc);background:#fbfdff}
.btn-ok{background:var(--ok);color:#fff}
.btn-ok:hover{filter:brightness(.95)}
.btn-soft{background:var(--acc-soft);color:var(--acc)}
.btn-soft:hover{background:#dfe9fd}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{
  display:none;border:1px solid var(--line);background:#fff;border-radius:9px;
  width:36px;height:34px;font-size:16px;cursor:pointer;color:var(--txt-2)
}

/* =========================================================
   布局
   ========================================================= */
.shell{display:flex;padding-top:62px;min-height:100vh}
.sidebar{
  width:296px;flex:none;position:fixed;top:62px;bottom:0;left:0;
  border-right:1px solid var(--line);
  background:#fbfcfe;
  display:flex;flex-direction:column;z-index:50;
  transition:transform .24s ease;
}
#sidebar-nav{flex:1;overflow-y:auto;padding:14px 12px 8px}
.view{
  margin-left:296px;flex:1;min-width:0;
  padding:34px 44px 90px;
  max-width:calc(100% - 296px);
}
.content{max-width:860px;margin:0 auto}
.content-wide{max-width:1080px;margin:0 auto}
.loading{padding:60px;text-align:center;color:var(--mut)}

/* ---------- 侧边栏导航 ---------- */
.nav-group-title{
  font-size:11px;font-weight:700;letter-spacing:1.2px;color:#9aa5b6;
  padding:14px 12px 6px;text-transform:uppercase;
}
.nav-link{
  display:flex;align-items:center;gap:9px;
  padding:8px 11px;border-radius:9px;color:var(--txt-2);font-size:13.5px;
  cursor:pointer;transition:.15s;margin-bottom:1px;font-weight:500;
}
.nav-link:hover{background:#eef3fb;color:var(--acc)}
.nav-link.active{background:var(--acc-soft);color:var(--acc-deep);font-weight:700}
.nav-link .ico{width:18px;text-align:center;font-size:14px;flex:none;opacity:.9}
.nav-chapters{padding-bottom:6px}
.ch-wrap{border-radius:10px;margin-bottom:2px}
.ch-head{
  display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;
  cursor:pointer;font-size:13.5px;color:var(--txt);transition:.15s;
}
.ch-head:hover{background:#eef3fb}
.ch-head.on{background:#eef3fb}
.ch-num{
  width:22px;height:22px;flex:none;border-radius:7px;background:#eef2f8;color:#66748a;
  font-size:11px;font-weight:800;display:grid;place-items:center;
}
.ch-head.done .ch-num{background:var(--ok-soft);color:var(--ok)}
.ch-head.on .ch-num{background:var(--acc);color:#fff}
.ch-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.ch-pct{font-size:10.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.ch-rest{display:none;padding:2px 0 8px 10px}
.ch-rest.show{display:block}
.ch-lesson{
  display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:7px;
  font-size:12.5px;color:var(--txt-2);cursor:pointer;
}
.ch-lesson:hover{background:#fff;color:var(--acc)}
.ch-lesson.active{background:#fff;color:var(--acc);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
.ch-lesson .tick{
  width:14px;height:14px;flex:none;border-radius:50%;border:1.5px solid #cbd4e2;
  font-size:9px;display:grid;place-items:center;color:transparent;
}
.ch-lesson.read .tick{border-color:var(--ok);background:var(--ok);color:#fff}

.sidebar-foot{padding:12px;border-top:1px solid var(--line);background:#fff}
.mini-progress{}
.mp-head{display:flex;justify-content:space-between;font-size:12px;color:var(--txt-2);margin-bottom:6px}
.mp-head b{color:var(--acc)}
.bar{height:7px;border-radius:99px;background:#eaeff7;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#5b95e8,#2f6be0);transition:width .5s}
.mp-sub{font-size:11px;color:var(--mut);margin-top:6px}

/* =========================================================
   通用排版
   ========================================================= */
.page-head{margin-bottom:26px}
.crumb{font-size:12.5px;color:var(--mut);margin-bottom:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--mut)}
.crumb a:hover{color:var(--acc)}
h1.page-title{font-size:29px;line-height:1.3;margin:0 0 10px;letter-spacing:-.6px;font-weight:750}
h1.page-title .accent{color:var(--acc)}
.page-desc{color:var(--txt-2);font-size:14.5px;margin:0;max-width:680px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:22px 24px}
.section-title{
  font-size:17px;font-weight:700;margin:34px 0 14px;display:flex;align-items:center;gap:9px;
  letter-spacing:-.2px;
}
.section-title::before{content:"";width:4px;height:17px;border-radius:3px;background:var(--acc)}
.section-title small{font-weight:500;color:var(--mut);font-size:12.5px;letter-spacing:0}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:4px 11px;font-size:12px;color:var(--txt-2);cursor:pointer;transition:.15s;
}
.chip:hover{border-color:#bcd0f0;color:var(--acc)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tag{
  display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;
  padding:2px 8px;border-radius:6px;letter-spacing:.2px;
}
.tag-blue{background:#eaf1fe;color:#2257c4}
.tag-green{background:var(--ok-soft);color:#0b7a44}
.tag-yellow{background:#fff7e0;color:#95651a}
.tag-red{background:var(--bad-soft);color:#bd3535}
.tag-gray{background:#eef2f8;color:#63718a}
.tag-purple{background:#f1ecfe;color:#6538c9}

/* =========================================================
   代码块 & 编辑器
   ========================================================= */
.codebox{
  border:1px solid #e0e7f2;border-radius:12px;overflow:hidden;background:#fbfdff;
  margin:16px 0;position:relative;
}
.codebox-head{
  display:flex;align-items:center;gap:8px;padding:7px 12px;
  background:#f4f8fe;border-bottom:1px solid #e6edf8;
  font-size:11.5px;color:#5b708f;font-weight:600;letter-spacing:.3px;
}
.codebox-head .dots{display:flex;gap:4px;margin-right:2px}
.codebox-head .dots i{width:7px;height:7px;border-radius:50%;background:#dbe4f0;display:block}
.codebox-head .dots i:nth-child(1){background:#ffd0cd}
.codebox-head .dots i:nth-child(2){background:#ffe8bd}
.codebox-head .dots i:nth-child(3){background:#c9ecd6}
.codebox-head .sp{flex:1}
.codebox-head button{
  border:0;background:transparent;color:#5b708f;font-size:11.5px;cursor:pointer;
  padding:3px 8px;border-radius:6px;font-weight:700;display:inline-flex;gap:4px;align-items:center;
}
.codebox-head button:hover{background:#e6eefb;color:var(--acc)}
pre.code{
  margin:0;padding:14px 16px;overflow-x:auto;
  font-family:var(--mono);font-size:13px;line-height:1.72;color:#1f2937;
  tab-size:4;
}
pre.code .k{color:#a626a4;font-weight:600}     /* 关键字 */
pre.code .s{color:#2f8a4a}                      /* 字符串 */
pre.code .c{color:#93a1b5;font-style:italic}    /* 注释 */
pre.code .n{color:#b06000}                      /* 数字 */
pre.code .b{color:#2f6be0}                      /* 内置函数 */
pre.code .f{color:#1d5bbf}                      /* 自定义函数名 */
pre.code .o{color:#6b7686}                      /* 运算符 */
.outbox{
  border-top:1px dashed #dfe8f5;background:#f6faf7;padding:10px 16px;
  font-family:var(--mono);font-size:12.5px;color:#2b4a37;white-space:pre-wrap;
}
.outbox::before{content:"输出";font-size:10px;color:#7fa08c;display:block;letter-spacing:1px;margin-bottom:3px;font-family:var(--sans)}
.outbox.err{background:#fdf4f4;color:#a83232;border-top-color:#f5d6d6}
.outbox.err::before{content:"报错";color:#c58a8a}

/* 练习用编辑器 */
.editor{
  border:1.5px solid #dbe3ef;border-radius:12px;overflow:hidden;background:#fff;
  transition:.18s;margin:14px 0;
}
.editor:focus-within{border-color:#9dbcf3;box-shadow:0 0 0 4px rgba(47,107,224,.09)}
.editor-head{
  display:flex;align-items:center;gap:8px;padding:7px 12px;background:#f7fafd;
  border-bottom:1px solid #e8eef8;font-size:11.5px;color:#5b708f;font-weight:600;
}
.editor-head .sp{flex:1}
.editor-head .kbd{
  font-family:var(--mono);font-size:10.5px;background:#fff;border:1px solid #dde5f1;
  border-radius:5px;padding:1px 5px;color:#6b7d96;
}
.editor-body{display:flex}
.gutter{
  font-family:var(--mono);font-size:13px;line-height:1.72;color:#b9c4d4;
  padding:12px 8px 12px 12px;text-align:right;user-select:none;background:#fbfcfe;
  border-right:1px solid #eef2f8;min-width:38px;
}
.editor textarea{
  flex:1;border:0;outline:0;resize:vertical;min-height:150px;
  font-family:var(--mono);font-size:13px;line-height:1.72;color:#1f2937;
  padding:12px 14px;background:#fff;tab-size:4;white-space:pre;
}
.editor-foot{
  display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fbfdff;
  border-top:1px solid #eef2f8;flex-wrap:wrap;
}
.editor-foot .sp{flex:1}
.editor-foot .hintline{font-size:11.5px;color:var(--mut)}

/* 运行结果面板 */
.runpanel{margin-top:12px;border-radius:12px;overflow:hidden;border:1px solid var(--line);animation:fadeUp .25s ease}
.runpanel .rp-head{
  display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:12.5px;font-weight:700;
}
.runpanel.ok .rp-head{background:var(--ok-soft);color:#0b7a44}
.runpanel.bad .rp-head{background:var(--bad-soft);color:#bd3535}
.runpanel.warn .rp-head{background:var(--warn-soft);color:var(--warn)}
.rp-body{padding:12px 14px;background:#fff;font-size:13.5px;color:var(--txt-2)}
.rp-body pre{
  margin:8px 0 0;background:#f8fafd;border:1px solid #eef2f8;border-radius:8px;
  padding:10px 12px;font-family:var(--mono);font-size:12.5px;overflow-x:auto;color:#334155;
  white-space:pre-wrap;
}
.tests{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.test-row{
  display:flex;align-items:flex-start;gap:9px;font-size:12.5px;
  background:#fafcff;border:1px solid #eef3fa;border-radius:8px;padding:7px 10px;
}
.test-row .mark{font-weight:800;flex:none}
.test-row.pass .mark{color:var(--ok)}
.test-row.fail .mark{color:var(--bad)}
.test-row code{
  font-family:var(--mono);font-size:12px;background:#eef3fa;border-radius:4px;padding:1px 5px;color:#3b4a5f;
}
.diag{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.diag-item{
  border-radius:10px;padding:10px 13px;font-size:13px;line-height:1.7;
  background:#fbfdff;border:1px solid #e9eff8;
}
.diag-item.bad{background:#fef7f7;border-color:#f7dede}
.diag-item.good{background:#f6fdf9;border-color:#d9f0e3}
.diag-item.tip{background:#fffdf5;border-color:#f6ecc9}
.diag-item b{display:block;font-size:13px;margin-bottom:3px;color:var(--txt)}
.diag-item code{
  font-family:var(--mono);font-size:12px;background:#eef3fa;border-radius:4px;
  padding:1px 5px;color:#31518a;
}
.diag-item ul{margin:6px 0 0;padding-left:20px}
.diag-item li{margin:2px 0}

/* =========================================================
   课程正文
   ========================================================= */
.lesson-body{font-size:15px;color:var(--txt-2);line-height:1.85}
.lesson-body p{margin:0 0 14px}
.lesson-body h3{
  font-size:16.5px;color:var(--txt);margin:26px 0 10px;font-weight:700;letter-spacing:-.2px;
}
.lesson-body ul,.lesson-body ol{margin:0 0 14px;padding-left:22px}
.lesson-body li{margin:5px 0}
.lesson-body strong{color:var(--txt);font-weight:700}
.lesson-body code.inline{
  font-family:var(--mono);font-size:12.5px;background:#eef3fa;color:#31518a;
  border-radius:5px;padding:1.5px 6px;border:1px solid #e3eaf5;white-space:nowrap;
}
.callout{
  border-radius:12px;padding:13px 16px;margin:16px 0;font-size:14px;
  display:flex;gap:11px;align-items:flex-start;border:1px solid;
}
.callout .ci{font-size:16px;flex:none;line-height:1.5}
.callout p{margin:0 0 6px}
.callout p:last-child{margin:0}
.callout.note{background:#f2f7ff;border-color:#dce8fb;color:#2c4a75}
.callout.warn{background:#fffaf0;border-color:#f6e8c8;color:#7d5a1c}
.callout.tip{background:#f4fcf7;border-color:#d7f0e1;color:#1e6a44}
.callout.principle{background:#f8f6ff;border-color:#e7e1fb;color:#4a3a86}
.callout.principle b{color:#5b45a8}
.tbl{width:100%;border-collapse:collapse;margin:16px 0;font-size:13.5px;overflow:hidden;border-radius:10px}
.tbl th{
  background:#f4f8fe;text-align:left;padding:9px 13px;font-weight:700;color:#3c5478;
  border-bottom:1px solid var(--line);font-size:12.5px;
}
.tbl td{padding:9px 13px;border-bottom:1px solid var(--line-soft);color:var(--txt-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl code{font-family:var(--mono);font-size:12px;background:#eef3fa;border-radius:4px;padding:1px 5px}

.lesson-nav{display:flex;gap:12px;margin-top:38px;padding-top:22px;border-top:1px solid var(--line)}
.lesson-nav .btn{flex:1;justify-content:flex-start;padding:13px 16px;flex-direction:column;align-items:flex-start;gap:2px}
.lesson-nav .btn small{font-weight:500;font-size:11px;opacity:.75}
.lesson-nav .next{justify-content:flex-end;align-items:flex-end;text-align:right}

/* 知识点卡片 */
.point-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.point-card{
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  cursor:pointer;transition:.18s;position:relative;
}
.point-card:hover{border-color:#b9d0f5;box-shadow:0 10px 24px -18px rgba(30,60,120,.4);transform:translateY(-1px)}
.point-card .pc-title{font-size:14px;font-weight:650;color:var(--txt);display:flex;align-items:center;gap:7px}
.point-card .pc-desc{font-size:12px;color:var(--mut);margin-top:4px;line-height:1.6}
.point-card .pc-foot{display:flex;gap:8px;margin-top:9px;align-items:center;font-size:11px;color:var(--mut)}
.point-card.read{border-color:#d7f0e3;background:#fbfefc}

/* =========================================================
   题目卡
   ========================================================= */
.qcard{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow);position:relative;
}
.qcard.solved{border-color:#cfeede;background:linear-gradient(#fff,#fbfefc)}
.q-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.q-idx{
  font-family:var(--mono);font-size:11px;color:#8d99ab;background:#f2f6fc;
  border-radius:6px;padding:2px 7px;font-weight:700;
}
.q-prompt{font-size:14.5px;color:var(--txt);line-height:1.8;margin:0 0 10px}
.q-prompt code{font-family:var(--mono);font-size:12.5px;background:#eef3fa;border-radius:5px;padding:1.5px 6px;color:#31518a}
.scene{
  background:#f7faff;border:1px solid #e4eefb;border-left:3px solid #7fa9e8;border-radius:9px;
  padding:10px 14px;font-size:13px;color:#3a5578;margin:0 0 12px;line-height:1.75;
}
.scene b{color:#2c4a75}
.opts{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.opt{
  display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:10px;
  border:1.5px solid #e6ecf6;cursor:pointer;transition:.15s;font-size:14px;color:var(--txt-2);
  background:#fff;
}
.opt:hover{border-color:#bcd3f4;background:#fbfdff}
.opt .k{
  width:20px;height:20px;flex:none;border-radius:50%;border:1.5px solid #cfd9e8;
  font-size:11px;font-weight:800;display:grid;place-items:center;color:#8493a8;margin-top:1px;
}
.opt.sel{border-color:var(--acc);background:#f5f9ff}
.opt.sel .k{background:var(--acc);border-color:var(--acc);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt code{font-family:var(--mono);font-size:12.5px;background:#eef3fa;border-radius:4px;padding:1px 5px;color:#31518a}
.q-actions{display:flex;gap:9px;align-items:center;margin-top:12px;flex-wrap:wrap}
.q-actions .sp{flex:1}
.q-expl{
  margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;font-size:13.5px;
  color:var(--txt-2);line-height:1.8;animation:fadeUp .25s ease;
}
.q-expl b{color:var(--txt)}
.solution-toggle{
  margin-top:10px;font-size:12.5px;color:var(--acc);cursor:pointer;display:inline-flex;
  align-items:center;gap:4px;font-weight:600;user-select:none;
}

/* =========================================================
   首页 / 仪表盘
   ========================================================= */
.hero{
  background:linear-gradient(135deg,#2f6be0 0%,#3f7fe8 45%,#5b9af0 100%);
  border-radius:18px;padding:30px 34px;color:#fff;position:relative;overflow:hidden;
  box-shadow:0 20px 46px -26px rgba(47,107,224,.85);
}
.hero::after{
  content:"";position:absolute;right:-60px;top:-70px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,212,59,.32),transparent 65%);
}
.hero::before{
  content:"</>";position:absolute;right:36px;bottom:-30px;font-size:130px;font-weight:800;
  color:rgba(255,255,255,.07);font-family:var(--mono);letter-spacing:-6px;
}
.hero h1{margin:0 0 8px;font-size:27px;letter-spacing:-.5px;font-weight:750}
.hero p{margin:0;color:rgba(255,255,255,.85);font-size:14px;max-width:560px}
.hero-stats{display:flex;gap:26px;margin-top:22px;position:relative;z-index:2;flex-wrap:wrap}
.hs b{display:block;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.hs span{font-size:11.5px;color:rgba(255,255,255,.72);letter-spacing:.4px}

.dash-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-top:18px}
.dash-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow)}
.dash-card h4{margin:0 0 12px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
.dash-card h4 .sp{flex:1}
.dash-card h4 a{font-size:12px;font-weight:600;color:var(--acc)}

/* 进度备份条 */
.databar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;padding:14px 18px;border-radius:14px;background:#f6f8fc;border:1px solid #e6ebf4}
.databar .db-ico{font-size:17px;line-height:1}
.databar .db-main{flex:1 1 300px;font-size:12.5px;line-height:1.8;color:#5a6678}
.databar .db-main b{color:#1c2431}
.databar .db-main code{background:#e9eef8;padding:1px 5px;border-radius:4px;font-size:11.5px;color:var(--acc);font-family:inherit}
.databar .btn{flex:0 0 auto}

.today-list{display:flex;flex-direction:column;gap:9px}
.today-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  background:#fafcff;border:1px solid #eef3fa;font-size:13px;cursor:pointer;transition:.15s;
}
.today-item:hover{border-color:#c8dbf7;background:#f6faff}
.today-item .ti-ico{
  width:26px;height:26px;flex:none;border-radius:8px;background:var(--acc-soft);color:var(--acc);
  display:grid;place-items:center;font-size:13px;
}
.today-item .ti-main{flex:1;min-width:0}
.today-item .ti-main b{display:block;font-size:13px;font-weight:650;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.today-item .ti-main span{font-size:11.5px;color:var(--mut)}

.heatmap{display:grid;grid-auto-flow:column;grid-auto-columns:13px;grid-template-rows:repeat(7,13px);gap:4px;justify-content:start;overflow-x:auto;padding:4px 0}
.hm-cell{width:13px;height:13px;border-radius:3.5px;background:#eef2f8;transition:.15s;cursor:pointer}
.hm-cell:hover{outline:2px solid #c2d6f5}
.hm-cell.l1{background:#cfe4c4}
.hm-cell.l2{background:#8ecf88}
.hm-cell.l3{background:#43a047}
.hm-cell.l4{background:#1b7a35}
.hm-cell.today{box-shadow:0 0 0 2px #2f6be0}
.hm-legend{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--mut);margin-top:8px;justify-content:flex-end}

/* =========================================================
   每日一练
   ========================================================= */
.daily-head{
  background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 26px;
  box-shadow:var(--shadow);margin-bottom:20px;
}
.dh-top{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.dh-date{font-size:12px;color:var(--mut);letter-spacing:.6px;font-weight:600}
.dh-title{font-size:23px;font-weight:750;margin:3px 0 6px;letter-spacing:-.5px}
.dh-sub{font-size:13px;color:var(--mut);margin:0}
.dh-right{margin-left:auto;text-align:right}
.ring{position:relative;width:72px;height:72px}
.ring svg{transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:800;color:var(--acc)}
.dh-bars{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
.dhb{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--txt-2);background:#f7fafd;border:1px solid #edf2fa;border-radius:7px;padding:4px 9px}
.dhb i{width:6px;height:6px;border-radius:50%;background:#cfd9e8;display:block}
.dhb.done i{background:var(--ok)}
.dhb.done{color:var(--ok);border-color:#d8f0e3;background:#f6fdf9}

.checkin-bar{
  display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:14px;
  background:#fff;border:1px dashed #d6e2f2;margin-top:18px;flex-wrap:wrap;
}
.checkin-bar .cbt{font-size:13px;color:var(--txt-2)}
.checkin-bar .cbt b{color:var(--txt)}
.checkin-bar .sp{flex:1}

/* =========================================================
   学习计划
   ========================================================= */
.plan-grid{display:flex;flex-direction:column;gap:10px}
.plan-row{
  display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:13px 16px;transition:.15s;
}
.plan-row:hover{border-color:#c8dbf7}
.plan-row.today{border-color:#9dbcf3;background:#f7faff;box-shadow:0 0 0 3px rgba(47,107,224,.07)}
.plan-row.done{background:#fbfefc;border-color:#d8f0e3}
.plan-day{
  width:52px;flex:none;text-align:center;border-right:1px solid var(--line-soft);padding-right:10px;
}
.plan-day b{display:block;font-size:16px;font-weight:800;color:var(--acc);line-height:1.2}
.plan-day span{font-size:10.5px;color:var(--mut)}
.plan-main{flex:1;min-width:0}
.plan-main b{font-size:13.5px;font-weight:650;color:var(--txt);display:block}
.plan-main span{font-size:11.5px;color:var(--mut)}
.plan-row .btn{flex:none}

/* =========================================================
   打卡日历页
   ========================================================= */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:auto;border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:24px;font-weight:800;color:var(--acc);line-height:1.3;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--mut)}
.cal-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);overflow-x:auto}
.cal-month{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.cal-cell{
  aspect-ratio:1;border-radius:9px;background:#f7f9fd;border:1px solid #eef2f8;
  display:flex;flex-direction:column;padding:5px 6px;font-size:11px;color:#a3aebf;
}
.cal-cell .d{font-weight:700}
.cal-cell.has{background:#eef7ee;border-color:#d5ecd8;color:#2c6b3d}
.cal-cell.full{background:#8ecf88;border-color:#7cc476;color:#fff}
.cal-cell.today{box-shadow:0 0 0 2px var(--acc)}
.cal-cell .n{margin-top:auto;font-size:9.5px;opacity:.85}

/* =========================================================
   实验室 / 通用工具
   ========================================================= */
.lab-grid{display:grid;grid-template-columns:1fr;gap:14px}
.snip-list{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.empty{
  text-align:center;padding:50px 20px;color:var(--mut);font-size:13.5px;
}
.empty .big{font-size:34px;display:block;margin-bottom:10px;opacity:.55}

#toast-wrap{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{
  background:#1f2937;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;
  box-shadow:var(--shadow-lg);animation:toastIn .28s cubic-bezier(.2,.9,.3,1.2);
  display:flex;align-items:center;gap:8px;
}
.toast.ok{background:#0f8a4d}
.toast.bad{background:#c93a3a}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.modal-mask{
  position:fixed;inset:0;background:rgba(18,26,40,.42);z-index:900;
  display:grid;place-items:center;padding:24px;animation:fadeUp .2s;
}
.modal{
  background:#fff;border-radius:16px;max-width:620px;width:100%;max-height:86vh;overflow:auto;
  box-shadow:0 30px 80px -30px rgba(15,25,45,.5);padding:26px 28px;
}
.modal h3{margin:0 0 8px;font-size:18px}
.modal .m-sub{color:var(--mut);font-size:13px;margin:0 0 16px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}

.py-boot{
  position:fixed;right:18px;bottom:18px;z-index:400;
  background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:7px 14px;font-size:11.5px;color:var(--txt-2);box-shadow:var(--shadow);
  display:flex;align-items:center;gap:7px;transition:.3s;
}
.py-boot .dot{width:7px;height:7px;border-radius:50%;background:#f0b429;animation:pulse 1.4s infinite}
.py-boot.ready .dot{background:var(--ok);animation:none}
.py-boot.fail .dot{background:var(--bad);animation:none}
.py-boot.hide{opacity:0;transform:translateY(10px);pointer-events:none}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

.only-mobile{display:none}

/* =========================================================
   响应式
   ========================================================= */
@media(max-width:1180px){
  .dash-grid{grid-template-columns:1fr}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:960px){
  .only-mobile{display:inline-flex}
  .sidebar{transform:translateX(-100%);box-shadow:var(--shadow-lg);width:280px}
  .sidebar.open{transform:none}
  .view{margin-left:0;max-width:100%;padding:22px 18px 80px}
  .brand-text em{display:none}
  .point-grid{grid-template-columns:1fr}
  .hero{padding:24px 22px}
  .hero h1{font-size:22px}
  .level-switch button{padding:5px 8px;font-size:11.5px}
  .topbar{padding:0 12px;gap:8px}
  h1.page-title{font-size:23px}
}
@media(max-width:860px){
  /* 顶栏放不下三样东西：难度切换收进「设置」，每日一练在侧栏和首页都有入口 */
  #level-switch{display:none}
  .top-actions{gap:6px}
  .lang-pill{padding:5px 9px 5px 7px;font-size:12.5px}
  #btn-today{display:none}
}
@media(max-width:560px){
  .top-actions .streak-pill span{display:none}
  .stat-grid{grid-template-columns:1fr 1fr}
  .qcard{padding:16px}
  .lesson-nav{flex-direction:column}
}

/* =========================================================
   CodeCraft 扩展 · 多语言 / 首次引导 / 学习计划
   ========================================================= */

/* ---------- 顶部语言切换 ---------- */
.lang-pill{
  display:inline-flex;align-items:center;gap:6px;
  background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:5px 12px 5px 8px;font-size:13px;font-weight:600;color:var(--txt-2);
  cursor:pointer;transition:.18s;
}
.lang-pill:hover{border-color:#c9d5ea;color:var(--acc)}
.lang-pill .lg-ico{font-size:15px;line-height:1}
.lang-pill .lg-caret{font-size:10px;color:var(--mut)}

/* ---------- 首次引导 ---------- */
.ob-wrap{
  position:fixed;inset:0;z-index:200;overflow:auto;
  background:
    radial-gradient(900px 520px at 12% -8%, #e6eeff 0%, rgba(230,238,255,0) 70%),
    radial-gradient(800px 480px at 96% 4%, #e8f7ef 0%, rgba(232,247,239,0) 68%),
    var(--bg);
  padding:40px 22px 56px;
}
.ob-inner{max-width:1060px;margin:0 auto}
.ob-brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.ob-brand .brand-mark{width:44px;height:44px;border-radius:13px;font-size:17px}
.ob-brand strong{font-size:19px;letter-spacing:-.3px;display:block;line-height:1.2}
.ob-brand span{font-size:12.5px;color:var(--mut)}
.ob-steps{display:flex;align-items:center;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.ob-step{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut);font-weight:600}
.ob-step i{
  width:22px;height:22px;border-radius:50%;background:#eef2f8;color:var(--mut);
  display:grid;place-items:center;font-style:normal;font-size:12px;flex:none;
}
.ob-step.on{color:var(--acc)}
.ob-step.on i{background:var(--acc);color:#fff}
.ob-step.done i{background:var(--ok);color:#fff}
.ob-step.done{color:var(--ok)}
.ob-sep{width:26px;height:2px;background:var(--line);border-radius:2px}
.ob-card{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:30px 32px 26px;box-shadow:0 20px 60px -40px rgba(20,30,50,.5);
}
.ob-title{font-size:24px;font-weight:800;letter-spacing:-.5px;margin:0 0 8px}
.ob-desc{color:var(--txt-2);font-size:14px;margin:0 0 22px;max-width:680px}

.lang-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:12px}
.lang-card{
  position:relative;text-align:left;background:#fff;border:1.5px solid var(--line);
  border-radius:14px;padding:16px 15px 14px;cursor:pointer;transition:.18s;
  display:flex;flex-direction:column;gap:9px;font-family:inherit;
}
.lang-card:hover{border-color:#b9cdf0;transform:translateY(-2px);box-shadow:0 12px 26px -20px rgba(47,107,224,.8)}
.lang-card.on{border-color:var(--acc);background:#f7faff;box-shadow:0 0 0 3px rgba(47,107,224,.1)}
.lang-card .lc-top{display:flex;align-items:center;gap:9px}
.lang-card .lc-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none}
.lang-card .lc-name{font-size:15.5px;font-weight:800;letter-spacing:-.2px;line-height:1.2}
.lang-card .lc-sub{font-size:11.5px;color:var(--mut);font-weight:500}
.lang-card .lc-desc{font-size:12.5px;color:var(--txt-2);line-height:1.6;flex:1}
.lang-card .lc-meta{display:flex;gap:8px;font-size:11px;color:var(--mut);flex-wrap:wrap}
.lang-card .lc-meta b{color:var(--txt-2);font-weight:700}
.lang-card .lc-tick{
  position:absolute;top:12px;right:12px;width:18px;height:18px;border-radius:50%;
  background:var(--acc);color:#fff;font-size:11px;display:none;place-items:center;
}
.lang-card.on .lc-tick{display:grid}

.day-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.day-card{
  background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:14px;
  cursor:pointer;transition:.18s;text-align:left;font-family:inherit;position:relative;
}
.day-card:hover{border-color:#b9cdf0;transform:translateY(-2px)}
.day-card.on{border-color:var(--acc);background:#f7faff;box-shadow:0 0 0 3px rgba(47,107,224,.1)}
.day-card b{font-size:20px;letter-spacing:-.5px;display:block;line-height:1.1;color:var(--txt)}
.day-card span{font-size:11.5px;color:var(--mut);display:block;margin-top:2px}
.day-card em{font-style:normal;font-size:11.5px;color:var(--txt-2);display:block;margin-top:8px;line-height:1.5}
.day-card .dc-tag{position:absolute;top:10px;right:10px;font-size:10px;color:var(--acc);font-weight:700}

.ob-summary{
  display:flex;gap:18px;flex-wrap:wrap;background:#f7faff;border:1px solid #dbe7fb;
  border-radius:13px;padding:16px 18px;margin:4px 0 20px;
}
.ob-summary div{font-size:12.5px;color:var(--txt-2)}
.ob-summary b{display:block;font-size:19px;color:var(--txt);letter-spacing:-.3px;margin-bottom:2px}
.ob-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;align-items:center}
.ob-hint{margin-right:auto;font-size:12.5px;color:var(--mut)}

/* ---------- 计划时间轴 ---------- */
.plan-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.day-line{display:grid;grid-template-columns:54px 1fr;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line-soft)}
.day-line:last-child{border-bottom:0}
.day-line .dl-n{
  width:44px;height:44px;border-radius:12px;background:#f3f6fb;display:grid;place-items:center;
  font-weight:800;font-size:15px;color:var(--txt-2);flex:none;
}
.day-line.today .dl-n{background:var(--acc);color:#fff}
.day-line.done .dl-n{background:var(--ok-soft);color:var(--ok)}
.day-line .dl-title{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.day-line .dl-desc{font-size:12.5px;color:var(--mut);margin-top:3px;line-height:1.6}
.day-line .dl-lessons{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.dl-lesson{
  font-size:11.5px;background:#f3f6fb;border-radius:7px;padding:3px 9px;color:var(--txt-2);
  cursor:pointer;border:1px solid transparent;transition:.15s;
}
.dl-lesson:hover{background:#eaf1fe;color:var(--acc);border-color:#d3e2fb}
.dl-lesson.ok{background:var(--ok-soft);color:var(--ok)}
.dl-badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px}
.dl-badge.learn{background:#eaf1fe;color:var(--acc)}
.dl-badge.review{background:var(--warn-soft);color:var(--warn)}
.dl-badge.sprint{background:#f3e9fd;color:#7c3aed}
.dl-badge.rest{background:#f1f4f9;color:var(--mut)}

/* ---------- 语言横幅 ---------- */
.lang-hero{
  border-radius:16px;padding:20px 22px;color:#fff;position:relative;overflow:hidden;
  margin-bottom:18px;
}
.lang-hero::after{
  content:"";position:absolute;right:-40px;top:-50px;width:200px;height:200px;
  background:rgba(255,255,255,.14);border-radius:50%;
}
.lang-hero h2{margin:0 0 6px;font-size:21px;letter-spacing:-.4px;display:flex;align-items:center;gap:9px}
.lang-hero p{margin:0;font-size:13px;opacity:.92;max-width:640px;line-height:1.7}
.lang-hero .lh-stats{display:flex;gap:20px;margin-top:14px;flex-wrap:wrap}
.lang-hero .lh-stats div{font-size:11.5px;opacity:.88}
.lang-hero .lh-stats b{display:block;font-size:18px;letter-spacing:-.3px;opacity:1}

/* ---------- 实验室 ---------- */
.lab-col{display:grid;grid-template-columns:1fr;gap:12px}
.lab-stdin{
  width:100%;font-family:var(--mono);font-size:12.5px;border:1px solid var(--line);
  border-radius:9px;padding:9px 10px;min-height:64px;resize:vertical;background:#fcfdff;color:var(--txt);

.lab-stdin:focus{outline:none;border-color:#b9cdf0;background:#fff}

/* ---------- 其他 ---------- */
.kv{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--txt-2)}
.setting-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line-soft)}
.setting-row:last-child{border-bottom:0}
.setting-row .sr-txt{flex:1}
.setting-row .sr-txt b{display:block;font-size:13.5px;margin-bottom:2px}
.setting-row .sr-txt span{font-size:12px;color:var(--mut);line-height:1.6}
.danger{color:var(--bad)}
.sel-mini{
  font-family:inherit;font-size:12.5px;padding:6px 10px;border-radius:9px;
  border:1px solid var(--line);background:#fff;color:var(--txt);
}
.tag-lang{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:#eef2f8;color:var(--txt-2)}
.q-src{font-size:10px;color:var(--mut);border:1px solid var(--line);padding:1px 6px;border-radius:5px}
@media (max-width:720px){
  .ob-card{padding:20px 16px 18px}
  .ob-title{font-size:20px}
  .ob-wrap{padding:20px 12px 40px}
}

/* ---------- 自定义天数 ---------- */
.ob-custom{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin-top:14px;padding:11px 14px;border:1px dashed var(--line);
  border-radius:11px;background:#fbfcff;font-size:12.5px;color:var(--txt-2);
}
.ob-custom input{
  width:78px;font-family:inherit;font-size:13px;font-weight:700;color:var(--txt);
  padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:center;
}
.ob-custom input.on{border-color:var(--acc);box-shadow:0 0 0 3px rgba(47,107,224,.1)}
.ob-custom input:focus{outline:none;border-color:#b9cdf0}
.ob-custom .btn-sm{padding:5px 11px;font-size:12px}

      goals: ['自己设计一个合理的类', '区分类属性与实例属性', '用继承消除重复代码', '知道 dataclass 能省掉多少样板'],
      lessons: [
        {
          id: 'py7l1', title: '类与对象：从模板到实例', key: 'class · __init__', time: 12,
          blocks: [
            { t: 'p', x: '**类是模板，对象是按模板造出来的实例。** `__init__` 不是构造函数（对象已经造好了），而是「初始化方法」，负责给这个新对象填上属性。' },
            { t: 'code', x: 'class Dog:\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n\n    def bark(self):\n        return f"{self.name}：汪！"\n\nd = Dog("旺财", 3)\nprint(d.name, d.age)\nprint(d.bark())\nprint(type(d).__name__)', out: '旺财 3\n旺财：汪！\nDog' },
            { t: 'note', x: '`self` 就是「这个对象自己」。调用 `d.bark()` 时，Python 自动把 `d` 传给了第一个参数，所以你写方法时第一个参数必须是 self（名字可以改，但不建议）。' },
            { t: 'h', x: '类属性 vs 实例属性' },
            { t: 'code', x: 'class Counter:\n    total = 0                 # 类属性：所有实例共享一份\n\n    def __init__(self, name):\n        self.name = name      # 实例属性：每个对象各有一份\n        Counter.total += 1\n\na = Counter("A")\nb = Counter("B")\nprint(Counter.total, a.total, b.total)\nprint(a.name, b.name)', out: '2 2 2\nA B' },

            { t: 'code', x: 'class Bad:\n    items = []          # 所有实例共享同一个列表\n\na, b = Bad(), Bad()\na.items.append(1)\nprint("坑：", b.items)\n\nclass Good:\n    def __init__(self):\n        self.items = []\n\nc, d2 = Good(), Good()\nc.items.append(1)\nprint("对：", d2.items)', out: "坑： [1]\n对： []" },
            { t: 'h', x: '什么时候该写类' },
            { t: 'table', head: ['信号', '说明'], rows: [

            { t: 'principle', x: '**能用一个函数解决的，不要写类。** 类是为了把「数据 + 操作它的方法」绑在一起，如果数据本来就不需要长期存在，类只是多余的包装。' }

        {
          id: 'py7l2', title: '方法与 self：链式调用与字符串表示', key: 'self · __str__', time: 11,
          blocks: [
            { t: 'p', x: '方法本质上就是「第一个参数固定为实例的函数」。理解这一点，`self` 就不再神秘；而让方法返回 `self`，就能做出像 pandas 那样的链式调用。' },
            { t: 'code', x: 'class Point:\n    def __init__(self, x, y):\n        self.x = x\n        self.y = y\n\n    def move(self, dx, dy):\n        self.x += dx\n        self.y += dy\n        return self              # 返回自己，支持链式调用\n\n    def __str__(self):\n        return f"({self.x}, {self.y})"\n\np = Point(1, 2)\nprint(p)\np.move(2, 3)\nprint(p)\nprint(p.move(1, 1).move(1, 1))', out: '(1, 2)\n(3, 5)\n(5, 7)' },
            { t: 'table', head: ['魔术方法', '触发时机', '典型用途'], rows: [
              ['__init__', '创建对象后', '初始化属性'],

            { t: 'code', x: 'class Money:\n    def __init__(self, yuan):\n        self.yuan = yuan\n\n    def __repr__(self):\n        return f"Money({self.yuan})"\n\n    def __str__(self):\n        return f"{self.yuan} 元"\n\n    def __add__(self, other):\n        return Money(self.yuan + other.yuan)\n\n    def __eq__(self, other):\n        return self.yuan == other.yuan\n\na = Money(10)\nb = Money(5)\nprint(a)\nprint([a, b])\nprint(a + b)\nprint(a == Money(10))', out: '10 元\n[Money(10), Money(5)]\n15 元\nTrue' },
            { t: 'note', x: '`print(obj)` 用 `__str__`，但在列表里显示用 `__repr__`。只写一个的话，写 `__repr__` 更划算——它同时能用在调试和 print 上。' },
            { t: 'tip', x: '链式调用适合「连续修改同一个对象」的场景。如果每个方法都返回新对象（像字符串那样），那就是另一种风格「不可变链式」，两者不要混着用。' }

        {
          id: 'py7l3', title: '封装：私有属性与 property', key: 'property · 下划线约定', time: 12,
          blocks: [
            { t: 'p', x: 'Python 没有真正的私有成员，只有「约定」。`_name` 表示「内部用，别碰」，`__name` 会触发名字改写（name mangling）。真正的封装靠 `@property` 把属性变成受控的读写入口。' },
            { t: 'code', x: 'class Account:\n    def __init__(self, balance):\n        self._balance = balance\n\n    @property\n    def balance(self):\n        """只读属性：外部拿得到，但改不了。"""\n        return self._balance\n\n    def deposit(self, amount):\n        if amount <= 0:\n            raise ValueError("存款金额必须为正")\n        self._balance += amount\n\na = Account(100)\nprint(a.balance)\na.deposit(50)\nprint(a.balance)\ntry:\n    a.deposit(-10)\nexcept ValueError as e:\n    print("拦住：", e)', out: '100\n150\n拦住： 存款金额必须为正' },
            { t: 'h', x: '带校验的 setter' },
            { t: 'code', x: 'class Person:\n    def __init__(self, age):\n        self.age = age          # 走 setter，会校验\n\n    @property\n    def age(self):\n        return self._age\n\n    @age.setter\n    def age(self, value):\n        if not (0 < value < 150):\n            raise ValueError(f"年龄不合法：{value}")\n        self._age = value\n\np = Person(20)\nprint(p.age)\np.age = 30\nprint(p.age)\ntry:\n    p.age = -5\nexcept ValueError as e:\n    print("拦住：", e)', out: '20\n30\n拦住： 年龄不合法：-5' },
            { t: 'table', head: ['写法', '含义', '外部能改吗'], rows: [
              ['name', '公开', '能'],
              ['_name', '约定内部用', '能，但别这么干'],
              ['__name', '名字改写为 _类名__name', '能但很别扭'],
              ['@property 只读', '只能读', '不能'],
              ['@property + setter', '读写都受控', '能，但会走校验']
            ] },
            { t: 'warn', x: '别为了「看起来专业」给每个属性都加 property。只在**需要校验、需要计算、或者以后可能改实现**时才用，否则只是给自己添堵。' },
            { t: 'principle', x: '**封装的目的不是「不让别人看」，而是「不让别人弄坏」。** 校验逻辑集中在 setter 里，比散落在十个调用点安全得多。' }

        {
          id: 'py7l4', title: '继承与 super', key: 'class Dog(Animal)', time: 12,
          blocks: [
            { t: 'p', x: '继承解决的是「是一类东西」的关系：狗是一种动物、圆形是一种形状。判断该不该继承，问一句——「A 是 B 吗」。答不上来就别继承，改用组合。' },
            { t: 'code', x: 'class Animal:\n    def __init__(self, name):\n        self.name = name\n\n    def speak(self):\n        return "..."\n\nclass Dog(Animal):\n    def speak(self):\n        return "汪"\n\nclass Cat(Animal):\n    def __init__(self, name, indoor=True):\n        super().__init__(name)      # 先让父类把 name 装好\n        self.indoor = indoor\n\n    def speak(self):\n        return "喵"\n\nfor a in [Dog("旺财"), Cat("咪咪")]:\n    print(a.name, a.speak())\nprint(isinstance(Dog("x"), Animal))', out: '旺财 汪\n咪咪 喵\nTrue' },
            { t: 'note', x: '`super().__init__(name)` 不是可选的礼貌，而是必须——子类一旦定义了 `__init__`，就不会自动调用父类的，父类属性会缺失，后面用时才炸。' },
            { t: 'h', x: '方法解析顺序' },
            { t: 'code', x: 'class A:\n    def hi(self):\n        return "A"\n\nclass B(A):\n    pass\n\nclass C(A):\n    def hi(self):\n        return "C"\n\nclass D(B, C):\n    pass\n\nprint(D().hi())\nprint([c.__name__ for c in D.__mro__])', out: "C\n['D', 'B', 'C', 'A', 'object']" },
            { t: 'p', x: '`__mro__` 是方法查找顺序：从左到右找第一个有该方法的类。上面 D 自己没有 hi，B 也没有，C 有，所以返回 "C"。' },
            { t: 'h', x: '组合优于继承' },
            { t: 'code', x: 'class Engine:\n    def start(self):\n        return "引擎启动"\n\nclass Car:\n    def __init__(self):\n        self.engine = Engine()      # 组合：有一个引擎\n\n    def start(self):\n        return "汽车：" + self.engine.start()\n\nprint(Car().start())', out: '汽车：引擎启动' },
            { t: 'warn', x: '继承层级超过三层，基本就该重构了。深层继承会让「这个方法到底来自哪」变成考古工作，组合 + 接口要清晰得多。' }

        {
          id: 'py7l5', title: '多态、魔术方法与 dataclass', key: '多态 · dataclass', time: 13,
          blocks: [
            { t: 'p', x: '**多态**的意思是：同一个调用写法，作用在不同对象上有不同结果。你不需要写 `if isinstance(x, Dog)`，直接 `x.speak()` 就行——这是面向对象最有价值的部分。' },
            { t: 'code', x: 'class Shape:\n    def area(self):\n        raise NotImplementedError("子类必须实现 area")\n\nclass Rect(Shape):\n    def __init__(self, w, h):\n        self.w, self.h = w, h\n    def area(self):\n        return self.w * self.h\n\nclass Circle(Shape):\n    def __init__(self, r):\n        self.r = r\n    def area(self):\n        return round(3.14159 * self.r ** 2, 2)\n\nfor s in [Rect(3, 4), Circle(2)]:\n    print(type(s).__name__, s.area())', out: 'Rect 12\nCircle 12.57' },
            { t: 'h', x: 'dataclass：省掉一堆样板代码' },
            { t: 'code', x: 'from dataclasses import dataclass, field\n\n@dataclass\nclass User:\n    name: str\n    age: int\n    tags: list = field(default_factory=list)\n\nu1 = User("小明", 20)\nu2 = User("小明", 20)\nprint(u1)\nprint(u1 == u2)\nprint(u1.name, u1.tags)', out: "User(name='小明', age=20, tags=[])\nTrue\n小明 []" },
            { t: 'p', x: '一个 `@dataclass` 自动生成了 `__init__`、`__repr__`、`__eq__`，等价于手写三十行。定义数据结构（配置、DTO、接口返回）时几乎必用。' },
            { t: 'table', head: ['需求', '写法'], rows: [

              ['创建后不可改', '@dataclass(frozen=True)'],
              ['要有可变默认值', 'field(default_factory=list)'],
              ['需要排序', '@dataclass(order=True)'],
              ['字段要排除比较', 'field(compare=False)']
            ] },
            { t: 'code', x: 'from dataclasses import dataclass\n\n@dataclass(frozen=True)\nclass Point:\n    x: int\n    y: int\n\np = Point(1, 2)\nprint(p)\ntry:\n    p.x = 99\nexcept Exception as e:\n    print("不可修改：", type(e).__name__)\nprint(p == Point(1, 2))', out: "Point(x=1, y=2)\n不可修改： FrozenInstanceError\nTrue" },
            { t: 'tip', x: '`frozen=True` 的对象可以当字典的键、可以安全地在多线程间共享，是「值对象」的理想形态。' },
            { t: 'principle', x: '**先想数据，再想行为。** 大部分业务代码其实只需要 dataclass 装数据 + 几个函数处理数据，真正的继承体系远没有教材里那么常用。' }

    {
      id: 'py8', num: 8, title: '进阶特性', icon: '🔮',
      intro: '这一章讲四个「看起来高级、用起来真香」的特性：迭代器、生成器、闭包、装饰器。它们的共同点是——理解了就再也回不去，因为很多库的源码你终于能读懂了。',
      goals: ['说清 for 循环背后发生了什么', '用生成器处理大文件不爆内存', '看懂并写出简单的装饰器'],
      lessons: [
        {
          id: 'py8l1', title: '迭代器与可迭代协议', key: 'iter · next', time: 12,
          blocks: [
            { t: 'p', x: '`for x in something` 背后只有两步：先 `iter(something)` 拿到迭代器，再反复 `next()` 直到 `StopIteration`。搞懂这条，你就知道为什么列表能 for、字符串能 for、文件也能 for。' },
            { t: 'code', x: 'nums = [1, 2, 3]\nit = iter(nums)\nprint(type(it).__name__)\nprint(next(it))\nprint(next(it))\nprint(next(it))\ntry:\n    next(it)\nexcept StopIteration:\n    print("结束了")', out: 'list_iterator\n1\n2\n3\n结束了' },
            { t: 'warn', x: '迭代器是**一次性**的：走完就空了。想再遍历一遍，得重新 `iter()`。这个坑在「先把迭代器传给函数 A 汇总，再传给函数 B 打印」时特别常见。' },
            { t: 'h', x: '自己写一个可迭代对象' },
            { t: 'code', x: 'class Countdown:\n    def __init__(self, start):\n        self.start = start\n\n    def __iter__(self):\n        return self\n\n    def __next__(self):\n        if self.start <= 0:\n            raise StopIteration\n        self.start -= 1\n        return self.start + 1\n\nprint(list(Countdown(3)))\nfor i in Countdown(3):\n    print(i, end=" ")', out: '[3, 2, 1]\n3 2 1 ' },
            { t: 'table', head: ['协议', '要实现的方法', '得到的能力'], rows: [
              ['可迭代', '__iter__', '能被 for 遍历'],
              ['迭代器', '__iter__ + __next__', '能被 next() 逐个取值'],

            { t: 'code', x: '# 实际用法：把文件读成一个迭代器（不占内存）\nlines = ["第一行", "第二行", "第三行"]\nprint(sum(1 for _ in lines))\nprint(list(enumerate(lines, 1)))', out: "3\n[(1, '第一行'), (2, '第二行'), (3, '第三行')]" },
            { t: 'tip', x: '`zip`、`enumerate`、`map`、`filter`、`reversed` 返回的都是惰性迭代器，不是列表。需要多次使用或要 `len()` 时，记得先 `list()` 转一下。' }
          ]

        {
          id: 'py8l2', title: '生成器与 yield', key: 'yield · 惰性求值', time: 14,
          blocks: [
            { t: 'p', x: '生成器是「会暂停的函数」。遇到 `yield` 就交出一个值并挂起，下次调用 `next()` 从挂起处继续。它的最大价值是：**数据再多也只占一份内存**。' },
            { t: 'code', x: 'def countdown(n):\n    while n > 0:\n        yield n          # 交出值并暂停\n        n -= 1\n\nprint(list(countdown(3)))\nfor i in countdown(3):\n    print(i, end=" ")\nprint()\ng = countdown(2)\nprint(next(g))\nprint(next(g))', out: '[3, 2, 1]\n3 2 1 \n2\n1' },
            { t: 'h', x: '为什么需要生成器' },
            { t: 'code', x: 'import sys\n\nbig_list = [n for n in range(100000)]\nbig_gen = (n for n in range(100000))\n\nprint("两者求和无差别：", sum(big_list) == sum(big_gen))\nprint("列表占用至少是生成器的一千倍：", sys.getsizeof(big_list) > sys.getsizeof(big_gen) * 1000)', out: '两者求和无差别： True\n列表占用至少是生成器的一千倍： True' },
            { t: 'p', x: '具体的数字大概是：10 万个整数的列表约占 **780 KB**，而对应的生成器只占 **200 字节左右**——因为它根本不存数据，只是在你要的时候现算。数据量越大，这个差距越夸张。' },
            { t: 'h', x: '处理大文件的正确姿势' },
            { t: 'code', x: 'def read_lines(path):\n    """逐行读取，无论文件多大都不会爆内存。"""\n    with open(path, encoding="utf-8") as f:\n        for line in f:\n            yield line.rstrip()\n\n# 演示：用内存里的列表模拟\nfor line in ["第一行", "第二行"]:\n    print("读到：", line)', out: '读到： 第一行\n读到： 第二行' },
            { t: 'code', x: '# 无限序列：只有生成器能这么写\ndef nat():\n    n = 1\n    while True:\n        yield n\n        n += 1\n\ng = nat()\nprint([next(g) for _ in range(5)])\n\n# 生成器管道：过滤 + 转换，全程惰性\ndef nums():\n    for n in range(10):\n        yield n\n\nevens = (n for n in nums() if n % 2 == 0)\nprint(list(evens))', out: '[1, 2, 3, 4, 5]\n[0, 2, 4, 6, 8]' },
            { t: 'table', head: ['对比', '列表', '生成器'], rows: [
              ['内存', '一次全部装入', '只存一个状态'],
              ['能否重复遍历', '能', '不能（走完就空）'],

              ['适合', '数据量小、要多次用', '大文件、无限序列、流式处理']

            { t: 'warn', x: '生成器函数里 `return` 会终止生成并抛出 `StopIteration`，**不会把值返回给 for 循环**。想要最终结果，要么把它包成 list，要么用「状态累积 + 最后一次 yield」的写法。' }

        {
          id: 'py8l3', title: '闭包：函数记住了它的出生环境', key: 'closure · nonlocal', time: 13,
          blocks: [
            { t: 'p', x: '闭包 = 内层函数 + 它引用的外层变量。外层函数返回后，那些变量**并没有消失**，而是被内层函数「记住」了。这是装饰器、工厂函数、状态保持的基础。' },
            { t: 'code', x: 'def make_counter():\n    count = 0\n    def inc():\n        nonlocal count\n        count += 1\n        return count\n    return inc\n\nc1 = make_counter()\nc2 = make_counter()\nprint(c1(), c1(), c1())\nprint(c2())          # 独立的计数器', out: '1 2 3\n1' },
            { t: 'code', x: 'def multiplier(n):\n    return lambda x: x * n      # 记住了 n\n\ndouble = multiplier(2)\ntriple = multiplier(3)\nprint(double(5), triple(5))', out: '10 15' },
            { t: 'h', x: '最经典的坑：循环里的闭包' },
            { t: 'code', x: 'funcs = []\nfor i in range(3):\n    funcs.append(lambda: i)\n\nprint([f() for f in funcs])', out: '[2, 2, 2]' },
            { t: 'p', x: '全是 2 而不是 0、1、2。因为 lambda 里引用的 `i` 是**变量本身**，不是当时的值；循环结束后 i 停在 2，所有 lambda 看到的都是同一个 2。' },
            { t: 'code', x: '# 解法一：默认参数在定义时求值，把当前值"拍下来"\nfuncs = []\nfor i in range(3):\n    funcs.append(lambda i=i: i)\nprint([f() for f in funcs])\n\n# 解法二：用工厂函数造一个新的作用域\ndef make(i):\n    return lambda: i\n\nfuncs2 = [make(i) for i in range(3)]\nprint([f() for f in funcs2])', out: '[0, 1, 2]\n[0, 1, 2]' },

        {
          id: 'py8l4', title: '装饰器：给函数套一层壳', key: '@decorator', time: 15,
          blocks: [
            { t: 'p', x: '装饰器 = 一个「接收函数、返回新函数」的函数。`@timer` 只是 `f = timer(f)` 的语法糖。搞懂这一句，装饰器就不再玄乎。' },
            { t: 'code', x: 'import functools\n\ndef timer(func):\n    @functools.wraps(func)          # 保留原函数的名字和文档\n    def wrapper(*args, **kwargs):\n        print(f"开始调用 {func.__name__}")\n        result = func(*args, **kwargs)\n        print(f"调用结束，返回 {result}")\n        return result\n    return wrapper\n\n@timer\ndef add(a, b):\n    return a + b\n\nprint(add(2, 3))\nprint(add.__name__)', out: '开始调用 add\n调用结束，返回 5\n5\nadd' },
            { t: 'warn', x: '**必须写 `@functools.wraps(func)`**。不加的话，`add.__name__` 会变成 `wrapper`，文档字符串也会丢，调试和自动生成文档时全是坑。' },
            { t: 'h', x: '带参数的装饰器（三层结构）' },
            { t: 'code', x: 'import functools\n\ndef repeat(times):\n    def decorator(func):\n        @functools.wraps(func)\n        def wrapper(*args, **kwargs):\n            result = None\n            for _ in range(times):\n                result = func(*args, **kwargs)\n            return result\n        return wrapper\n    return decorator\n\n@repeat(3)\ndef hello():\n    print("hi")\n    return "done"\n\nprint(hello())', out: 'hi\nhi\nhi\ndone' },
            { t: 'table', head: ['层数', '写法', '调用时'], rows: [
              ['两层', 'def deco(func)', '@deco'],
              ['三层', 'def deco(参数)', '@deco(3)'],

            ] },
            { t: 'h', x: '实用例子：重试与缓存' },
            { t: 'code', x: 'import functools\n\ncalls = {"n": 0}\n\ndef count_calls(func):\n    @functools.wraps(func)\n    def wrapper(*a, **kw):\n        calls["n"] += 1\n        return func(*a, **kw)\n    return wrapper\n\n@count_calls\ndef work(x):\n    return x * 2\n\nwork(1)\nwork(2)\nprint("调用次数：", calls["n"])\n\n@functools.lru_cache(maxsize=None)\ndef slow_square(n):\n    return n * n\n\nprint(slow_square(4), slow_square(4))\nprint("缓存命中：", slow_square.cache_info().hits)', out: '调用次数： 2\n16 16\n缓存命中： 1' },

          id: 'py10l2', title: '项目实战：命令行任务管理器', key: '综合运用', time: 20,

            { t: 'p', x: '这一节把前面所有东西串起来：用 dataclass 表示数据、用字典做索引、用 JSON 做持久化、用异常处理坏输入、用函数拆分职责。这段代码不到 40 行，但用到了九成的基础语法。' },
            { t: 'h', x: '第一步：定义数据结构' },
            { t: 'code', x: 'from dataclasses import dataclass, field\n\n@dataclass\nclass Task:\n    id: int\n    title: str\n    done: bool = False\n    tags: list = field(default_factory=list)\n\nt = Task(1, "看完第 10 章")\nprint(t)\nprint(t.title, t.done)', out: "Task(id=1, title='看完第 10 章', done=False, tags=[])\n看完第 10 章 False" },
            { t: 'h', x: '第二步：核心操作' },
            { t: 'code', x: 'from dataclasses import dataclass\n\n@dataclass\nclass Task:\n    id: int\n    title: str\n    done: bool = False\n\nclass TaskBook:\n    def __init__(self):\n        self.tasks = []\n\n    def add(self, title):\n        if not title.strip():\n            raise ValueError("标题不能为空")\n        t = Task(len(self.tasks) + 1, title.strip())\n        self.tasks.append(t)\n        return t\n\n    def finish(self, tid):\n        for t in self.tasks:\n            if t.id == tid:\n                t.done = True\n                return t\n        raise KeyError(f"没有编号为 {tid} 的任务")\n\n    def pending(self):\n        return [t for t in self.tasks if not t.done]\n\nbook = TaskBook()\nbook.add("看完 Python 第 10 章")\nbook.add("写一个小爬虫")\nbook.finish(1)\n\nfor t in book.tasks:\n    mark = "✓" if t.done else " "\n    tid, title = t.id, t.title\n    print(f"[{mark}] {tid}. {title}")\nprint("未完成：", len(book.pending()))', out: '[✓] 1. 看完 Python 第 10 章\n[ ] 2. 写一个小爬虫\n未完成： 1' },
            { t: 'h', x: '第三步：持久化成 JSON' },
            { t: 'code', x: 'import json\nfrom dataclasses import dataclass, asdict\n\n@dataclass\nclass Task:\n    id: int\n    title: str\n    done: bool = False\n\ntasks = [Task(1, "看完第 10 章", True), Task(2, "写爬虫", False)]\n\nraw = json.dumps([asdict(t) for t in tasks], ensure_ascii=False, indent=2)\nprint(raw)\n\nback = [Task(**d) for d in json.loads(raw)]\nprint(back[0].title, back[0].done, len(back))', out: '[\n  {\n    "id": 1,\n    "title": "看完第 10 章",\n    "done": true\n  },\n  {\n    "id": 2,\n    "title": "写爬虫",\n    "done": false\n  }\n]\n看完第 10 章 True 2' },
            { t: 'note', x: '`asdict()` 把 dataclass 转成普通字典，`Task(**d)` 再用字典还原对象。这两个操作配合 JSON，就能实现「关掉程序再打开，数据还在」。' },

            { t: 'p', x: '`Map` 存「键 → 值」的映射。`HashMap` 查得快但**不保证顺序**；`TreeMap` 按 key 排序；`LinkedHashMap` 按插入顺序。要输出好看、结果稳定，就用后两个。' },
            { t: 'code', x: 'import java.util.*;\n\nclass Main {\n    public static void main(String[] args) {\n        Map<String, Integer> score = new TreeMap<>();\n        score.put("小明", 92);\n        score.put("小红", 88);\n        score.put("小刚", 75);\n\n        System.out.println(score);\n        System.out.println(score.get("小红"));\n        System.out.println(score.getOrDefault("路人", -1));\n        System.out.println(score.containsKey("小刚"));\n    }\n}', out: '{小刚=75, 小明=92, 小红=88}\n88\n-1\ntrue' },
            { t: 'warn', x: '`HashMap.get(不存在的键)` 返回 `null`，直接拿去做运算就是 `NullPointerException`。用 `getOrDefault` 给个默认值，或者先 `containsKey` 判断——这是 NPE 的头号来源。' },
            { t: 'code', x: 'import java.util.*;\n\nclass Main {\n    public static void main(String[] args) {\n        String[] words = {"a", "b", "a", "c", "a", "c"};\n        Map<String, Integer> cnt = new TreeMap<>();\n\n        for (String w : words) {\n            cnt.merge(w, 1, Integer::sum);   /* 不存在当 0，存在则相加 */\n        }\n        System.out.println(cnt);\n\n        for (Map.Entry<String, Integer> e : cnt.entrySet()) {\n            System.out.println(e.getKey() + " -> " + e.getValue());\n        }\n    }\n}', out: '{a=3, b=1, c=2}\na -> 3\nb -> 1\nc -> 2' },
            { t: 'table', head: ['遍历方式', '写法', '适用'], rows: [
              ['只要 key', '`for (K k : map.keySet())`', '简单遍历'],
              ['只要 value', '`for (V v : map.values())`', '统计'],
              ['键值都要', '`for (Map.Entry<K,V> e : map.entrySet())` ✅', '最常用，一次取两个'],
              ['函数式', '`map.forEach((k, v) -> ...)`', 'Java 8+，简洁']
            ] },
            { t: 'note', x: '`HashMap` 的 key 必须正确实现 `hashCode` 和 `equals`。用自定义对象做 key 却忘了重写，会出现「明明放进去了却 get 不到」——因为默认的 hashCode 是地址。' }
          ]
        },
        {
          id: 'j4l3', title: 'Set、泛型与自动装箱', key: 'Set · 泛型', time: 10,
          blocks: [
            { t: 'p', x: '`Set` 是「不允许重复」的集合，判断重复靠 `equals` + `hashCode`。`HashSet` 最快，`TreeSet` 有序。' },
            { t: 'code', x: 'import java.util.*;\n\nclass Main {\n    public static void main(String[] args) {\n        Set<Integer> s = new TreeSet<>();\n        for (int x : new int[]{3, 1, 3, 2, 1}) s.add(x);\n        System.out.println(s + " size=" + s.size());\n\n        List<String> raw = new ArrayList<>();\n        raw.add("a");\n        String first = raw.get(0);       /* 泛型：不用强转 */\n        System.out.println(first.toUpperCase());\n    }\n}', out: '[1, 2, 3] size=3\nA' },
            { t: 'p', x: '泛型 `<String>` 把「运行时才发现的类型错误」提前到编译期。没有泛型的年代，从集合里取出来的都是 `Object`，要手动 `(String)` 强转，转错就在运行时炸。' },
            { t: 'warn', x: '泛型不能是基本类型：`List<int>` 非法，必须写 `List<Integer>`。因此往集合里放数字会有**装箱**开销（int → Integer）。数据量大时这一点会影响性能。' },
            { t: 'note', x: '`List.of(...)` 和 `Set.of(...)` 创建的是**不可变**集合，`add` 会抛异常。做常量列表很方便，但需要修改时要 `new ArrayList<>(List.of(...))`。' }
          ]

    {
      id: 'j5', num: 5, title: '异常与文件', icon: '🧯',
      intro: 'Java 把异常做成了语言的一部分：受检异常强制你处理。这一章讲清异常的层级、什么时候该抛、什么时候该捕获，以及怎么读写文件。',
      goals: ['分清受检异常与运行时异常', '正确使用 try-catch-finally / try-with-resources', '用 Files 读写文本文件', '避免吞异常'],
      lessons: [
        {
          id: 'j5l1', title: '异常体系与捕获', key: 'try · catch · finally', time: 12,
          blocks: [
            { t: 'p', x: '所有异常都继承自 `Throwable`，往下分两支：`Error`（JVM 层面，基本救不了）和 `Exception`。`Exception` 里又以 `RuntimeException` 为界分成「受检」和「非受检」。' },
            { t: 'table', head: ['类型', '是否必须处理', '例子'], rows: [
              ['受检异常（Checked）', '必须 try 或 throws', 'IOException、SQLException'],
              ['运行时异常', '不强制，但应该避免', 'NullPointerException、IndexOutOfBoundsException'],
              ['Error', '不处理', 'OutOfMemoryError、StackOverflowError']
            ] },
            { t: 'code', x: 'class Main {\n    public static void main(String[] args) {\n        try {\n            int[] a = new int[3];\n            System.out.println(a[5]);\n        } catch (ArrayIndexOutOfBoundsException e) {\n            System.out.println("下标越界：" + e.getMessage());\n        } finally {\n            System.out.println("finally 一定执行");\n        }\n        System.out.println("程序继续");\n    }\n}', out: '下标越界：Index 5 out of bounds for length 3\nfinally 一定执行\n程序继续' },
            { t: 'code', x: 'class Main {\n    static int parse(String s) {\n        if (s == null || s.isEmpty()) {\n            throw new IllegalArgumentException("输入不能为空");\n        }\n        return Integer.parseInt(s);\n    }\n\n    public static void main(String[] args) {\n        try {\n            System.out.println(parse("42"));\n            System.out.println(parse(""));\n        } catch (IllegalArgumentException e) {\n            System.out.println("出错：" + e.getMessage());\n        }\n    }\n}', out: '42\n出错：输入不能为空' },
            { t: 'warn', x: '**别写空 catch。** `catch (Exception e) {}` 会把错误彻底吞掉，程序带着错误状态继续跑，最后在无关的地方崩溃。至少打印 `e.printStackTrace()` 或记日志。' },
            { t: 'note', x: '`finally` 里的 `return` 会覆盖 try 里的 `return`，也会吞掉异常。所以 `finally` 只用来释放资源，不要写 return。' }
          ]
        },
        {
          id: 'j5l2', title: '文件读写与 try-with-resources', key: 'Files · Reader · 关闭', time: 12,
          blocks: [
            { t: 'p', x: 'Java 里打开的文件/流必须关闭，否则占着系统句柄。`try-with-resources` 会自动关闭，而且即使中间抛异常也保证关闭——它是最推荐的写法，比 `finally` 里手动 `close` 更安全。' },
            { t: 'code', x: 'import java.io.*;\nimport java.nio.file.*;\nimport java.util.*;\n\nclass Main {\n    public static void main(String[] args) throws IOException {\n        Path p = Paths.get("demo_cc.txt");\n\n        Files.write(p, List.of("第一行", "第二行", "第三行"));\n\n        List<String> lines = Files.readAllLines(p);\n        System.out.println("行数 " + lines.size());\n        for (String line : lines) System.out.println(line);\n    }\n}', out: '行数 3\n第一行\n第二行\n第三行' },
            { t: 'code', x: 'import java.io.*;\n\nclass Main {\n    public static void main(String[] args) {\n        /* try 括号里声明的资源会自动 close，顺序与声明相反 */\n        try (BufferedReader br = new BufferedReader(new StringReader("a\\nb\\nc"))) {\n            String line;\n            int n = 0;\n            while ((line = br.readLine()) != null) {\n                n++;\n                System.out.println(n + ": " + line);\n            }\n        } catch (IOException e) {\n            System.out.println("读取出错：" + e.getMessage());\n        }\n    }\n}', out: '1: a\n2: b\n3: c' },
            { t: 'table', head: ['场景', '推荐写法'], rows: [
              ['小文件一次读完', '`Files.readAllLines(path)`'],
              ['写小文件', '`Files.write(path, lines)`'],
              ['大文件逐行读', '`BufferedReader.readLine()` 循环'],
              ['判断存在', '`Files.exists(path)`'],
              ['创建目录', '`Files.createDirectories(path)`']
            ] },
            { t: 'warn', x: '`new StringReader("a\\nb\\nc")` 里的 `\\n` 在 Java 源码里是转义字符，代表换行。如果你在字符串里写了两个字符 `\\` 和 `n`，`readLine` 就找不到换行，只会读到一整行。' },
            { t: 'principle', x: '**能用 `Files` 就别用老的 `FileInputStream`。** `java.nio.file` 这套 API 更短、更安全，还能利用 try-with-resources 自动关闭。' }
          ]
        }
      ]
    }

<script>
/* ---- js/core.js ---- */
/* ============================================================
   CodeCraft · 核心逻辑（纯函数，不依赖 DOM）
   计划生成 / 进度范围 / 每日打卡出题 / 答案比对
   ============================================================ */
window.CORE = (function () {
  'use strict';

  /* ---------------- 基础工具 ---------------- */
  function fmtDate(d) {
    const p = n => (n < 10 ? '0' : '') + n;
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function todayKey() { return fmtDate(new Date()); }
  function parseDate(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
    if (!m) return new Date();
    return new Date(+m[1], +m[2] - 1, +m[3]);
  }
  function diffDays(a, b) {
    const d1 = parseDate(a), d2 = parseDate(b);
    return Math.round((d2 - d1) / 86400000);
  }
  function addDays(s, n) {
    const d = parseDate(s);
    d.setDate(d.getDate() + n);
    return fmtDate(d);
  }
  function hashStr(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, rnd) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ---------------- 课程索引 ---------------- */
  const idxCache = {};
  function index(lang) {
    if (idxCache[lang.id]) return idxCache[lang.id];
    const CH = {}, LMAP = {}, ALL = [], QMAP = {}, KMAP = {}, CH_Q = {}, CH_K = {};
    lang.chapters.forEach((c, ci) => {
      const chapter = Object.assign({}, c, { idx: ci });
      CH[c.id] = chapter;
      c.lessons.forEach((l, li) => {
        const item = Object.assign({}, l, {
          ch: c.id, chTitle: c.title, chNum: c.num != null ? c.num : ci + 1,
          chIdx: ci, li: li, flat: ALL.length
        });
        LMAP[l.id] = item;
        ALL.push(item);
      });
    });
    (lang.quiz || []).forEach(q => { QMAP[q.id] = q; (CH_Q[q.ch] = CH_Q[q.ch] || []).push(q); });
    (lang.checkin || []).forEach(q => { KMAP[q.id] = q; (CH_K[q.ch] = CH_K[q.ch] || []).push(q); });

    const ix = { CH, LMAP, ALL, QMAP, KMAP, CH_Q, CH_K, chapters: lang.chapters };
    idxCache[lang.id] = ix;
    return ix;
  }

  /* ---------------- 学习计划 ----------------
     规则：
     · 天数少 → 每天多学几课（最多 4 课/天）
     · 天数多 → 每天 1 课，多余的天变成「复习日 / 冲刺日」
     · 每 4 个学习日插一个复习日（如果还有余量）
  */
  function buildPlan(lang, days) {
    const ix = index(lang);
    const lessons = ix.ALL;
    const N = Math.max(3, Math.min(200, Math.floor(days) || 14));

    let learnWanted = N;
    if (N >= 10) learnWanted = Math.round(N * 0.84);
    if (N >= 30) learnWanted = Math.round(N * 0.8);
    learnWanted = Math.max(learnWanted, Math.ceil(lessons.length / 4));
    learnWanted = Math.min(learnWanted, Math.max(1, lessons.length));
    const learnDays = Math.max(1, Math.min(N, learnWanted));

    // 均衡切分课时
    const base = Math.floor(lessons.length / learnDays);
    const rem = lessons.length % learnDays;
    const chunks = [];
    let p = 0;
    for (let i = 0; i < learnDays; i++) {
      const size = base + (i < rem ? 1 : 0);
      chunks.push(lessons.slice(p, p + size));
      p += size;
    }

    const list = [];
    let n = 0;
    chunks.forEach((ch, i) => {
      if (!ch.length) return;
      list.push({
        n: ++n, type: 'learn',
        title: ch.map(l => l.title).join(' + ').slice(0, 80),
        chIds: uniq(ch.map(l => l.ch)),
        lessons: ch.map(l => ({ id: l.id, title: l.title, ch: l.ch, time: l.time || 10 })),
        desc: ch.length > 1
          ? '先读 ' + ch[0].title + ' 的讲解 → 跑示例 → 再看 ' + ch[ch.length - 1].title + '，最后做本章测试'
          : '读讲解 → 跑示例代码 → 做本章测试题，把这一课真正拿下来'
      });
    });

    const rest = N - list.length;
    if (rest > 0) {
      const reviewCount = Math.min(rest, Math.max(1, Math.round(rest * 0.42)));
      const sprintCount = rest - reviewCount;
      const chs = lang.chapters.map(c => c.id);

      /* 先按「复习 / 冲刺」交替生成额外日 */
      const extras = [];
      let r = reviewCount, sp = sprintCount, k = 0;
      while (extras.length < rest) {
        if ((k % 2 === 0 && r > 0) || sp === 0) { extras.push('review'); r--; }
        else { extras.push('sprint'); sp--; }
        k++;
      }

      /* 均匀分配到 n+1 个插槽里，再倒序插入，保证下标不被打乱 */
      const n = list.length;
      const buckets = [];
      for (let i = 0; i <= n; i++) buckets.push([]);
      extras.forEach((type, i) => {
        /* 位置取 1..n：永远排在学习日之后，第 1 天一定是学习日 */
        let pos = extras.length === 1
          ? Math.max(1, Math.floor(n / 2))
          : 1 + Math.round(i * (n - 1) / (extras.length - 1));
        buckets[Math.max(1, Math.min(n, pos))].push(type);
      });

      let sprintRound = 0;
      for (let p = n; p >= 0; p--) {
        const types = buckets[p];
        if (!types.length) continue;
        const prev = list[Math.max(0, p - 1)];
        const chIds = uniq(prev && prev.chIds && prev.chIds.length ? prev.chIds : [chs[0]]);
        const days = types.map(type => {
          if (type === 'review') {
            const c = ix.CH[chIds[0]];
            return {
              n: 0, type: 'review',
              title: '复习日 · ' + (c ? c.title : '错题清零'),
              chIds: chIds,
              lessons: [],
              desc: '把错题本里这几章的题重做一遍，错的题才是真正的知识盲区；再回读一遍最不熟的那一课'
            };
          }
          const chId = chs[sprintRound % chs.length];
          const c = ix.CH[chId];
          sprintRound++;
          return {
            n: 0, type: 'sprint',
            title: '冲刺 · ' + (c ? c.title : lang.name) + (sprintRound > chs.length ? ' 加练' : ''),
            chIds: [chId],
            lessons: [],
            desc: '从本章随机抽题连做，做完看错题解析；这一天的目标是「不用翻笔记也能写对」'
          };
        });
        list.splice.apply(list, [p, 0].concat(days));
      }
    }

    list.forEach((d, i) => { d.n = i + 1; });
    return {
      lang: lang.id, days: list.length, requested: N,
      learnDays: list.filter(d => d.type === 'learn').length,
      plan: list
    };
  }

  function uniq(a) {
    const out = [];
    a.forEach(x => { if (out.indexOf(x) < 0) out.push(x); });
    return out;
  }

  /* ---------------- 进度 ---------------- */
  function doneCount(lang, st) {
    const ix = index(lang);
    return ix.ALL.filter(l => st.done[l.id]).length;
  }
  function chapterPct(lang, st, chId) {
    const ix = index(lang);
    const ls = ix.CH[chId] ? ix.CH[chId].lessons : [];
    if (!ls.length) return 0;
    return Math.round(ls.filter(l => st.done[l.id]).length / ls.length * 100);
  }
  function overallPct(lang, st) {
    const ix = index(lang);
    const lp = ix.ALL.length ? doneCount(lang, st) / ix.ALL.length : 0;
    const qt = (lang.quiz || []).length || 1;
    const qp = Math.min(1, Object.keys(st.solved).length / qt);
    return Math.round((lp * 0.55 + qp * 0.45) * 100);
  }
  /* 已学范围：最后一个已读课时所在章节（含）之前的所有章节 */
  function learnedChapters(lang, st) {
    const ix = index(lang);
    let lastIdx = -1;
    ix.ALL.forEach(l => { if (st.done[l.id]) lastIdx = Math.max(lastIdx, l.chIdx); });
    if (lastIdx < 0) lastIdx = 0;
    return lang.chapters.slice(0, lastIdx + 1).map(c => c.id);
  }
  function nextLesson(lang, st) {
    const ix = index(lang);
    for (const l of ix.ALL) if (!st.done[l.id]) return l;
    return ix.ALL[ix.ALL.length - 1] || null;
  }
  function streak(st) {
    let c = 0;
    const d = new Date();
    for (let i = 0; i < 730; i++) {
      const rec = st.days[fmtDate(d)];
      if (rec && rec.checkin) c++;
      else if (i > 0) break;
      d.setDate(d.getDate() - 1);
    }
    return c;
  }
  function planDayOf(plan, startDate, dateKey) {
    if (!plan || !plan.plan || !plan.plan.length) return null;
    const d = diffDays(startDate, dateKey || todayKey());
    const i = Math.max(0, Math.min(plan.plan.length - 1, d));
    return plan.plan[i];
  }
  function dayDone(st, day) {
    if (!day) return false;
    if (day.type === 'learn') return day.lessons.length > 0 && day.lessons.every(l => st.done[l.id]);
    return false;
  }

  /* ---------------- 每日打卡出题 ----------------
     硬性约束：打卡题库（checkin）与章节测试题库（quiz）完全隔离
     —— 不同 id、不同题干，且再按 id 交叉过滤一次防呆。
  */
  const LEVELS = {
    easy:   { name: '轻松', total: 4, theory: 2, code: 1, desc: '每天 4 题，适合忙碌日，保持手感不断档' },
    normal: { name: '标准', total: 6, theory: 3, code: 2, desc: '每天 6 题，默认节奏，稳扎稳打' },
    hard:   { name: '挑战', total: 8, theory: 4, code: 3, desc: '每天 8 题，含更多实景编程，进步最快' }
  };

  function pickCheckin(lang, st, dateKey, level) {
    const ix = index(lang);
    const cfg = LEVELS[level] || LEVELS.normal;
    const quizIds = new Set(Object.keys(ix.QMAP));
    const scope = learnedChapters(lang, st);
    const near = st.daily[dateKey];

    // 最近两天出过的题往后排，避免连着重复
    const recent = new Set();
    [addDays(dateKey, -1), addDays(dateKey, -2)].forEach(dk => {
      const rec = st.daily[dk];
      if (rec && rec.qids) rec.qids.forEach(id => recent.add(id));
    });

    let pool = (lang.checkin || []).filter(q => scope.indexOf(q.ch) >= 0 && !quizIds.has(q.id));
    if (pool.length < cfg.total + 2) {
      // 已学章节的题不够一天用时，放宽到全书（但仍不碰章节测试题）
      pool = (lang.checkin || []).filter(q => !quizIds.has(q.id));
    }
    const rnd = mulberry32(hashStr(lang.id + '|' + dateKey + '|' + level));
    const fresh = shuffle(pool.filter(q => !recent.has(q.id)), rnd);
    const older = shuffle(pool.filter(q => recent.has(q.id)), rnd);
    const ordered = fresh.concat(older);

    const picked = [];
    const takeOne = fn => {
      for (const q of ordered) {
        if (picked.indexOf(q) >= 0) continue;
        if (fn(q)) { picked.push(q); return true; }
      }
      return false;
    };

    // 1) 先保证一道实景编程题
    takeOne(q => q.type === 'code' && q.scene);
    // 2) 再补编程题到配额
    for (let i = 0; i < cfg.code && picked.filter(q => q.type === 'code').length < cfg.code; i++) {
      takeOne(q => q.type === 'code');
    }
    // 3) 理论题：选择 / 输出预测交替
    let guard = 0;
    while (picked.filter(q => q.type !== 'code').length < cfg.theory && guard < 40) {
      guard++;
      const wantChoice = picked.filter(q => q.type !== 'code').length % 2 === 0;
      if (!takeOne(q => q.type !== 'code' && (wantChoice ? q.type === 'choice' : q.type === 'output'))) {
        if (!takeOne(q => q.type !== 'code')) break;
      }
    }
    // 4) 不够就随便补
    while (picked.length < cfg.total && picked.length < ordered.length) {
      if (!takeOne(() => true)) break;
    }

    const out = shuffle(picked, rnd);
    // 最终防呆：绝对不能出现章节测试同 id 的题
    return out.filter(q => !quizIds.has(q.id)).map(q => q.id);
  }

  /* ---------------- 题库隔离自检 ---------------- */
  function auditBank(lang) {
    const quiz = lang.quiz || [], chk = lang.checkin || [];
    const qid = new Set(quiz.map(q => q.id));
    const kid = new Set(chk.map(q => q.id));
    const dupId = [...kid].filter(id => qid.has(id));
    const norm = s => String(s || '').replace(/<[^>]+>/g, '').replace(/\s+/g, '');
    const qp = new Map(quiz.map(q => [norm(q.prompt) + '|' + norm(q.code || ''), q.id]));
    const dupPrompt = [];
    chk.forEach(q => {
      const k = norm(q.prompt) + '|' + norm(q.code || '');
      if (qp.has(k)) dupPrompt.push(q.id + ' ↔ ' + qp.get(k));
    });
    const missingQuizCh = quiz.filter(q => !index(lang).CH[q.ch]).map(q => q.id);
    const missingChkCh = chk.filter(q => !index(lang).CH[q.ch]).map(q => q.id);
    return { quiz: quiz.length, checkin: chk.length, dupId, dupPrompt, missingQuizCh, missingChkCh,
             ok: !dupId.length && !dupPrompt.length && !missingQuizCh.length && !missingChkCh.length };
  }

  /* ---------------- 答案比对 ---------------- */
  function normalizeOut(s) {
    return String(s == null ? '' : s)
      .replace(/\r\n?/g, '\n')
      .split('\n').map(l => l.replace(/[ \t]+$/g, '')).join('\n')
      .replace(/^\n+/, '').replace(/\n+$/, '');
  }
  function sameOut(got, want) {
    return normalizeOut(got) === normalizeOut(want);
  }

  return {
    fmtDate, todayKey, parseDate, diffDays, addDays, hashStr, mulberry32, shuffle,
    index, buildPlan, LEVELS,
    doneCount, chapterPct, overallPct, learnedChapters, nextLesson, streak,
    planDayOf, dayDone, pickCheckin, auditBank, normalizeOut, sameOut
  };
})();
