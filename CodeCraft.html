  };
  App.planDayIdx = function (dateKey) {
    const st = App.st;
    if (!st || !st.plan) return 0;
    const start = st.startDate || App.S.profile.startDate || CORE.todayKey();
    const d = CORE.diffDays(start, dateKey || CORE.todayKey());

    const S = App.S;
    const st = App.langState(id);
    if (!st.plan || !st.planDays) {
      /* 第一次进入这门语言：沿用当前的天数偏好 */
      const days = S.profile.days || 21;
      st.planDays = days;
      st.startDate = CORE.todayKey();
      st.plan = CORE.buildPlan(LANGS[id], days);
    }
    S.profile.lang = id;
    S.profile.days = st.planDays;
    S.profile.startDate = st.startDate || S.profile.startDate;
    App.save();
    App.bindLang(id);
    initShell();
    App.go('#/home');
    App.toast('已切换到 ' + LANGS[id].name + '，进度单独保存', 'ok');
  };

  /* ---------------- 顶栏 / 侧边栏 ---------------- */
  function initShell() {
    const L = App.L, st = App.st;
    if (!L) return;
    document.getElementById('lang-ico').textContent = L.icon;
    document.getElementById('lang-name').textContent = L.name;
    document.getElementById('brand-sub').textContent = L.name + ' 训练场';
    document.querySelectorAll('#level-switch button').forEach(b => {
      b.classList.toggle('on', b.getAttribute('data-level') === (st.level || 'normal'));
    });
    document.getElementById('streak-num').textContent = CORE.streak(st);
    document.getElementById('btn-settings').onclick = () => App.go('#/settings');
    document.getElementById('lang-pill').onclick = () => App.openLangPicker();

    document.querySelectorAll('#level-switch button').forEach(b => {
      b.onclick = () => {
        st.level = b.getAttribute('data-level');
        App.save();
        initShell();
        const d = st.daily[CORE.todayKey()];
        if (d) { delete st.daily[CORE.todayKey()]; App.save(); }
        App.toast('难度：' + CORE.LEVELS[st.level].name + ' · 每天 ' + CORE.LEVELS[st.level].total + ' 题');
        if (location.hash.indexOf('#/daily') === 0) App.route();
      };
    });
  }
  App.initShell = initShell;

  function renderSidebar(activeLesson, activeCh) {
    const L = App.L, st = App.st, ix = App.ix;
    const nav = document.getElementById('sidebar-nav');
    const hash = location.hash || '#/home';
    const link = (href, icon, text, on, extra) =>
      '<a class="nav-link' + (on ? ' active' : '') + '" href="' + href + '">' +
      '<span class="ico">' + icon + '</span><span>' + text + '</span>' + (extra || '') + '</a>';

    let h = '<div class="nav-group-title">学习面板</div>';
    h += link('#/home', '🏠', '总览与今日任务', hash === '#/home' || hash === '' || hash === '#/');
    h += link('#/daily', '📅', '每日打卡', hash.indexOf('#/daily') === 0);
    h += link('#/plan', '🗺️', '我的 ' + (st.plan ? st.plan.days : App.S.profile.days) + ' 天计划', hash.indexOf('#/plan') === 0);
    h += link('#/calendar', '🔥', '打卡记录', hash.indexOf('#/calendar') === 0);
    h += link('#/lab', '🧪', '代码实验室', hash.indexOf('#/lab') === 0);
    h += link('#/wrong', '📕', '错题本 (' + Object.keys(st.wrong).length + ')', hash.indexOf('#/wrong') === 0);
    h += link('#/settings', '⚙️', '设置与备份', hash.indexOf('#/settings') === 0);

    h += '<div class="nav-group-title">' + esc(L.name) + ' 课程目录</div><div class="nav-chapters">';
    L.chapters.forEach((c, ci) => {
      const pct = CORE.chapterPct(L, st, c.id);
      const isOn = activeCh === c.id;
      const allDone = pct === 100;
      h += '<div class="ch-wrap">';
      h += '<div class="ch-head' + (isOn ? ' on' : '') + (allDone ? ' done' : '') + '" data-ch="' + c.id + '">' +
        '<span class="ch-num">' + (allDone ? '✓' : (c.num != null ? c.num : ci + 1)) + '</span>' +
        '<span class="ch-name">' + esc(c.title) + '</span>' +
        '<span class="ch-pct">' + pct + '%</span></div>';
      h += '<div class="ch-rest' + (isOn ? ' show' : '') + '">';
      c.lessons.forEach(l => {
        h += '<div class="ch-lesson' + (st.done[l.id] ? ' read' : '') + (activeLesson === l.id ? ' active' : '') +
          '" data-lesson="' + l.id + '"><span class="tick">✓</span><span>' + esc(l.title) + '</span></div>';
      });
      h += '</div></div>';
    });
    h += '</div>';
    nav.innerHTML = h;

    nav.querySelectorAll('.ch-head').forEach(el => {
      el.addEventListener('click', e => {
        const id = el.getAttribute('data-ch');
        const rest = el.nextElementSibling;
        const wasOpen = rest.classList.contains('show');
        nav.querySelectorAll('.ch-rest').forEach(r => r.classList.remove('show'));
        nav.querySelectorAll('.ch-head').forEach(r => r.classList.remove('on'));
        if (!wasOpen) { rest.classList.add('show'); el.classList.add('on'); }
        if (!activeCh || activeCh !== id) App.go('#/ch/' + id);
      });
    });
    nav.querySelectorAll('[data-lesson]').forEach(el => {
      el.addEventListener('click', () => App.go('#/lesson/' + el.getAttribute('data-lesson')));
    });

    const pct = CORE.overallPct(L, st);
    const mpText = document.getElementById('mp-text');
    if (mpText) {
      mpText.textContent = pct + '%';
      document.getElementById('mp-bar').style.width = pct + '%';
      document.getElementById('mp-sub').textContent =
        '已读 ' + CORE.doneCount(L, st) + ' / ' + ix.ALL.length + ' 课 · 做对 ' +
        Object.keys(st.solved).length + ' 题';
    }
  }

  /* ---------------- 路由 ---------------- */
  App.route = function () {
    const hash = location.hash || '#/home';
    const parts = hash.replace(/^#\/?/, '').split('/');
    const page = parts[0] || 'home';
    const view = document.getElementById('view');
    const sidebar = document.getElementById('sidebar');
    if (sidebar) sidebar.classList.remove('open');

    if (!App.L || !App.st) {
      view.innerHTML = '<div class="empty">正在准备…</div>';
      return;
    }
    UI.resetStore();
    window.scrollTo({ top: 0, behavior: 'auto' });

    try {
      if (page === 'lesson') {
        const l = App.ix.LMAP[parts[1]];
        if (!l) { view.innerHTML = '<div class="empty">没有找到这一课</div>'; return; }
        renderSidebar(l.id, l.ch);
        App.renderLesson(l);
      } else if (page === 'ch') {
        const c = App.ix.CH[parts[1]];
        if (!c) { view.innerHTML = '<div class="empty">没有找到这一章</div>'; return; }
        renderSidebar(null, c.id);
        App.renderChapter(c);
      } else if (page === 'practice') {
        const c = App.ix.CH[parts[1]];
        if (!c) { view.innerHTML = '<div class="empty">没有找到这一章</div>'; return; }
        renderSidebar(null, c.id);
        App.renderPractice(c);
      } else if (page === 'daily') { renderSidebar(null, null); App.renderDaily(); }
      else if (page === 'plan') { renderSidebar(null, null); App.renderPlan(); }
      else if (page === 'calendar') { renderSidebar(null, null); App.renderCalendar(); }
      else if (page === 'lab') { renderSidebar(null, null); App.renderLab(); }
      else if (page === 'wrong') { renderSidebar(null, null); App.renderWrong(); }
      else if (page === 'settings') { renderSidebar(null, null); App.renderSettings(); }
      else { renderSidebar(null, null); App.renderHome(); }
    } catch (err) {
      view.innerHTML = '<div class="empty">页面渲染出错：' + esc(err && err.message) +
        '<br><button class="btn btn-ghost btn-sm" onclick="location.reload()" style="margin-top:12px">刷新重试</button></div>';
      console.error(err);
    }
  };

  /* ---------------- 启动 ---------------- */
  App.boot = function () {
    App.load();
    window.addEventListener('hashchange', App.route);

    document.querySelector('.brand').addEventListener('click', e => {
      e.preventDefault();
      App.go('#/home');
    });
    const menu = document.getElementById('btn-menu');
    if (menu) menu.addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('open');
    });

    if (!App.S.profile.lang || !LANGS[App.S.profile.lang]) {
      App.showOnboarding();
      return;
    }

    App.bindLang(App.S.profile.lang);
    const st = App.st;
    if (!st.plan || !st.plan.plan || !st.plan.plan.length) {
      /* 老数据 / 计划丢失：按已选天数重建，不动已有进度 */
      st.planDays = st.planDays || App.S.profile.days || 21;
      st.startDate = st.startDate || App.S.profile.startDate || CORE.todayKey();
      st.plan = CORE.buildPlan(App.L, st.planDays);
      App.save();
    }
    initShell();
    if (!location.hash) location.hash = '#/home';
    App.route();
  };

  window.addEventListener('DOMContentLoaded', App.boot);
})();


/* ---- js/app-learn.js ---- */
/* ============================================================
   CodeCraft · 学习页面：首页 / 课时 / 章节
   ============================================================ */
(function () {
  'use strict';

  const App = window.App, UI = App.UI, CORE = App.CORE, esc = UI.esc;

  /* 代码块：运行 / 复制 */
  App.bindCodeBoxes = function (root) {
    root = root || document.getElementById('view');
    root.querySelectorAll('[data-run]').forEach(btn => {
      if (btn.__bound) return;
      btn.__bound = 1;
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-run');
        const lang = btn.getAttribute('data-lang') || (App.L ? App.L.id : 'python');
        const code = UI.getCode(id);
        const out = root.querySelector('[data-out-for="' + id + '"]');
        const box = btn.closest('.codebox');
        const old = btn.textContent;
        btn.textContent = '运行中…';
        btn.disabled = true;
        if (out) { out.hidden = false; out.classList.remove('err'); out.textContent = '正在编译运行…'; }
        const r = await window.Runner.run(lang, code, '');
        btn.textContent = old;
        btn.disabled = false;
        if (!out) return;
        if (r.ok) {
          out.hidden = false;
          out.classList.remove('err');
          out.textContent = r.out || '(没有输出)';
          out.style.color = '#2b4a37';
          out.style.background = '#f6faf7';
        } else {
          out.hidden = false;
          out.classList.add('err');
          out.textContent = (r.err || '运行失败') + (r.note ? '\n— ' + r.note : '');
        }
        if (box) box.setAttribute('data-ran', '1');
      });
    });
    root.querySelectorAll('[data-copy]').forEach(btn => {
      if (btn.__bound) return;
      btn.__bound = 1;
      btn.addEventListener('click', () => {
        const code = UI.getCode(btn.getAttribute('data-copy')) || '';
        const done = () => App.toast('代码已复制', 'ok');
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(done).catch(() => fallbackCopy(code, done));
        } else fallbackCopy(code, done);
      });
    });
  };

  function fallbackCopy(text, cb) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); cb(); } catch (e) { App.toast('复制失败，请手动选中', 'bad'); }
    ta.remove();
  }

  function langHeroHtml(extra) {
    const L = App.L, st = App.st;
    const pct = CORE.overallPct(L, st);
    return '<div class="lang-hero" style="background:linear-gradient(135deg,' + L.color + ' 0%,' + shade(L.color, 18) + ' 100%)">' +
      '<h2><span>' + L.icon + '</span>' + esc(L.name) + ' · ' + esc(L.en) + '</h2>' +
      '<p>' + esc(L.blurb) + '</p>' +
      '<div class="lh-stats">' +
        '<div><b>' + pct + '%</b>总进度</div>' +
        '<div><b>' + CORE.doneCount(L, st) + '/' + App.ix.ALL.length + '</b>已读课时</div>' +
        '<div><b>' + Object.keys(st.solved).length + '</b>做对的题</div>' +
        '<div><b>' + CORE.streak(st) + '</b>连续打卡</div>' +
        (extra || '') +
      '</div></div>';
  }
  App.langHeroHtml = langHeroHtml;

  function shade(hex, amt) {
    const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '#2f6be0');
    if (!m) return '#2f6be0';
    const c = [1, 2, 3].map(i => Math.min(255, parseInt(m[i], 16) + amt));
    return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
  }

  /* ---------------- 首页 ---------------- */
  App.renderHome = function () {
    const view = document.getElementById('view');

    h += '<div class="dash-grid">';

    } else {

    }

    if (nextL) {
      h += '<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">' +

    /* 右：打卡 */
    h += '<div class="dash-card"><h4>🔥 今日打卡 <span class="sp"></span>' +
      '<a href="#/calendar">记录</a></h4>';
    const answered = dq ? dq.qids.filter(id => dq.answers[id] && dq.answers[id].ok).length : 0;
    const total = dq ? dq.qids.length : level.total;
    h += '<div style="display:flex;align-items:center;gap:14px;margin-bottom:6px">' +
      '<div style="position:relative;flex:none">' + UI.ring(checked ? 100 : (total ? answered / total * 100 : 0), 74, checked ? '#0f9d58' : '#2f6be0') +
      '<div style="position:absolute;inset:0;display:grid;place-items:center;font-size:16px;font-weight:800;color:' +
      (checked ? '#0f9d58' : '#1c2431') + '">' + (checked ? '✓' : answered + '/' + total) + '</div></div>' +
      '<div style="font-size:12.5px;color:#4b5768;line-height:1.8">' +
        (checked
          ? '<b style="color:#0f9d58">今天已经打卡</b><br>连续 ' + CORE.streak(st) + ' 天，保持住'
          : '<b>' + (total - answered) + ' 题还没做完</b><br>完成后即可打卡 · ' + level.name + '模式') +
      '</div></div>';
    h += '<div style="font-size:11.5px;color:#7c8798;line-height:1.7;margin:10px 0 12px">' +
      '打卡题按你当前学到的章节出，和章节测试题完全不重复。</div>';
    h += '<a class="btn btn-primary btn-sm" href="#/daily" style="width:100%">' +
      (checked ? '看看今天的题' : '去做今日打卡 →') + '</a>';
    if (checked) {
      h += '<div style="margin-top:10px;text-align:center;font-size:12px;color:#7c8798">' +
        '今天读了 ' + (rec.lessons || 0) + ' 课，做对 ' + (rec.solved || 0) + ' 题</div>';
    }
    h += '</div>';
    h += '</div>';

    /* 章节进度 */
    h += '<div class="dash-card" style="margin-top:16px"><h4>📚 章节进度 <span class="sp"></span>' +
      '<a href="#/plan">我的计划</a></h4><div class="point-grid">' +
      L.chapters.map((c, i) => {

        return '<div class="point-card' + (pct === 100 ? ' read' : '') + '" data-go="#/ch/' + c.id + '" style="cursor:pointer">' +
          '<div class="pc-title">' + (c.icon || '📘') + ' 第 ' + (c.num != null ? c.num : i + 1) + ' 章 · ' + esc(c.title) + '</div>' +

    if (b2) b2.onclick = () => App.go('#/settings');
  };

  /* ---------------- 课时 ---------------- */
  App.renderLesson = function (l) {
    const view = document.getElementById('view');
    const L = App.L, st = App.st;
    const ch = App.ix.CH[l.ch];
    const idx = App.ix.ALL.indexOf(l);
    const prev = App.ix.ALL[idx - 1];
    const next = App.ix.ALL[idx + 1];
    const done = !!st.done[l.id];

    let h = '';
    h += '<div class="crumb"><a href="#/home">总览</a> / <a href="#/ch/' + l.ch + '">' + esc(l.chTitle) + '</a> / <span>' + esc(l.title) + '</span></div>';
    h += '<div class="page-head"><div><h1 style="margin:0 0 8px">' + esc(l.title) + '</h1>' +
      '<div class="chips">' +
      '<span class="tag tag-blue">' + esc(L.name) + '</span>' +
      '<span class="tag tag-gray">约 ' + (l.time || 10) + ' 分钟</span>' +
      (l.key ? '<span class="tag tag-purple">' + esc(l.key) + '</span>' : '') +
      (done ? '<span class="tag tag-green">✓ 已读完</span>' : '') +
      '</div></div></div>';

    h += '<div class="card card-pad" style="margin-top:16px"><div class="lesson-body">' +
      UI.blocksHtml(l.blocks, L.id) + '</div>';

    h += '<div class="lesson-nav">';
    h += prev
      ? '<a class="btn btn-ghost" href="#/lesson/' + prev.id + '"><small>← 上一课</small>' + esc(prev.title) + '</a>'
      : '<span style="flex:1"></span>';
    h += next
      ? '<a class="btn btn-primary next" href="#/lesson/' + next.id + '"><small>' + (done ? '下一课 →' : '我学完了，下一课 →') + '</small>' + esc(next.title) + '</a>'
      : '<a class="btn btn-primary next" href="#/practice/' + l.ch + '"><small>全部课时读完了 →</small>去做本章测试</a>';
    h += '</div></div>';

    h += '<div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">' +
      '<button class="btn ' + (done ? 'btn-ghost' : 'btn-ok') + '" id="mark-done">' +
      (done ? '✓ 已标记学完（点击取消）' : '✓ 我学完了这一课') + '</button>' +
      '<a class="btn btn-ghost" href="#/practice/' + l.ch + '">做本章测试（' + (App.ix.CH_Q[l.ch] || []).length + ' 题）</a>' +
      '<a class="btn btn-ghost" href="#/lab">在实验室里试试</a></div>';

    view.innerHTML = h;

    App.bindCodeBoxes(view);
    const btn = view.querySelector('#mark-done');
    if (btn) btn.addEventListener('click', () => {
      if (st.done[l.id]) {
        delete st.done[l.id];
        App.toast('已取消标记');
      } else {
        st.done[l.id] = true;
        st.doneAt = st.doneAt || {};
        st.doneAt[l.id] = CORE.todayKey();
        App.touchDay('lessons', 1);
        App.toast('这一课拿下了 ✓ 进度已保存', 'ok');
      }
      App.save();
      App.route();
    });
  };

  /* ---------------- 章节 ---------------- */
  App.renderChapter = function (c) {

      '<div style="position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:800">' + pct + '%</div></div></div></div>';

    if (c.goals && c.goals.length) {

/* ---- js/app-quiz.js ---- */
/* ============================================================
   CodeCraft · 题目引擎（选择 / 输出预测 / 编程题）
   ============================================================ */
(function () {
  'use strict';

  const App = window.App, UI = App.UI, CORE = App.CORE, esc = UI.esc;
  const DIFF = { 1: '基础', 2: '进阶', 3: '挑战' };
  const TYPE = { choice: '单选题', output: '输出预测', code: '编程题' };

  /* ---------------- 记录 ---------------- */
  App.record = function (q, ok, ctx) {
    const st = App.st;
    st.tries[q.id] = (st.tries[q.id] || 0) + 1;
    if (ok) {
      if (!st.solved[q.id]) {
        st.solved[q.id] = true;
        if (!ctx || !ctx.silent) App.touchDay('solved', 1);
      }
      delete st.wrong[q.id];
    } else {
      if (!st.solved[q.id]) st.wrong[q.id] = true;
    }
    if (ctx && ctx.daily) {
      const day = st.daily[CORE.todayKey()];
      if (day) {
        const a = day.answers[q.id] || { tries: 0, ok: false };
        a.tries++;
        a.ok = a.ok || !!ok;
        day.answers[q.id] = a;
      }
    }
    App.save();
  };

  /* ---------------- 卡片 HTML ---------------- */
  function qCardHtml(q, i, ctx) {
    const st = App.st;
    const solved = !!st.solved[q.id];
    const tries = st.tries[q.id] || 0;
    const srcLabel = ctx && ctx.src === 'daily' ? '每日打卡' : (ctx && ctx.src === 'wrong' ? '错题重做' : '章节测试');

    let h = '<div class="qcard' + (solved ? ' solved' : '') + '" data-qid="' + q.id + '">';
    h += '<div class="q-head"><span class="q-idx">' + (i + 1) + '</span>' +
      '<span class="tag tag-blue">' + (TYPE[q.type] || '题') + '</span>' +
      '<span class="tag ' + (q.diff >= 3 ? 'tag-red' : q.diff === 2 ? 'tag-yellow' : 'tag-gray') + '">' +
      (DIFF[q.diff] || '基础') + '</span>' +
      (q.point ? '<span class="tag tag-purple">' + esc(q.point) + '</span>' : '') +
      '<span class="q-src">' + srcLabel + '</span><span style="flex:1"></span>' +
      (solved ? '<span class="tag tag-green">✓ 已做对</span>' :
        (tries ? '<span class="tag tag-red">错了 ' + tries + ' 次</span>' : '')) +
      '</div>';

    if (q.scene) h += '<div class="scene"><b>场景</b>　' + UI.inline(q.scene) + '</div>';
    h += '<div class="q-prompt">' + UI.inline(q.prompt) + '</div>';
    if (q.code) h += UI.codeBox(q.code, { lang: App.L.id, run: false, label: App.L.name });

    if (q.type === 'choice') {
      h += '<div class="opts">' + q.opts.map((o, oi) =>
        '<div class="opt" data-opt="' + oi + '"><span class="k">' + String.fromCharCode(65 + oi) + '</span>' +
        '<span>' + UI.inline(o) + '</span></div>').join('') + '</div>';
    } else if (q.type === 'output') {
      h += '<div style="margin:12px 0"><div style="font-size:12px;color:#7c8798;margin-bottom:6px">写下你预计的输出（多行就用回车换行）</div>' +
        '<textarea class="lab-stdin" data-ans rows="3" placeholder="按程序实际打印的内容逐行写"></textarea></div>';
    } else {
      h += '<div data-editor></div>';
    }

    h += '<div class="q-actions">';
    if (q.type !== 'code') h += '<button class="btn btn-primary btn-sm" data-act="check">检查答案</button>';
    else h += '<div style="font-size:12px;color:#7c8798">在编辑器里写代码，点「运行测试」自动比对用例。</div>';
    h += '<button class="btn btn-ghost btn-sm" data-act="explain">看解析</button>';
    if (q.type === 'code' || q.type === 'output') {
      if (q.solution) h += '<button class="btn btn-ghost btn-sm" data-act="solution">参考答案</button>';
    }
    h += '<span class="sp" style="flex:1"></span><span data-state style="font-size:12px;color:#7c8798"></span></div>';
    h += '<div class="q-expl" hidden>' + UI.inline(q.explain || '') + '</div>';
    if (q.solution) h += '<div data-sol hidden style="margin-top:10px"></div>';
    h += '</div>';
    return h;
  }
  App.qCardHtml = qCardHtml;

  /* ---------------- 绑定 ---------------- */
  function bindQuestion(card, q, ctx) {
    const st = App.st;
    const stateEl = card.querySelector('[data-state]');
    const expl = card.querySelector('.q-expl');
    const say = (t, color) => { if (stateEl) { stateEl.textContent = t; stateEl.style.color = color || '#7c8798'; } };

    function markSolved() {
      card.classList.add('solved');
      App.record(q, true, ctx);
      say('✓ 正确', '#0f9d58');
      if (expl) expl.hidden = false;
      if (ctx && ctx.onChange) ctx.onChange();
    }
    function markWrong(msg) {
      App.record(q, false, ctx);
      say(msg || '✕ 再想想', '#e04a4a');
      if (expl) expl.hidden = false;
      if (ctx && ctx.onChange) ctx.onChange();
    }

    const exBtn = card.querySelector('[data-act="explain"]');
    if (exBtn) exBtn.addEventListener('click', () => {
      expl.hidden = !expl.hidden;
      exBtn.textContent = expl.hidden ? '看解析' : '收起解析';
    });

    const solBtn = card.querySelector('[data-act="solution"]');
    if (solBtn) solBtn.addEventListener('click', () => {
      const box = card.querySelector('[data-sol]');
      box.hidden = !box.hidden;
      if (!box.innerHTML) {
        box.innerHTML = UI.codeBox(q.solution, { lang: App.L.id, run: true, label: '参考实现' }) +
          (q.solutionNote ? '<div style="font-size:12.5px;color:#7c8798;margin-top:6px">' + UI.inline(q.solutionNote) + '</div>' : '');
        App.bindCodeBoxes(card);
      }
    });

    /* --- 选择题 --- */
    if (q.type === 'choice') {
      const opts = card.querySelectorAll('.opt');
      opts.forEach(op => op.addEventListener('click', () => {
        if (card.classList.contains('solved')) return;
        const pick = +op.getAttribute('data-opt');
        opts.forEach(o => o.classList.remove('sel'));
        op.classList.add('sel');
        opts.forEach(o => o.classList.remove('right', 'wrong'));
        if (pick === q.ans) {
          op.classList.add('right');
          markSolved();
        } else {
          op.classList.add('wrong');
          opts[q.ans].classList.add('right');
          markWrong('✕ 选错了，正确答案是 ' + String.fromCharCode(65 + q.ans));
        }
      }));
      return;
    }

    /* --- 输出预测 --- */
    if (q.type === 'output') {
      const ta = card.querySelector('[data-ans]');
      const btn = card.querySelector('[data-act="check"]');
      if (q.answer && btn) btn.addEventListener('click', () => {
        if (card.classList.contains('solved')) return;
        const got = ta.value;
        if (!got.trim()) { say('先写点什么', '#b7791f'); return; }
        if (CORE.sameOut(got, q.answer)) {
          markSolved();
        } else {
          const hint = UI.diffHint(got, q.answer);
          markWrong('✕ 不对：' + hint.replace(/<[^>]+>/g, '').slice(0, 60));
          if (expl) expl.hidden = false;
        }
      });
      return;
    }

    /* --- 编程题 --- */
    if (q.type === 'code') {
      const host = card.querySelector('[data-editor]');
      const tests = q.tests || [];
      let ed;
      ed = UI.mountEditor(host, {
        lang: App.L.id,
        code: st.codeDraft && st.codeDraft[q.id] ? st.codeDraft[q.id] : (q.starter || ''),
        file: 'main.' + UI.extOf(App.L.id),
        hint: tests.length ? tests.length + ' 个测试用例' : '自由练习',
        onRun: code => runTests(code)
      });

      function saveDraft(code) {
        st.codeDraft = st.codeDraft || {};
        st.codeDraft[q.id] = code;
        App.save();
      }

      async function runTests(code) {
        saveDraft(code);
        const resEl = host.querySelector('[data-result]') || (function () {
          const d = document.createElement('div');
          d.setAttribute('data-result', '1');
          host.appendChild(d);
          return d;
        })();
        const btn = host.querySelector('[data-act="run"]');
        if (btn) { btn.disabled = true; btn.textContent = '运行中…'; }

        if (!tests.length) {
          const r = await window.Runner.run(App.L.id, code, '');
          UI.renderRun(resEl, r);
          say(r.ok ? '已运行，自己对照输出' : '运行失败', r.ok ? '#0f9d58' : '#e04a4a');
          if (btn) { btn.disabled = false; btn.textContent = '▶ 运行'; }
          return;
        }

        const rows = [];
        for (let i = 0; i < tests.length; i++) {
          const t = tests[i];
          say('正在跑第 ' + (i + 1) + '/' + tests.length + ' 个用例…');
          let r;
          try { r = await window.Runner.run(App.L.id, code, t.in || ''); }
          catch (e) { r = { ok: false, out: '', err: String(e), phase: 'error', note: '' }; }
          const pass = r.ok && CORE.sameOut(r.out, t.out);
          rows.push({ t: t, r: r, pass: pass });
          if (!r.ok) break;
        }

        const allPass = rows.length === tests.length && rows.every(x => x.pass);
        let html = '<div class="runpanel ' + (allPass ? 'ok' : 'bad') + '"><div class="rp-head">' +
          (allPass ? '✓ 全部用例通过' : '✕ 还有用例没通过') +
          '<span style="margin-left:auto;font-weight:500;font-size:11.5px;opacity:.8">' +
          (rows[0] && rows[0].r.note ? esc(rows[0].r.note) : '') + '</span></div><div class="rp-body">';
        html += '<div class="tests">';
        rows.forEach((x, i) => {
          html += '<div class="test-row" style="display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed #eef2f8;font-size:12.5px">' +
            '<span style="color:' + (x.pass ? '#0f9d58' : '#e04a4a') + ';font-weight:800">' + (x.pass ? '✓' : '✕') + '</span>' +
            '<div style="flex:1"><div style="color:#4b5768">用例 ' + (i + 1) +
            (x.t.in ? ' · 输入 <code>' + esc(x.t.in) + '</code>' : ' · 无输入') + '</div>' +
            '<div style="color:#7c8798;margin-top:2px">期望 <code>' + esc(x.t.out) + '</code></div>' +
            (!x.pass ? '<div style="color:#e04a4a;margin-top:2px">实际 <code>' +
              esc(x.r.ok ? (x.r.out || '(无输出)') : (x.r.err || '运行失败')) + '</code></div>' : '') +
            '</div></div>';
        });
        html += '</div>';
        if (!allPass && rows.some(x => x.r.phase === 'compile')) {
          const cerr = rows.find(x => x.r.phase === 'compile');
          html += '<pre style="margin-top:10px;background:#fdf4f4;color:#a83232;border-radius:8px;padding:10px;white-space:pre-wrap">' +
            esc(cerr.r.err) + '</pre>';
        }
        html += '</div></div>';
        resEl.innerHTML = html;
        if (btn) { btn.disabled = false; btn.textContent = '▶ 运行测试'; }

        if (allPass) {
          if (!card.classList.contains('solved')) markSolved();
          say('✓ 全部通过', '#0f9d58');
        } else {
          markWrong('✕ ' + rows.filter(x => x.pass).length + '/' + tests.length + ' 通过');
        }
      }
      return;
    }
  }
  App.bindQuestion = bindQuestion;

  /* ---------------- 章节测试 ---------------- */
  App.renderPractice = function (c) {
    const view = document.getElementById('view');
    const st = App.st;
    const qs = (App.ix.CH_Q[c.id] || []).slice();
    const solvedN = qs.filter(q => st.solved[q.id]).length;

    let h = '';
    h += '<div class="crumb"><a href="#/home">总览</a> / <a href="#/ch/' + c.id + '">' + esc(c.title) + '</a> / <span>本章测试</span></div>';
    h += '<div class="page-head"><div>' +
      '<h1 style="margin:0 0 8px">🧩 ' + esc(c.title) + ' · 章节测试</h1>' +
      '<p class="page-desc">' + qs.length + ' 道题，覆盖本章全部知识点。做错的题自动进入错题本；这里的题和「每日打卡」的题是两套不同的题库，不会重复。</p>' +
      '</div><div style="text-align:right"><div style="font-size:26px;font-weight:800;letter-spacing:-.5px">' +
      solvedN + '<span style="font-size:14px;color:#7c8798;font-weight:600"> / ' + qs.length + '</span></div>' +
      '<div style="font-size:11.5px;color:#7c8798">已做对</div></div></div>';

    if (!qs.length) {
      h += '<div class="empty">这一章暂时没有配置测试题</div>';
      view.innerHTML = h;
      return;
    }

    h += '<div class="card card-pad" style="margin-top:8px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">' +
      '<div class="bar" style="flex:1;min-width:120px"><i style="width:' + Math.round(solvedN / qs.length * 100) + '%"></i></div>' +
      '<span style="font-size:12.5px;color:#7c8798">' + Math.round(solvedN / qs.length * 100) + '%</span>' +
      '<a class="btn btn-ghost btn-sm" href="#/lesson/' + (c.lessons[0] ? c.lessons[0].id : '') + '">回读本章第一课</a></div></div>';

    h += '<div style="margin-top:16px" id="qlist">' +
      qs.map((q, i) => qCardHtml(q, i, { src: 'quiz', onChange: refresh })).join('') + '</div>';

    view.innerHTML = h;
    qs.forEach(q => {
      const card = view.querySelector('[data-qid="' + q.id + '"]');
      if (card) bindQuestion(card, q, { src: 'quiz', onChange: refresh });
    });
    App.bindCodeBoxes(view);

    function refresh() {
      const n = qs.filter(x => App.st.solved[x.id]).length;
      const bar = view.querySelector('.bar i');
      if (bar) bar.style.width = Math.round(n / qs.length * 100) + '%';
      App.initShell();
    }
  };
})();

/* ============================================================
   CodeCraft · 每日打卡 / 计划 / 日历 / 实验室 / 错题本 / 设置
   ============================================================ */
(function () {
  'use strict';

  const App = window.App, UI = App.UI, CORE = App.CORE, esc = UI.esc;

  /* ================= 每日打卡 ================= */
  function getDaily() {
    const st = App.st, date = CORE.todayKey();
    const level = st.level || 'normal';
    const key = App.VER + '|' + App.L.id + '|' + date + '|' + level;
    let d = st.daily[date];
    const checked = !!(st.days[date] && st.days[date].checkin);
    if (!d || (d.key !== key && !checked && !Object.keys(d.answers || {}).length)) {
      d = {
        key: key, level: level, checked: checked,
        qids: CORE.pickCheckin(App.L, st, date, level),
        answers: (d && d.answers) || {}
      };
      st.daily[date] = d;
      pruneDaily(st);
      App.save();
    }
    return d;
  }

  function pruneDaily(st) {
    const keys = Object.keys(st.daily).sort();
    if (keys.length > 60) {
      keys.slice(0, keys.length - 60).forEach(k => {
        if (!(st.days[k] && st.days[k].checkin)) delete st.daily[k];
      });
    }
  }

  App.renderDaily = function () {
    const view = document.getElementById('view');
    const st = App.st, L = App.L;
    const d = getDaily();
    const cfg = CORE.LEVELS[st.level] || CORE.LEVELS.normal;
    const today = CoreFmt();
    const rec = st.days[CORE.todayKey()] || {};
    const checked = !!rec.checkin;
    const okN = d.qids.filter(id => d.answers[id] && d.answers[id].ok).length;
    const scope = CORE.learnedChapters(L, st).map(id => App.ix.CH[id] ? App.ix.CH[id].title : id);

    let h = '';
    h += '<div class="daily-head"><div class="dh-top">' +
      '<div style="flex:1;min-width:240px">' +
      '<div class="dh-date">' + today + ' · ' + cfg.name + '模式（每天 ' + cfg.total + ' 题）</div>' +
      '<h1 style="margin:6px 0 8px;font-size:22px">📅 ' + esc(L.name) + ' 每日打卡</h1>' +
      '<div style="font-size:12.5px;color:#7c8798;line-height:1.8">' +
      '出题范围：<b style="color:#4b5768">' + esc(scope.join(' / ')) + '</b>（跟着你的学习进度走）<br>' +
      '这一套题来自独立的「打卡题库」，<b style="color:#4b5768">和章节测试题完全不重复</b>。</div></div>' +
      '<div style="text-align:center;flex:none">' +
      '<div style="position:relative;display:inline-block">' + UI.ring(checked ? 100 : Math.round(okN / Math.max(1, d.qids.length) * 100), 92, checked ? '#0f9d58' : '#2f6be0') +
      '<div style="position:absolute;inset:0;display:grid;place-items:center">' +
      '<div style="text-align:center"><div style="font-size:19px;font-weight:800;color:' + (checked ? '#0f9d58' : '#1c2431') + '">' +
      (checked ? '✓' : okN + '/' + d.qids.length) + '</div>' +
      '<div style="font-size:10px;color:#7c8798">' + (checked ? '已打卡' : '做对') + '</div></div></div></div>' +
      '<div style="font-size:11.5px;color:#7c8798;margin-top:8px">🔥 连续 ' + CORE.streak(st) + ' 天</div></div>' +
      '</div>';

    h += '<div class="checkin-bar" style="display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap">';
    if (checked) {
      h += '<span class="tag tag-green" style="font-size:12px;padding:5px 12px">✓ 今天已经打卡</span>' +
        '<span style="font-size:12px;color:#7c8798">今天读了 ' + (rec.lessons || 0) + ' 课，做对 ' + (rec.solved || 0) + ' 题</span>';
    } else {
      h += '<button class="btn btn-primary" id="btn-checkin"' + (okN === d.qids.length ? '' : ' disabled style="opacity:.5;cursor:not-allowed"') + '>🔥 今日打卡</button>' +
        '<span style="font-size:12px;color:#7c8798">' +
        (okN === d.qids.length ? '全部做对，可以打卡了' : '还有 ' + (d.qids.length - okN) + ' 题没做对，做完就能打卡') + '</span>';
    }
    h += '<span style="flex:1"></span>' +
      '<button class="btn btn-ghost btn-sm" id="btn-replan">换一组题</button></div></div>';

    h += '<div id="qlist">' + d.qids.map((id, i) => {
      const q = App.ix.KMAP[id];
      if (!q) return '';
      return App.qCardHtml(q, i, { src: 'daily', daily: true, onChange: refresh });
    }).join('') + '</div>';

    view.innerHTML = h;

    d.qids.forEach((id, i) => {
      const q = App.ix.KMAP[id];
      const card = view.querySelector('[data-qid="' + id + '"]');
      if (card && q) App.bindQuestion(card, q, { src: 'daily', daily: true, onChange: refresh });
    });
    App.bindCodeBoxes(view);

    const ck = view.querySelector('#btn-checkin');
    if (ck) ck.addEventListener('click', doCheckin);
    const rp = view.querySelector('#btn-replan');
    if (rp) rp.addEventListener('click', () => {
      if (checked) { App.toast('今天已经打卡，明天再换题吧'); return; }
      UI.modal('<h3 style="margin:0 0 6px;font-size:16px">换一组打卡题？</h3>' +
        '<p style="margin:0 0 16px;font-size:13px;color:#4b5768">会从同一范围内重新抽题，当前作答记录清空，但不会影响章节测试。</p>' +
        '<div class="modal-actions"><button class="btn btn-ghost" data-close="1">取消</button>' +
        '<button class="btn btn-primary" id="m-ok">重新抽题</button></div>').querySelector('#m-ok')
        .addEventListener('click', () => {
          const stt = App.st;
          delete stt.daily[CORE.todayKey()];
          App.save();
          UI.closeModal();
          App.route();
        });
    });

    function refresh() {
      const dd = App.st.daily[CORE.todayKey()];
      const n = dd.qids.filter(id => dd.answers[id] && dd.answers[id].ok).length;
      const btn = view.querySelector('#btn-checkin');
      if (btn) {
        const ready = n === dd.qids.length;
        btn.disabled = !ready;
        btn.style.opacity = ready ? '1' : '.5';
        btn.style.cursor = ready ? 'pointer' : 'not-allowed';
        const hint = btn.nextElementSibling;
        if (hint) hint.textContent = ready ? '全部做对，可以打卡了' : '还有 ' + (dd.qids.length - n) + ' 题没做对，做完就能打卡';
      }
      App.initShell();
    }
  };

  function CoreFmt() {
    const d = new Date();
    const w = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
    return (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · 星期' + w;
  }

  function doCheckin() {
    const st = App.st, date = CORE.todayKey();
    const d = st.daily[date];
    const okAll = d && d.qids.every(id => d.answers[id] && d.answers[id].ok);
    if (!okAll) { App.toast('还有题没做对，再检查一下', 'bad'); return; }
    const rec = st.days[date] || (st.days[date] = { checkin: false, lessons: 0, solved: 0 });
    rec.checkin = true;
    rec.checkinAt = new Date().toISOString();
    d.checked = true;
    App.save();
    const s = CORE.streak(st);
    UI.modal('<div style="text-align:center;padding:8px 4px 0">' +
      '<div style="font-size:42px;line-height:1">🔥</div>' +
      '<h3 style="margin:12px 0 6px;font-size:19px">打卡成功！连续第 ' + s + ' 天</h3>' +

      '今天做对 ' + d.qids.length + ' 道打卡题，读了 ' + (rec.lessons || 0) + ' 课。<br>' +
      '明天同一时间再来，别断档——连续天数比一次学很多更重要。</p>' +

  App.openReplan = function () {
    const L = App.L;
    const cur = App.st.planDays || App.S.profile.days;
    const opts = [7, 14, 21, 30, 42, 60].map(d => {
      const p = CORE.buildPlan(L, d);
      const learn = p.plan.filter(x => x.type === 'learn').length;
      return { d: p.days, per: Math.ceil(App.ix.ALL.length / learn), extra: p.days - learn };
    });
    const uniq = [];
    opts.forEach(o => { if (!uniq.some(x => x.d === o.d)) uniq.push(o); });

    const m = UI.modal('<h3 style="margin:0 0 6px;font-size:16px">重新规划天数</h3>' +
      '<p style="margin:0 0 14px;font-size:12.5px;color:#7c8798">已读课时和做题记录都会保留，只是把剩下的内容重新排期。今天会按新计划的第 1 天算。</p>' +
      '<div class="day-grid">' + uniq.map(o =>
        '<button class="day-card' + (o.d === cur ? ' on' : '') + '" data-d="' + o.d + '"><b>' + o.d + '</b><span>天</span>' +
        '<em>每天 ' + o.per + ' 课' + (o.extra > 0 ? ' + ' + o.extra + ' 天复盘' : '') + '</em></button>').join('') +

      st.startDate = CORE.todayKey();

    }));
  };

  /* ================= 设置 / 备份 ================= */
  App.backupProgress = function () {
    const payload = {
      app: 'codecraft', version: 2, savedAt: new Date().toISOString(),
      profile: App.S.profile, langs: App.S.langs
    };
    try {
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'codecraft-backup-' + CORE.todayKey() + '.json';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      App.toast('备份文件已下载', 'ok');
    } catch (e) {
      App.toast('备份失败：' + (e && e.message ? e.message : e), 'bad');
    }
  };

  App.restoreProgress = function () {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.json,application/json';
    inp.onchange = () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      const fr = new FileReader();
      fr.onload = () => {
        try {
          const obj = JSON.parse(String(fr.result));
          const data = obj && obj.langs ? obj : (obj && obj.data && obj.data.langs ? obj.data : null);
          if (!data) throw new Error('这不是 CodeCraft 的备份文件');
          if (!confirm('恢复备份会合并到当前进度（同一天取作答更多的一份），继续？')) return;
          Object.keys(data.langs || {}).forEach(id => {
            if (!window.LANGS[id]) return;
            const src = data.langs[id];
            const dst = App.langState(id);
            ['done', 'solved', 'wrong'].forEach(k => {
              Object.keys(src[k] || {}).forEach(x => { if (src[k][x]) dst[k][x] = true; });
            });
            Object.keys(src.tries || {}).forEach(x => {
              dst.tries[x] = Math.max(dst.tries[x] || 0, src.tries[x] || 0);
            });
            Object.keys(src.days || {}).forEach(k => { if (!dst.days[k]) dst.days[k] = src.days[k]; });
            Object.keys(src.daily || {}).forEach(k => {
              if (!dst.daily[k] || Object.keys((src.daily[k].answers || {})).length > Object.keys((dst.daily[k].answers || {})).length) {
                dst.daily[k] = src.daily[k];
              }
            });
            if (!dst.planDays && src.planDays) {
              dst.planDays = src.planDays;
              dst.startDate = src.startDate || CORE.todayKey();
              dst.plan = CORE.buildPlan(window.LANGS[id], dst.planDays);
            }
          });
          if (data.profile && data.profile.lang && !App.S.profile.lang) {
            App.S.profile.lang = data.profile.lang;
            App.S.profile.days = data.profile.days || 21;
            App.S.profile.startDate = data.profile.startDate || CORE.todayKey();
          }
          App.save();
          App.toast('恢复完成', 'ok');
          if (App.S.profile.lang) { App.bindLang(App.S.profile.lang); App.initShell(); }
          App.route();
        } catch (e) {
          App.toast('恢复失败：' + (e && e.message ? e.message : e), 'bad');
        }
      };
      fr.readAsText(f);
    };
    inp.click();
  };

      '<button class="btn btn-ghost btn-sm danger" id="s-reset-lang">清空本语言</button></div>';

    h += '<div class="setting-row"><div class="sr-txt"><b class="danger">清空全部数据</b>' +
      '<span>所有语言的进度和计划一起删掉，网站回到刚打开的状态</span></div>' +
      '<button class="btn btn-ghost btn-sm danger" id="s-reset-all">全部清空</button></div>';
    h += '</div>';

    h += '<div class="callout note" style="margin-top:16px"><span class="ci">ℹ️</span><div>' +
      '<b>运行环境</b><br>JavaScript 在本机浏览器内运行，断网也能跑；Python / C / C++ / Java 走在线编译服务，需要联网。' +
      '所有代码只用于你点「运行」的那一刻，不会保存到任何服务器。</div></div>';

    view.innerHTML = h;

    view.querySelector('#s-lang').onclick = () => App.openLangPicker();
    view.querySelector('#s-replan').onclick = () => App.openReplan();
    view.querySelector('#s-backup').onclick = () => App.backupProgress();
    view.querySelector('#s-restore').onclick = () => App.restoreProgress();
    view.querySelector('#s-onboard').onclick = () => App.showOnboarding(false);
    view.querySelectorAll('[data-set-level]').forEach(b => b.onclick = () => {
      App.st.level = b.getAttribute('data-set-level');
      delete App.st.daily[CORE.todayKey()];
      App.save();
      App.initShell();
      App.route();
    });
    view.querySelector('#s-reset-lang').onclick = () => {
      if (!confirm('确定清空「' + L.name + '」的全部学习进度？此操作不可撤销。')) return;
      const keepPlan = App.st.plan, keepDays = App.st.planDays, keepStart = App.st.startDate, keepLevel = App.st.level;
      App.S.langs[App.langId] = {
        done: {}, solved: {}, tries: {}, wrong: {}, days: {}, daily: {},
        plan: keepPlan, planDays: keepDays, startDate: keepStart, level: keepLevel
      };
      App.save();
      App.bindLang(App.langId);
      App.toast('已清空本语言进度');
      App.route();
    };
    view.querySelector('#s-reset-all').onclick = () => {
      if (!confirm('确定清空全部数据？所有语言的学习进度都会丢失。')) return;
      try { localStorage.removeItem(App.KEY); } catch (e) {}
      location.hash = '';
      location.reload();
    };
  };
})();

</script>

</body>
</html>
