      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* ---------------- 语法高亮 ---------------- */
  const KW = {
    python: 'False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case',
    c: 'auto break case char const continue default do double else enum extern float for goto if inline int long register return short signed sizeof static struct switch typedef union unsigned void volatile while bool',
    cpp: 'auto break case catch char class const constexpr continue default delete do double else enum explicit extern false float for friend goto if inline int long namespace new nullptr operator private protected public return short signed sizeof static struct switch template this throw true try typedef typename union unsigned using virtual void volatile while override include define',
    java: 'abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for if implements import instanceof int interface long native new package private protected public return short static strictfp super switch synchronized this throw throws transient try void volatile while true false null var record',
    javascript: 'async await break case catch class const continue debugger default delete do else export extends finally for function if import in instanceof let new of return static super switch this throw try typeof var void while with yield true false null undefined'
  };
  const BI = {
    python: 'print len range input int str float bool list dict set tuple abs sum max min sorted enumerate zip map filter open isinstance type super repr round any all divmod',
    c: 'printf scanf malloc free strlen strcpy strcmp strcat memset sizeof fprintf fgets puts gets strncpy sprintf',
    cpp: 'cout cin endl string vector map set unordered_map sort printf scanf push_back size',
    java: 'System String Math Integer Double Object Arrays List ArrayList HashMap Map Scanner StringBuilder Character Long',
    javascript: 'console Math JSON Object Array String Number Boolean Promise fetch document window parseInt parseFloat Map Set'
  };
  const LIT = { python: '# ', c: '// ', cpp: '// ', java: '// ', javascript: '// ' };

  function hl(code, lang) {
    lang = lang || 'python';
    const kws = new Set((KW[lang] || KW.python).split(' '));
    const bis = new Set((BI[lang] || '').split(' '));
    const hashCmt = (lang === 'python');
    const src = String(code == null ? '' : code);

    // 主扫描：注释 | 字符串 | 数字 | 标识符 | 其他
    const re = hashCmt
      ? /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b\d[\d_]*(?:\.\d+)?(?:[eE][+-]?\d+)?j?\b)|([A-Za-z_$][\w$]*)/g
      : /(\/\/[^\n]*|\/\*[\s\S]*?\*\/|^[ \t]*#[^\n]*)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)|(\b\d[\d_]*(?:\.\d+)?(?:[eE][+-]?\d+)?[fFlLuU]*\b)|([A-Za-z_$][\w$]*)/gm;

    let out = '', last = 0, m;
    while ((m = re.exec(src))) {
      out += esc(src.slice(last, m.index));
      const [full, cmt, str, num, ident] = m;
      if (cmt) out += '<span class="c">' + esc(cmt) + '</span>';
      else if (str) out += '<span class="s">' + esc(str) + '</span>';
      else if (num) out += '<span class="n">' + esc(num) + '</span>';
      else if (ident) {
        if (kws.has(ident)) out += '<span class="k">' + esc(ident) + '</span>';
        else if (bis.has(ident)) out += '<span class="b">' + esc(ident) + '</span>';
        else if (/^\s*\(/.test(src.slice(re.lastIndex, re.lastIndex + 3))) out += '<span class="f">' + esc(ident) + '</span>';
        else out += esc(ident);
      } else out += esc(full);
      last = re.lastIndex;
    }

  }

  function inline(s) {

  /* ---------------- 代码块 ---------------- */

  function codeBox(code, opts) {

      switch (b.t) {
        case 'h': h += '<h3>' + inline(b.x) + '</h3>'; break;
        case 'p': h += '<p>' + inline(b.x) + '</p>'; break;
        case 'quote': h += '<p style="border-left:3px solid #dbe6f7;padding-left:14px;color:#5b6b82">' + inline(b.x) + '</p>'; break;
        case 'ul': h += '<ul>' + (b.x || []).map(x => '<li>' + inline(x) + '</li>').join('') + '</ul>'; break;
        case 'ol': h += '<ol>' + (b.x || []).map(x => '<li>' + inline(x) + '</li>').join('') + '</ol>'; break;

            b.head.map(x => '<th>' + inline(x) + '</th>').join('') + '</tr></thead><tbody>';
          b.rows.forEach(r => {
            h += '<tr>' + r.map((c, i) => '<td>' + (i === 0 ? '<strong>' + inline(c) + '</strong>' : inline(c)) + '</td>').join('') + '</tr>';
          });

        case 'code':
          h += codeBox(b.x, { lang: lang, run: b.run !== false, out: b.out, label: b.label, fileName: b.file });

    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" style="transform:rotate(-90deg)">' +
      '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="#eef2f8" stroke-width="8"/>' +
      '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + (color || '#2f6be0') +
      '" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/>' +
      '</svg>';
  }

  function heatmap(dayMap, weeks) {
    weeks = weeks || 16;
    const today = new Date();
    const cells = [];
    // 从 weeks 周前的周日开始
    const start = new Date(today);
    start.setDate(start.getDate() - ((today.getDay()) + (weeks - 1) * 7));
    const cur = new Date(start);
    let h = '';
    let count = 0;
    for (let i = 0; i < weeks * 7; i++) {
      const key = fmtDate(cur);
      const rec = dayMap[key];
      let cls = 'hm-cell';
      if (rec && rec.checkin) {
        const score = (rec.lessons || 0) + (rec.solved || 0) / 2;
        cls += score >= 6 ? ' l4' : score >= 3 ? ' l3' : score >= 1 ? ' l2' : ' l1';
      }
      if (key === fmtDate(today)) cls += ' today';
      h += '<div class="' + cls + '" data-day="' + key + '" title="' + key + (rec && rec.checkin ? ' · 已打卡' : '') + '"></div>';
      count++;
      cur.setDate(cur.getDate() + 1);
    }
    return '<div class="heatmap">' + h + '</div>' +
      '<div class="hm-legend"><span>少</span><i class="hm-cell" style="width:10px;height:10px"></i>' +
      '<i class="hm-cell l2" style="width:10px;height:10px"></i><i class="hm-cell l3" style="width:10px;height:10px"></i>' +
      '<i class="hm-cell l4" style="width:10px;height:10px"></i><span>多</span></div>';
  }
  function fmtDate(d) {
    const p = n => (n < 10 ? '0' : '') + n;
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function diffHint(got, want) {
    const g = String(got == null ? '' : got).replace(/\r/g, '').trim();
    const w = String(want == null ? '' : want).replace(/\r/g, '').trim();
    if (g === w) return '';
    const gl = g.split('\n'), wl = w.split('\n');
    const tips = [];
    if (gl.length !== wl.length) tips.push('行数不一致：你输出 ' + gl.length + ' 行，期望 ' + wl.length + ' 行');
    for (let i = 0; i < Math.min(gl.length, wl.length); i++) {
      if (gl[i].replace(/\s+$/, '') !== wl[i].replace(/\s+$/, '')) {
        tips.push('第 ' + (i + 1) + ' 行不同：你的是 <code>' + esc(gl[i]) + '</code>，期望 <code>' + esc(wl[i]) + '</code>');
        break;
      }
    }
    if (!tips.length) tips.push('内容几乎一样，检查一下空格、换行或大小写');
    return tips.join('；');
  }

  /* ---------------- 编辑器 ---------------- */
  function mountEditor(box, opts) {
    const lang = opts.lang || 'python';
    const taId = 'ta' + Math.random().toString(36).slice(2, 8);
    box.innerHTML =
      '<div class="editor">' +
        '<div class="editor-head"><span>' + esc(opts.file || ('main.' + extOf(lang))) + '</span><span class="sp"></span>' +
        '<span class="kbd">Ctrl + Enter 运行</span></div>' +
        '<div class="editor-body"><div class="gutter" data-gutter></div>' +
        '<textarea spellcheck="false" id="' + taId + '"></textarea></div>' +
        '<div class="editor-foot"><button class="btn btn-primary btn-sm" data-act="run">▶ 运行</button>' +
        '<button class="btn btn-ghost btn-sm" data-act="reset">重置代码</button>' +
        '<span class="sp"></span><span class="hintline">' + esc(opts.hint || '') + '</span></div>' +
      '</div>' +
      '<div data-result></div>';

    const ta = box.querySelector('textarea');
    const gutter = box.querySelector('[data-gutter]');
    ta.value = opts.code || '';
    function sync() {
      const lines = ta.value.split('\n').length;
      let g = '';
      for (let i = 1; i <= Math.max(lines, 8); i++) g += i + '\n';
      gutter.textContent = g;
      ta.style.height = 'auto';
      ta.style.height = Math.max(150, ta.scrollHeight + 4) + 'px';
    }
    ta.addEventListener('input', sync);
    ta.addEventListener('keydown', e => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const s = ta.selectionStart, en = ta.selectionEnd;
        ta.value = ta.value.slice(0, s) + '    ' + ta.value.slice(en);
        ta.selectionStart = ta.selectionEnd = s + 4;
        sync();
      }
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        if (opts.onRun) opts.onRun(ta.value);
      }
    });
    box.querySelector('[data-act="reset"]').addEventListener('click', () => {
      ta.value = opts.code || ''; sync();
    });
    box.querySelector('[data-act="run"]').addEventListener('click', () => {
      if (opts.onRun) opts.onRun(ta.value);
    });
    sync();
    return { getValue: () => ta.value, setValue: v => { ta.value = v; sync(); }, textarea: ta };
  }

  function extOf(lang) {
    return { python: 'py', c: 'c', cpp: 'cpp', java: 'java', javascript: 'js' }[lang] || 'txt';
  }

  function renderRun(el, r) {
    if (!el) return;
    const kind = r.ok ? 'ok' : 'bad';
    let body = '';
    if (r.phase === 'compile' && r.err) {
      body = '<div style="font-size:12.5px;color:#a83232;margin-bottom:6px">编译没有通过：</div><pre>' + esc(r.err) + '</pre>';
    } else if (r.ok) {
      body = '<pre>' + esc(r.out || '(没有输出)') + '</pre>';
    } else {
      body = r.err ? '<pre>' + esc(r.err) + '</pre>' : '<div>没有执行结果</div>';
    }
    el.innerHTML = '<div class="runpanel ' + kind + '">' +
      '<div class="rp-head">' + (r.ok ? '✓ 运行成功' : '✕ 运行失败') +
      '<span style="margin-left:auto;font-weight:500;font-size:11.5px;opacity:.8">' + esc(r.note || '') + '</span></div>' +
      '<div class="rp-body">' + body + '</div></div>';
  }

  return {
    esc, hl, inline, codeBox, blocksHtml, callout, toast, modal, closeModal,
    ring, heatmap, diffHint, mountEditor, renderRun, fmtDate,
    putCode, getCode, resetStore, extOf
  };
})();


/* ---- js/runner.js ---- */
/* ============================================================
   CodeCraft · 代码运行引擎
   · JavaScript：浏览器内 iframe 沙箱，完全离线
   · Python / C / C++ / Java：Wandbox 在线编译运行（需联网）
   ============================================================ */
window.Runner = (function () {
  'use strict';

  const API = 'https://wandbox.org/api/compile.json';
  const MAP = {
    python:     { compiler: 'cpython-3.13.8',  options: '', file: 'main.py' },
    c:          { compiler: 'gcc-13.2.0-c',    options: 'warning,c11', file: 'main.c' },
    cpp:        { compiler: 'gcc-13.2.0',      options: 'warning,c++17', file: 'main.cpp' },
    // Java 的 JVM 默认按系统编码输出，在服务器上会把中文变成 ?，必须显式指定 UTF-8
    java:       { compiler: 'openjdk-jdk-21+35', options: '', file: 'Main.java',
                  runtime: '-Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8' }
  };

  const caps = {
    python: '在线运行 · 需联网',
    c: '在线编译 · GCC 13 / C11',
    cpp: '在线编译 · GCC 13 / C++17',
    java: '在线编译 · OpenJDK 21（主类写 class Main）',
    javascript: '浏览器内运行 · 可离线'
  };

  /* ---------- 请求队列：避免高频打挂公共接口 ---------- */
  let chain = Promise.resolve();
  let lastAt = 0;
  function enqueue(task) {
    const run = chain.then(async () => {
      const wait = Math.max(0, 420 - (Date.now() - lastAt));
      if (wait) await new Promise(r => setTimeout(r, wait));
      lastAt = Date.now();
      return task();
    });
    chain = run.catch(() => {});
    return run;
  }

  function fetchJSON(body, timeout) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeout || 25000);
    return fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: ctrl.signal
    }).then(async res => {
      const text = await res.text();
      let data = null;
      try { data = JSON.parse(text); } catch (e) {}
      if (!data) {
        const brief = String(text || '').replace(/\s+/g, ' ').slice(0, 120);
        const err = new Error('接口返回异常（HTTP ' + res.status + '）' + (brief ? '：' + brief : ''));
        err.tooMany = /too many|rate.?limit|429/i.test(text || '') || res.status === 429;
        throw err;
      }
      return data;
    }).finally(() => clearTimeout(timer));
  }

  function runRemote(lang, code, stdin, attempt) {
    attempt = attempt || 0;
    const cfg = MAP[lang];
    if (!cfg) return Promise.resolve({ ok: false, out: '', err: '暂不支持这门语言在线运行', phase: 'config', note: '' });
    const t0 = Date.now();
    return enqueue(() => fetchJSON({
      compiler: cfg.compiler,
      code: code,
      stdin: stdin || '',
      options: cfg.options || '',
      'compiler-option-raw': '',
      'runtime-option-raw': cfg.runtime || ''
    })).then(d => {
      const out = d.program_output || '';
      const perr = d.program_error || '';
      const cerr = d.compiler_error || '';
      const ok = String(d.status) === '0' && !cerr;
      return {
        ok: ok,
        out: out || perr,
        err: cerr || (ok ? '' : perr) || '',
        phase: cerr ? 'compile' : 'run',
        timeMs: Date.now() - t0,
        note: (Date.now() - t0) + ' ms · ' + (caps[lang] || '在线运行')
      };
    }).catch(e => {
      /* 公共接口限流时稍等重试，最多两次 */
      if (e && e.tooMany && attempt < 2) {
        return new Promise(r => setTimeout(r, 1200 * (attempt + 1)))
          .then(() => runRemote(lang, code, stdin, attempt + 1));
      }
      const msg = e && e.name === 'AbortError'
        ? '在线编译超时（超过 25 秒），检查一下是不是死循环，或稍后重试'
        : '连不上在线编译服务：' + (e && e.message ? e.message : e) + '。请检查网络后重试（Python/C/C++/Java 需要联网运行）';
      return { ok: false, out: '', err: msg, phase: 'network', note: '网络/服务异常', timeMs: Date.now() - t0 };
    });
  }

  /* ---------- JavaScript：iframe 沙箱 ---------- */
  let jsSeq = 0;
  function jstr(s) {
    return JSON.stringify(String(s == null ? '' : s)).replace(/</g, '\\u003c').replace(/\u2028|\u2029/g, ' ');
  }

  function runJS(code, stdin, timeout) {
    return new Promise(resolve => {
      const id = 'jsr' + (++jsSeq) + '_' + Math.random().toString(36).slice(2, 6);
      const t0 = Date.now();
      const iframe = document.createElement('iframe');
      iframe.setAttribute('sandbox', 'allow-scripts');
      iframe.style.cssText = 'position:fixed;left:-9999px;top:0;width:2px;height:2px;border:0;opacity:0';
      let settled = false;

      const harness =
        '<!DOCTYPE html><html><body><script>(function(){' +
        'var INPUT=' + jstr(stdin) + ';' +
        'var LINES=String(INPUT).split("\\n"),P=0;' +
        'function readline(){return P<LINES.length?LINES[P++]:"";}' +
        'function readInt(){var v=String(readline()).trim();return v===""?0:Number(v);}' +
        'var buf=[];function fmt(v){if(typeof v==="string")return v;try{return JSON.stringify(v);}catch(e){return String(v);}}' +
        'function push(){buf.push(Array.prototype.slice.call(arguments).map(fmt).join(" "));}' +
        'var fake={log:push,error:push,warn:push,info:push,debug:push};' +
        'function finish(ok,err){if(window.__done)return;window.__done=1;' +
        'parent.postMessage({__cc:1,id:' + jstr(id) + ',ok:ok,out:buf.join("\\n"),err:err||""},"*");}' +
        'try{var fn=new Function("console","readline","readInt","print","INPUT",' + jstr(code) + ');' +
        'fn(fake,readline,readInt,push,INPUT);}catch(e){finish(false,(e&&e.stack)?e.stack:String(e));return;}' +
        'setTimeout(function(){finish(true,"");},140);' +
        '})();<\/script></body></html>';

      function onMsg(e) {
        const d = e.data;
        if (!d || d.__cc !== 1 || d.id !== id) return;
        settled = true;
        window.removeEventListener('message', onMsg);
        cleanup();
        resolve({ ok: !!d.ok, out: d.out || '', err: d.err || '', phase: d.ok ? 'run' : 'compile',
          timeMs: Date.now() - t0, note: (Date.now() - t0) + ' ms · 浏览器内运行' });
      }
      function cleanup() {
        try { iframe.remove(); } catch (e) {}
      }
      window.addEventListener('message', onMsg);
      setTimeout(() => {
        if (settled) return;
        settled = true;
        window.removeEventListener('message', onMsg);
        cleanup();
        resolve({ ok: false, out: '', err: '运行超时（超过 5 秒），可能是死循环', phase: 'timeout', note: '超时', timeMs: 5000 });
      }, timeout || 5000);

      iframe.srcdoc = harness;
      document.body.appendChild(iframe);
    });
  }

  function run(lang, code, stdin) {
    if (lang === 'javascript') return runJS(code, stdin);
    return runRemote(lang, code, stdin);
  }

  function caption(lang) { return caps[lang] || '在线运行'; }

  return { run, caption, runJS, runRemote, supports: Object.keys(MAP).concat(['javascript']) };
})();


/* ---- js/app-base.js ---- */
/* ============================================================
   CodeCraft · 应用主体（状态 / 首次引导 / 路由 / 外壳）
   ============================================================ */
(function () {
  'use strict';

  const App = window.App = {};
  const UI = window.UI, CORE = window.CORE, LANGS = window.LANGS || {};
  App.UI = UI; App.CORE = CORE; App.LANGS = LANGS;
  const esc = UI.esc;

  App.KEY = 'codecraft.v2';
  App.VER = 'k1';
  App.ORDER = ['python', 'c', 'cpp', 'java', 'javascript'];
  App.list = App.ORDER.filter(id => LANGS[id]);

  /* ---------------- 状态 ---------------- */
  function defaults() {
    return {
      v: 2,
      profile: { lang: '', days: 0, startDate: '', level: 'normal' },
      langs: {}
    };
  }

  App.load = function () {
    let raw = {};
    try { raw = JSON.parse(localStorage.getItem(App.KEY) || '{}') || {}; } catch (e) { raw = {}; }
    const d = defaults();
    const S = {
      v: 2,
      profile: Object.assign(d.profile, raw.profile || {}),
      langs: raw.langs || {}
    };
    if (S.profile.lang && !LANGS[S.profile.lang]) S.profile.lang = '';
    App.S = S;
    return S;
  };

  App.save = function () {
    try { localStorage.setItem(App.KEY, JSON.stringify(App.S)); } catch (e) {}
  };

  App.langState = function (id) {
    const S = App.S;
    if (!S.langs[id]) {
      S.langs[id] = {
        done: {}, solved: {}, tries: {}, wrong: {}, days: {}, daily: {},
        plan: null, planDays: 0, level: 'normal', startDate: ''
      };
    }
    const st = S.langs[id];
    ['done', 'solved', 'tries', 'wrong', 'days', 'daily'].forEach(k => { if (!st[k]) st[k] = {}; });
    if (!st.level) st.level = 'normal';
    return st;
  };

  /* 当前语言上下文 */
  App.bindLang = function (id) {
    id = id || App.S.profile.lang;
    App.langId = id;
    App.L = LANGS[id] || null;
    App.st = id ? App.langState(id) : null;
    App.ix = App.L ? CORE.index(App.L) : null;
    if (App.st && !App.st.plan && App.st.planDays) {
      App.st.plan = CORE.buildPlan(App.L, App.st.planDays);
    }
    return App.L;
  };

  /* 每日记录（打卡热力图 / 统计用） */
  App.touchDay = function (field, inc) {
    if (!App.st) return;
    const k = CORE.todayKey();
    const rec = App.st.days[k] || (App.st.days[k] = { checkin: false, lessons: 0, solved: 0 });
    if (field) rec[field] = (rec[field] || 0) + (inc == null ? 1 : inc);
    App.save();
  };

  /* ---------------- 通用工具 ---------------- */
  App.go = function (hash) {
    if (location.hash === hash) App.route();
    else location.hash = hash;
  };
  App.toast = UI.toast;
  App.planDay = function () {
    const st = App.st;
    if (!st || !st.plan) return null;
    return CORE.planDayOf(st.plan, st.startDate || App.S.profile.startDate || CORE.todayKey(), CORE.todayKey());
  };
  App.planDayIdx = function (dateKey) {
    const st = App.st;
    if (!st || !st.plan) return 0;
    const start = st.startDate || App.S.profile.startDate || CORE.todayKey();
    const d = CORE.diffDays(start, dateKey || CORE.todayKey());
    return Math.max(0, Math.min(st.plan.plan.length - 1, d)) + 1;
  };

  /* ---------------- 首次引导 ---------------- */
  let obState = { step: 1, lang: '', days: 14 };

  App.showOnboarding = function (resume) {
    const root = document.getElementById('ob-root') || (function () {
      const d = document.createElement('div');
      d.id = 'ob-root';
      document.body.appendChild(d);
      return d;
    })();
    document.body.style.overflow = 'hidden';
    if (resume) {
      /* 保留已选语言，重排天数 */
      obState.lang = App.S.profile.lang || '';
      obState.days = App.S.profile.days || 14;
      obState.step = obState.lang ? 2 : 1;
    } else {
      obState = { step: 1, lang: '', days: 14 };
    }
    renderOb();
  };

  function closeOnboarding() {
    const root = document.getElementById('ob-root');
    if (root) root.innerHTML = '';
    document.body.style.overflow = '';
  }

  function dayOptions(lang) {
    const n = lang.lessonsCount || (lang.chapters || []).reduce((a, c) => a + c.lessons.length, 0);
    /* 天数上限跟着课时量走：最多给到「一课时配两天」，避免出现 60 天里 44 天都在复习 */
    const cap = Math.max(21, Math.round(n * 2));
    let presets = [7, 14, 21, 30, 42, 60].filter(d => d <= cap);
    if (presets.length < 4) presets = [7, 14, 21, Math.max(21, cap)];
    return presets.map(d => {
      const p = CORE.buildPlan(lang, d);
      const learn = p.plan.filter(x => x.type === 'learn');
      const perDay = learn.length ? Math.ceil(n / learn.length) : n;
      return {
        days: d,
        perDay: perDay,
        learn: learn.length,
        extra: p.days - learn.length,
        title: d + ' 天'
      };
    });
  }

  function renderOb() {
    const root = document.getElementById('ob-root');
    if (!root) return;
    const steps = ['选语言', '定天数', '确认计划'];
    let h = '<div class="ob-wrap"><div class="ob-inner">';
    h += '<div class="ob-brand"><span class="brand-mark">CC</span><div>' +
      '<strong>CodeCraft · 多语言编程训练场</strong>' +
      '<span>一次把一门语言学透：精讲 + 在线运行 + 章节测试 + 每日打卡</span></div></div>';
    h += '<div class="ob-steps">' + steps.map((s, i) => {
      const n = i + 1;
      const cls = obState.step === n ? 'on' : (obState.step > n ? 'done' : '');
      return (i ? '<span class="ob-sep"></span>' : '') +
        '<span class="ob-step ' + cls + '"><i>' + (obState.step > n ? '✓' : n) + '</i>' + s + '</span>';
    }).join('') + '</div>';

    if (obState.step === 1) {
      h += '<div class="ob-card"><h1 class="ob-title">你想先学哪门语言？</h1>' +
        '<p class="ob-desc">选一门作为起点。进度、计划、打卡记录都按语言分开保存，之后随时能在右上角切换，互不影响。</p>';
      h += '<div class="lang-grid">' + App.list.map(id => {
        const L = LANGS[id];
        const lessons = L.chapters.reduce((a, c) => a + c.lessons.length, 0);
        const on = obState.lang === id;
        return '<button class="lang-card' + (on ? ' on' : '') + '" data-lang="' + id + '">' +
          '<span class="lc-tick">✓</span>' +
          '<span class="lc-top"><span class="lc-ico" style="background:' + L.color + '1a;color:' + L.color + '">' + L.icon + '</span>' +
          '<span><span class="lc-name">' + esc(L.name) + '</span><br><span class="lc-sub">' + esc(L.en) + '</span></span></span>' +
          '<span class="lc-desc">' + esc(L.blurb) + '</span>' +
          '<span class="lc-meta"><span><b>' + L.chapters.length + '</b> 章</span>' +
          '<span><b>' + lessons + '</b> 课</span>' +
          '<span><b>' + L.quiz.length + '</b> 测试题</span>' +
          '<span><b>' + L.checkin.length + '</b> 打卡题</span></span>' +
          '</button>';
      }).join('') + '</div>';
      h += '<div class="ob-actions"><span class="ob-hint">不确定？Python 语法最轻、上手最快；C 最能打基础。</span>' +
        '<button class="btn btn-primary" id="ob-next" ' + (obState.lang ? '' : 'disabled style="opacity:.5;cursor:not-allowed"') + '>下一步 →</button></div></div>';
    }

    if (obState.step === 2) {
      const L = LANGS[obState.lang];
      const opts = dayOptions(L);
      h += '<div class="ob-card"><h1 class="ob-title">打算用多少天学完 ' + esc(L.name) + '？</h1>' +
        '<p class="ob-desc">天数决定每天的学习强度。课多天少 → 一天多学几课；天多课少 → 多出来的天数自动排成复习日和冲刺日。之后可以在设置里重新规划。</p>';
      h += '<div class="day-grid">' + opts.map(o => {
        const on = obState.days === o.days;
        return '<button class="day-card' + (on ? ' on' : '') + '" data-days="' + o.days + '">' +
          '<b>' + o.days + '</b><span>天</span>' +
          '<em>每天 ' + o.perDay + ' 课 · 学习 ' + o.learn + ' 天' + (o.extra ? ' + 复盘 ' + o.extra + ' 天' : '') + '</em>' +
          '</button>';
      }).join('') + '</div>';
      const custom = opts.every(o => o.days !== obState.days);
      h += '<div class="ob-custom">' +
        '<span>想要别的节奏？自己填：</span>' +
        '<input type="number" id="ob-days-input" min="3" max="200" step="1" value="' + obState.days + '"' + (custom ? ' class="on"' : '') + '>' +
        '<span>天</span>' +
        '<button class="btn btn-ghost btn-sm" id="ob-days-apply">使用这个天数</button>' +
        '</div>';
      h += '<div class="ob-actions"><button class="btn btn-ghost" id="ob-back">← 上一步</button>' +
        '<button class="btn btn-primary" id="ob-next">查看我的计划 →</button></div></div>';
    }

    if (obState.step === 3) {
      const L = LANGS[obState.lang];
      const plan = CORE.buildPlan(L, obState.days);
      const lessons = L.chapters.reduce((a, c) => a + c.lessons.length, 0);
      const firstDay = plan.plan[0];
      h += '<div class="ob-card"><h1 class="ob-title">这是你的 ' + esc(L.name) + ' 学习计划</h1>' +
        '<p class="ob-desc">计划已按课时长度和章节顺序排好。每天打开网站，首页会直接告诉你今天学哪几课、做什么题。</p>';
      h += '<div class="ob-summary">' +
        '<div><b>' + plan.days + '</b>总天数</div>' +
        '<div><b>' + plan.learnDays + '</b>学习日</div>' +
        '<div><b>' + (plan.days - plan.learnDays) + '</b>复习/冲刺日</div>' +
        '<div><b>' + lessons + '</b>节课时</div>' +
        '<div><b>' + L.quiz.length + '</b>章节测试题</div>' +
        '<div><b>' + L.checkin.length + '</b>每日打卡题</div>' +
        '</div>';
      h += '<div style="border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fcfdff">' +
        '<div style="font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.4px;margin-bottom:8px">第 1 天</div>' +
        '<div style="font-weight:700;font-size:14px;margin-bottom:6px">' + esc(firstDay.title) + '</div>' +
        '<div style="font-size:12.5px;color:var(--mut);line-height:1.7">' + esc(firstDay.desc) + '</div>' +
        '<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">' +
        firstDay.lessons.map(l => '<span class="dl-lesson">' + esc(l.title) + '</span>').join('') + '</div></div>';
      h += '<div class="callout note" style="margin-top:16px"><span class="ci">💡</span><div>每天的学习进度、题目作答、打卡记录都保存在本机浏览器里，关掉网页再打开会接着上次继续。建议偶尔在「设置」里导出一次备份。</div></div>';
      h += '<div class="ob-actions"><button class="btn btn-ghost" id="ob-back">← 改天数</button>' +
        '<button class="btn btn-primary" id="ob-start">开始学习 →</button></div></div>';
    }

    h += '</div></div>';
    root.innerHTML = h;

    /* 事件 */
    root.querySelectorAll('[data-lang]').forEach(b => {
      b.addEventListener('click', () => {
        obState.lang = b.getAttribute('data-lang');
        const L = LANGS[obState.lang];
        obState.days = dayOptions(L).slice(1, 2)[0].days;
        renderOb();
      });
    });
    root.querySelectorAll('[data-days]').forEach(b => {
      b.addEventListener('click', () => { obState.days = +b.getAttribute('data-days'); renderOb(); });
    });
    const applyDays = root.querySelector('#ob-days-apply');
    if (applyDays) applyDays.addEventListener('click', () => {
      const inp = root.querySelector('#ob-days-input');
      const v = Math.max(3, Math.min(200, Math.round(+inp.value) || 0));
      if (!v) { App.toast('请填一个 3 ~ 200 之间的天数'); return; }
      obState.days = v;
      renderOb();
    });
    const daysInput = root.querySelector('#ob-days-input');
    if (daysInput) daysInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); if (applyDays) applyDays.click(); }
    });
    const nx = root.querySelector('#ob-next');
    if (nx) nx.addEventListener('click', () => { obState.step = Math.min(3, obState.step + 1); renderOb(); });
    const bk = root.querySelector('#ob-back');
    if (bk) bk.addEventListener('click', () => { obState.step = Math.max(1, obState.step - 1); renderOb(); });
    const start = root.querySelector('#ob-start');
    if (start) start.addEventListener('click', () => finishOnboarding());
  }

  function finishOnboarding() {
    const S = App.S;
    S.profile.lang = obState.lang;
    S.profile.days = obState.days;
    S.profile.startDate = CORE.todayKey();
    const st = App.langState(obState.lang);
    st.planDays = obState.days;
    st.startDate = S.profile.startDate;
    st.plan = CORE.buildPlan(LANGS[obState.lang], obState.days);
    App.save();
    closeOnboarding();
    App.bindLang(obState.lang);
    initShell();
    App.go('#/home');
    App.toast('计划已生成：' + st.plan.days + ' 天，加油！', 'ok');
  }

  /* ---------------- 选择语言弹窗 ---------------- */
  App.openLangPicker = function () {
    const cur = App.S.profile.lang;
    const m = UI.modal(
      '<h3 style="margin:0 0 4px;font-size:17px">切换学习语言</h3>' +
      '<p style="margin:0 0 14px;font-size:12.5px;color:#7c8798">每门语言的课程进度、打卡记录独立保存，切换不会互相覆盖。</p>' +
      '<div class="lang-grid">' + App.list.map(id => {
        const L = LANGS[id];
        const has = App.S.langs[id];
        const doneN = has ? Object.keys(has.done).length : 0;
        const lessons = L.chapters.reduce((a, c) => a + c.lessons.length, 0);
        return '<button class="lang-card' + (id === cur ? ' on' : '') + '" data-pick="' + id + '">' +
          (id === cur ? '<span class="lc-tick">✓</span>' : '') +
          '<span class="lc-top"><span class="lc-ico" style="background:' + L.color + '1a;color:' + L.color + '">' + L.icon + '</span>' +
          '<span><span class="lc-name">' + esc(L.name) + '</span><br><span class="lc-sub">' + esc(L.en) + '</span></span></span>' +
          '<span class="lc-meta"><span>已学 <b>' + doneN + '/' + lessons + '</b> 课</span></span></button>';
      }).join('') + '</div>',
      { width: 720 });
    m.querySelectorAll('[data-pick]').forEach(b => {
      b.addEventListener('click', () => {
        const id = b.getAttribute('data-pick');
        UI.closeModal();
        if (id === cur) return;
        App.switchLang(id);
      });
    });
  };

  App.switchLang = function (id) {
    if (!LANGS[id]) return;
    const S = App.S;
    const st = App.langState(id);
    if (!st.plan || !st.planDays) {
      /* 第一次进入这门语言：沿用当前的天数偏好 */
      const days = S.profile.days || 21;
      st.planDays = days;
      st.startDate = CORE.todayKey();
      st.plan = CORE.buildPlan(LANGS[id], days);
    }
    S.profile.lang = id;
    S.profile.days = st.planDays;
    S.profile.startDate = st.startDate || S.profile.startDate;
    App.save();
    App.bindLang(id);
    initShell();
    App.go('#/home');
    App.toast('已切换到 ' + LANGS[id].name + '，进度单独保存', 'ok');
  };

  /* ---------------- 顶栏 / 侧边栏 ---------------- */
  function initShell() {
    const L = App.L, st = App.st;
    if (!L) return;
    document.getElementById('lang-ico').textContent = L.icon;
    document.getElementById('lang-name').textContent = L.name;
    document.getElementById('brand-sub').textContent = L.name + ' 训练场';
    document.querySelectorAll('#level-switch button').forEach(b => {
      b.classList.toggle('on', b.getAttribute('data-level') === (st.level || 'normal'));
    });
    document.getElementById('streak-num').textContent = CORE.streak(st);
    document.getElementById('btn-settings').onclick = () => App.go('#/settings');
    document.getElementById('lang-pill').onclick = () => App.openLangPicker();

    document.querySelectorAll('#level-switch button').forEach(b => {
      b.onclick = () => {
        st.level = b.getAttribute('data-level');
        App.save();
        initShell();
        const d = st.daily[CORE.todayKey()];
        if (d) { delete st.daily[CORE.todayKey()]; App.save(); }
        App.toast('难度：' + CORE.LEVELS[st.level].name + ' · 每天 ' + CORE.LEVELS[st.level].total + ' 题');
        if (location.hash.indexOf('#/daily') === 0) App.route();
      };
    });
  }
  App.initShell = initShell;

  function renderSidebar(activeLesson, activeCh) {
    const L = App.L, st = App.st, ix = App.ix;
    const nav = document.getElementById('sidebar-nav');
    const hash = location.hash || '#/home';
    const link = (href, icon, text, on, extra) =>
      '<a class="nav-link' + (on ? ' active' : '') + '" href="' + href + '">' +
      '<span class="ico">' + icon + '</span><span>' + text + '</span>' + (extra || '') + '</a>';

    let h = '<div class="nav-group-title">学习面板</div>';
    h += link('#/home', '🏠', '总览与今日任务', hash === '#/home' || hash === '' || hash === '#/');
    h += link('#/daily', '📅', '每日打卡', hash.indexOf('#/daily') === 0);
    h += link('#/plan', '🗺️', '我的 ' + (st.plan ? st.plan.days : App.S.profile.days) + ' 天计划', hash.indexOf('#/plan') === 0);
    h += link('#/calendar', '🔥', '打卡记录', hash.indexOf('#/calendar') === 0);
    h += link('#/lab', '🧪', '代码实验室', hash.indexOf('#/lab') === 0);
    h += link('#/wrong', '📕', '错题本 (' + Object.keys(st.wrong).length + ')', hash.indexOf('#/wrong') === 0);
    h += link('#/settings', '⚙️', '设置与备份', hash.indexOf('#/settings') === 0);

    h += '<div class="nav-group-title">' + esc(L.name) + ' 课程目录</div><div class="nav-chapters">';
    L.chapters.forEach((c, ci) => {
      const pct = CORE.chapterPct(L, st, c.id);
      const isOn = activeCh === c.id;
      const allDone = pct === 100;
      h += '<div class="ch-wrap">';
      h += '<div class="ch-head' + (isOn ? ' on' : '') + (allDone ? ' done' : '') + '" data-ch="' + c.id + '">' +
        '<span class="ch-num">' + (allDone ? '✓' : (c.num != null ? c.num : ci + 1)) + '</span>' +
        '<span class="ch-name">' + esc(c.title) + '</span>' +
        '<span class="ch-pct">' + pct + '%</span></div>';
      h += '<div class="ch-rest' + (isOn ? ' show' : '') + '">';
      c.lessons.forEach(l => {
        h += '<div class="ch-lesson' + (st.done[l.id] ? ' read' : '') + (activeLesson === l.id ? ' active' : '') +
          '" data-lesson="' + l.id + '"><span class="tick">✓</span><span>' + esc(l.title) + '</span></div>';
      });
      h += '</div></div>';
    });
    h += '</div>';
    nav.innerHTML = h;

    nav.querySelectorAll('.ch-head').forEach(el => {
      el.addEventListener('click', e => {
        const id = el.getAttribute('data-ch');
        const rest = el.nextElementSibling;
        const wasOpen = rest.classList.contains('show');
        nav.querySelectorAll('.ch-rest').forEach(r => r.classList.remove('show'));
        nav.querySelectorAll('.ch-head').forEach(r => r.classList.remove('on'));
        if (!wasOpen) { rest.classList.add('show'); el.classList.add('on'); }
        if (!activeCh || activeCh !== id) App.go('#/ch/' + id);
      });
    });
    nav.querySelectorAll('[data-lesson]').forEach(el => {
      el.addEventListener('click', () => App.go('#/lesson/' + el.getAttribute('data-lesson')));
    });

    const pct = CORE.overallPct(L, st);
    const mpText = document.getElementById('mp-text');
    if (mpText) {
      mpText.textContent = pct + '%';
      document.getElementById('mp-bar').style.width = pct + '%';
      document.getElementById('mp-sub').textContent =
        '已读 ' + CORE.doneCount(L, st) + ' / ' + ix.ALL.length + ' 课 · 做对 ' +
        Object.keys(st.solved).length + ' 题';
    }
  }

  /* ---------------- 路由 ---------------- */
  App.route = function () {
    const hash = location.hash || '#/home';
    const parts = hash.replace(/^#\/?/, '').split('/');
    const page = parts[0] || 'home';
    const view = document.getElementById('view');
    const sidebar = document.getElementById('sidebar');
    if (sidebar) sidebar.classList.remove('open');

    if (!App.L || !App.st) {
      view.innerHTML = '<div class="empty">正在准备…</div>';
      return;
    }
    UI.resetStore();
    window.scrollTo({ top: 0, behavior: 'auto' });

    try {
      if (page === 'lesson') {
        const l = App.ix.LMAP[parts[1]];
        if (!l) { view.innerHTML = '<div class="empty">没有找到这一课</div>'; return; }
        renderSidebar(l.id, l.ch);
        App.renderLesson(l);
      } else if (page === 'ch') {
        const c = App.ix.CH[parts[1]];
        if (!c) { view.innerHTML = '<div class="empty">没有找到这一章</div>'; return; }
        renderSidebar(null, c.id);
        App.renderChapter(c);
      } else if (page === 'practice') {
        const c = App.ix.CH[parts[1]];
        if (!c) { view.innerHTML = '<div class="empty">没有找到这一章</div>'; return; }
        renderSidebar(null, c.id);
        App.renderPractice(c);
      } else if (page === 'daily') { renderSidebar(null, null); App.renderDaily(); }
      else if (page === 'plan') { renderSidebar(null, null); App.renderPlan(); }
      else if (page === 'calendar') { renderSidebar(null, null); App.renderCalendar(); }
      else if (page === 'lab') { renderSidebar(null, null); App.renderLab(); }
      else if (page === 'wrong') { renderSidebar(null, null); App.renderWrong(); }
      else if (page === 'settings') { renderSidebar(null, null); App.renderSettings(); }
      else { renderSidebar(null, null); App.renderHome(); }
    } catch (err) {
      view.innerHTML = '<div class="empty">页面渲染出错：' + esc(err && err.message) +
        '<br><button class="btn btn-ghost btn-sm" onclick="location.reload()" style="margin-top:12px">刷新重试</button></div>';
      console.error(err);
    }
  };

  /* ---------------- 启动 ---------------- */
  App.boot = function () {
    App.load();
    window.addEventListener('hashchange', App.route);

    document.querySelector('.brand').addEventListener('click', e => {
      e.preventDefault();
      App.go('#/home');
    });
    const menu = document.getElementById('btn-menu');
    if (menu) menu.addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('open');
    });

    if (!App.S.profile.lang || !LANGS[App.S.profile.lang]) {
      App.showOnboarding();
      return;
    }

    App.bindLang(App.S.profile.lang);
    const st = App.st;
    if (!st.plan || !st.plan.plan || !st.plan.plan.length) {
      /* 老数据 / 计划丢失：按已选天数重建，不动已有进度 */
      st.planDays = st.planDays || App.S.profile.days || 21;
      st.startDate = st.startDate || App.S.profile.startDate || CORE.todayKey();
      st.plan = CORE.buildPlan(App.L, st.planDays);
      App.save();
    }
    initShell();
    if (!location.hash) location.hash = '#/home';
    App.route();
  };

  window.addEventListener('DOMContentLoaded', App.boot);
})();


/* ---- js/app-learn.js ---- */
/* ============================================================
   CodeCraft · 学习页面：首页 / 课时 / 章节
   ============================================================ */
(function () {
  'use strict';

  const App = window.App, UI = App.UI, CORE = App.CORE, esc = UI.esc;

  /* 代码块：运行 / 复制 */
  App.bindCodeBoxes = function (root) {
    root = root || document.getElementById('view');
    root.querySelectorAll('[data-run]').forEach(btn => {
      if (btn.__bound) return;
      btn.__bound = 1;
      btn.addEventListener('click', async () => {
        const id = btn.getAttribute('data-run');
        const lang = btn.getAttribute('data-lang') || (App.L ? App.L.id : 'python');
        const code = UI.getCode(id);
        const out = root.querySelector('[data-out-for="' + id + '"]');
        const box = btn.closest('.codebox');
        const old = btn.textContent;
        btn.textContent = '运行中…';
        btn.disabled = true;
        if (out) { out.hidden = false; out.classList.remove('err'); out.textContent = '正在编译运行…'; }
        const r = await window.Runner.run(lang, code, '');
        btn.textContent = old;
        btn.disabled = false;
        if (!out) return;
        if (r.ok) {
          out.hidden = false;
          out.classList.remove('err');
          out.textContent = r.out || '(没有输出)';
          out.style.color = '#2b4a37';
          out.style.background = '#f6faf7';
        } else {
          out.hidden = false;
          out.classList.add('err');
          out.textContent = (r.err || '运行失败') + (r.note ? '\n— ' + r.note : '');
        }
        if (box) box.setAttribute('data-ran', '1');
      });
    });
    root.querySelectorAll('[data-copy]').forEach(btn => {
      if (btn.__bound) return;
      btn.__bound = 1;
      btn.addEventListener('click', () => {
        const code = UI.getCode(btn.getAttribute('data-copy')) || '';
        const done = () => App.toast('代码已复制', 'ok');
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(code).then(done).catch(() => fallbackCopy(code, done));
        } else fallbackCopy(code, done);
      });
    });
  };

  function fallbackCopy(text, cb) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); cb(); } catch (e) { App.toast('复制失败，请手动选中', 'bad'); }
    ta.remove();
  }

  function langHeroHtml(extra) {
    const L = App.L, st = App.st;
    const pct = CORE.overallPct(L, st);
    return '<div class="lang-hero" style="background:linear-gradient(135deg,' + L.color + ' 0%,' + shade(L.color, 18) + ' 100%)">' +
      '<h2><span>' + L.icon + '</span>' + esc(L.name) + ' · ' + esc(L.en) + '</h2>' +
      '<p>' + esc(L.blurb) + '</p>' +
      '<div class="lh-stats">' +
        '<div><b>' + pct + '%</b>总进度</div>' +
        '<div><b>' + CORE.doneCount(L, st) + '/' + App.ix.ALL.length + '</b>已读课时</div>' +
        '<div><b>' + Object.keys(st.solved).length + '</b>做对的题</div>' +
        '<div><b>' + CORE.streak(st) + '</b>连续打卡</div>' +
        (extra || '') +
      '</div></div>';
  }
  App.langHeroHtml = langHeroHtml;

  function shade(hex, amt) {
    const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '#2f6be0');
    if (!m) return '#2f6be0';
    const c = [1, 2, 3].map(i => Math.min(255, parseInt(m[i], 16) + amt));
    return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
  }

  /* ---------------- 首页 ---------------- */
  App.renderHome = function () {
    const view = document.getElementById('view');
    const L = App.L, st = App.st;
    const nextL = CORE.nextLesson(L, st);
    const day = App.planDay();
    const dayIdx = App.planDayIdx();
    const today = CORE.todayKey();
    const rec = st.days[today] || {};
    const dq = st.daily[today];
    const checked = !!(rec && rec.checkin);
    const level = CORE.LEVELS[st.level] || CORE.LEVELS.normal;

    let h = '';
    h += langHeroHtml('<div><b>' + dayIdx + '/' + (st.plan ? st.plan.days : App.S.profile.days) + '</b>计划第几天</div>');

    h += '<div class="dash-grid">';

    /* 左：今日任务 */
    h += '<div class="dash-card"><h4>📌 今日任务 <span class="sp"></span>' +
      '<a href="#/plan">查看完整计划</a></h4>';
    if (day) {
      const badge = { learn: '学习日', review: '复习日', sprint: '冲刺日' }[day.type] || '学习';
      h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">' +
        '<span class="dl-badge ' + day.type + '">第 ' + day.n + ' 天 · ' + badge + '</span>' +
        '<span style="font-size:13.5px;font-weight:700">' + esc(day.title) + '</span></div>';
      h += '<div style="font-size:12.5px;color:#7c8798;line-height:1.7;margin-bottom:12px">' + esc(day.desc) + '</div>';

      if (day.lessons.length) {
        h += '<div class="today-list">' + day.lessons.map(l => {
          const done = !!st.done[l.id];
          return '<div class="today-item" data-go="#/lesson/' + l.id + '">' +
            '<span class="ti-ico">' + (done ? '✓' : '📖') + '</span>' +
            '<span class="ti-main"><b>' + esc(l.title) + '</b><span>' + (done ? '已读完' : '约 ' + (l.time || 10) + ' 分钟') + '</span></span>' +
            '<span style="font-size:11.5px;color:' + (done ? '#0f9d58' : '#2f6be0') + ';font-weight:700">' +
            (done ? '复习' : '开始') + ' →</span></div>';
        }).join('') + '</div>';
      } else {
        h += '<div class="today-list"><div class="today-item" data-go="#/practice/' + (day.chIds[0] || L.chapters[0].id) + '">' +
          '<span class="ti-ico">🧩</span><span class="ti-main"><b>本章综合练习</b><span>按计划今天不做新内容，专攻题目</span></span>' +
          '<span style="font-size:11.5px;color:#2f6be0;font-weight:700">去练习 →</span></div></div>';
      }
    } else {
      h += '<div class="empty" style="padding:20px 0">计划还没生成，去设置里重新规划一次</div>';
    }

    if (nextL) {
      h += '<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">' +
