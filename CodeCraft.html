      explain: '`b = a` 复制的是引用，两个变量指向同一个数组，改 b 就是改 a。想要独立副本必须 `Arrays.copyOf(a, a.length)`。' },
    { id: 'jq10', ch: 'j2', lesson: 'j2l5', point: '重载规则', type: 'choice', diff: 2,
      prompt: '下面哪一组方法构成合法的重载？',
      opts: ['`int f(int a)` 和 `long f(int a)`', '`int f(int a)` 和 `int f(int a, int b)`', '`int f(int a)` 和 `int f(int b)`', '`void f()` 和 `int f()`'],
      ans: 1,
      explain: '重载要求**参数列表不同**。只改返回类型（A、D）不合法；只改变量名（C）参数列表其实一样，也不合法。' },

    { id: 'jq11', ch: 'j3', lesson: 'j3l1', point: '对象引用', type: 'output', diff: 2,
      prompt: '写出输出。',
      code: 'class A { int n; }\nclass Main {\n    public static void main(String[] args) {\n        A x = new A();\n        x.n = 1;\n        A y = x;\n        y.n = 2;\n        System.out.println(x.n);\n        A z = new A();\n        System.out.println(z.n);\n    }\n}',
      answer: '2\n0',
      explain: '`y = x` 让两个变量指向同一个对象，改 y.n 就是改 x.n。`z` 是新对象，成员变量有默认值 0。' },
    { id: 'jq12', ch: 'j3', lesson: 'j3l2', point: '构造器串联', type: 'output', diff: 2,
      prompt: '写出输出。',
      code: 'class P {\n    int x;\n    P() { this(10); }\n    P(int x) { this.x = x; }\n}\nclass Main {\n    public static void main(String[] args) {\n        System.out.println(new P().x);\n        System.out.println(new P(7).x);\n    }\n}',
      answer: '10\n7',
      explain: '无参构造器用 `this(10)` 转调带参构造器，所以 x 是 10；直接传 7 就是 7。`this(...)` 只能写在构造器第一行。' },
    { id: 'jq13', ch: 'j3', lesson: 'j3l3', point: '封装的目的', type: 'choice', diff: 2,
      prompt: '把字段设为 `private` 并提供 getter / setter，最主要的目的是什么？',
      opts: ['让代码变长', '让外部不能直接改数据，从而保证规则始终成立', '提高运行速度', '让字段变成常量'],
      ans: 1,
      explain: '封装的核心价值是**控制修改的入口**。字段公开时任何人可以直接赋非法值；私有之后，所有修改都必须走你的方法，你就有机会做校验、记日志、保持一致性。' },
    { id: 'jq14', ch: 'j3', lesson: 'j3l4', point: 'static 与实例', type: 'output', diff: 2,
      prompt: '写出输出。',
      code: 'class C {\n    static int total = 0;\n    int id;\n    C() { id = ++total; }\n}\nclass Main {\n    public static void main(String[] args) {\n        C a = new C();\n        C b = new C();\n        System.out.println(a.id + " " + b.id);\n        System.out.println(C.total);\n    }\n}',
      answer: '1 2\n2',
      explain: '`total` 是类变量，所有对象共享一份，每 new 一次加 1。`id` 是实例变量，各存各的。' },
    { id: 'jq15', ch: 'j3', lesson: 'j3l5', point: '包与 import', type: 'choice', diff: 1,
      prompt: '哪个包里的类是**自动导入**、不需要写 import 的？',
      opts: ['java.util', 'java.io', 'java.lang', 'java.time'],
      ans: 2,
      explain: '`java.lang` 是自动导入的，String、System、Math、Object、Integer 都在里面。其他包（util、io、time）都必须显式 import。' },

    { id: 'jq16', ch: 'j4', lesson: 'j4l1', point: '继承与方法调用', type: 'output', diff: 3,
      prompt: '写出输出。',
      code: 'class A {\n    String who() { return "A"; }\n    String call() { return "call " + who(); }\n}\nclass B extends A {\n    @Override String who() { return "B"; }\n}\nclass Main {\n    public static void main(String[] args) {\n        System.out.println(new B().call());\n    }\n}',
      answer: 'call B',
      explain: '`call()` 定义在父类里，但里面的 `who()` 是**动态绑定**的：调用时看对象的真实类型（B），所以返回 B。这就是模板方法能工作的原因。' },
    { id: 'jq17', ch: 'j4', lesson: 'j4l2', point: '多态', type: 'output', diff: 2,
      prompt: '写出输出。',
      code: 'class A { int f() { return 1; } }\nclass B extends A { @Override int f() { return 2; } }\nclass Main {\n    public static void main(String[] args) {\n        A a = new B();\n        System.out.println(a.f());\n        A[] arr = { new A(), new B() };\n        int s = 0;\n        for (A x : arr) s += x.f();\n        System.out.println(s);\n    }\n}',
      answer: '2\n3',
      explain: '变量声明类型是 A，但对象是 B，`a.f()` 调的是 B 的实现，得 2。数组里两个对象分别返回 1 和 2，合计 3。' },
    { id: 'jq18', ch: 'j4', lesson: 'j4l3', point: '抽象类', type: 'choice', diff: 2,
      prompt: '关于抽象类，下面哪个说法正确？',
      opts: ['抽象类可以直接 new', '抽象类里不能有具体方法', '抽象类可以有构造器，但不能被实例化', '抽象类必须实现所有方法'],
      ans: 2,
      explain: '抽象类可以有构造器（供子类 `super()` 调用）、可以有具体方法、可以有字段，唯一限制是**不能直接 new**。它可以有抽象方法，也可以一个都没有。' },
    { id: 'jq19', ch: 'j4', lesson: 'j4l4', point: '接口默认方法', type: 'output', diff: 2,
      prompt: '写出输出。',
      code: 'interface I {\n    int f();\n    default int g() { return f() * 2; }\n}\nclass Main {\n    public static void main(String[] args) {\n        I i = () -> 21;\n        System.out.println(i.f());\n        System.out.println(i.g());\n    }\n}',
      answer: '21\n42',
      explain: '`I` 是函数式接口（只有一个抽象方法 f），可以用 lambda 实现。`g()` 是默认方法，直接复用 `f()` 的结果。' },
    { id: 'jq20', ch: 'j4', lesson: 'j4l5', point: '枚举', type: 'output', diff: 2,
      prompt: '写出输出。',
      code: 'enum E {\n    A(1), B(2);\n    private final int v;\n    E(int v) { this.v = v; }\n    int v() { return v; }\n}\nclass Main {\n    public static void main(String[] args) {\n        System.out.println(E.B.ordinal());\n        System.out.println(E.B.v());\n        System.out.println(E.values().length);\n    }\n}',
      answer: '1\n2\n2',
      explain: '`ordinal()` 是序号，从 0 开始，B 是 1。`v()` 返回构造时传入的值 2。`values()` 返回所有常量，长度 2。' },

    { id: 'jq21', ch: 'j5', lesson: 'j5l1', point: 'String 方法', type: 'output', diff: 2,
      prompt: '写出输出。',
      code: 'class Main {\n    public static void main(String[] args) {\n        String s = "a,b,,c";\n        System.out.println(s.split(",").length);\n        System.out.println(s.substring(0, 3));\n        System.out.println(s.indexOf("c"));\n        System.out.println(s.replace(",", "+"));\n    }\n}',
      answer: '4\na,b\n5\na+b++c',
      explain: '`split` 会保留中间的空串（只有**末尾**空串默认被丢弃），所以是 4 段。`substring(0,3)` 取下标 0~2 得 "a,b"。`indexOf("c")` 是 5。' },
    { id: 'jq22', ch: 'j5', lesson: 'j5l2', point: 'StringBuilder 与缓存', type: 'output', diff: 3,
      prompt: '写出输出。',
      code: 'class Main {\n    public static void main(String[] args) {\n        StringBuilder sb = new StringBuilder("ab");\n        sb.append("c").insert(0, "X");\n        System.out.println(sb);\n        System.out.println(sb.reverse());\n        Integer i1 = 100, i2 = 100, j1 = 1000, j2 = 1000;\n        System.out.println(i1 == i2);\n        System.out.println(j1 == j2);\n        System.out.println(j1.equals(j2));\n    }\n}',
      answer: 'Xabc\ncbaX\ntrue\nfalse\ntrue',
      explain: '`Integer` 缓存 -128~127，100 在范围内所以是同一个对象，`==` 为 true；1000 超范围，两个独立对象，`==` 为 false，但 `equals` 为 true。' },
    { id: 'jq23', ch: 'j5', lesson: 'j5l3', point: '日期计算', type: 'output', diff: 2,
      prompt: '写出输出。',
      code: 'import java.time.*;\nclass Main {\n    public static void main(String[] args) {\n        LocalDate d = LocalDate.of(2023, 12, 31);\n        System.out.println(d.plusDays(1));\n        System.out.println(d.getDayOfWeek());\n        System.out.println(d.plusDays(1).isLeapYear());\n        System.out.println(LocalDate.of(2024, 1, 31).plusMonths(1));\n    }\n}',
      answer: '2024-01-01\nSUNDAY\ntrue\n2024-02-29',
      explain: '跨年自动进位。2023-12-31 是星期日。`plusDays` 返回新对象，d 本身还是 12-31，所以星期仍是 SUNDAY。1 月 31 日加一个月会**自动修正到 2 月最后一天**（闰年 29 日）。' },
    { id: 'jq24', ch: 'j5', lesson: 'j5l4', point: 'Math.round', type: 'choice', diff: 3,
      prompt: '`Math.round(2.5)` 和 `Math.round(-2.5)` 分别返回？',
      opts: ['3 和 -3', '3 和 -2', '2 和 -2', '2 和 -3'],
      ans: 1,
      explain: '`Math.round` 等价于 `floor(x + 0.5)`：2.5 + 0.5 = 3.0 向下取整得 3；-2.5 + 0.5 = -2.0 得 -2。所以负数的「四舍五入」偏向更大的一侧，和直觉不同。' },
    { id: 'jq25', ch: 'j5', lesson: 'j5l5', point: '正则', type: 'output', diff: 2,
      prompt: '写出输出。',
      code: 'class Main {\n    public static void main(String[] args) {\n        System.out.println("a1b22c333".replaceAll("\\\\d+", "#"));\n        System.out.println("2024-03-01".matches("\\\\d{4}-\\\\d{2}-\\\\d{2}"));\n        System.out.println("abc".matches("a.c"));\n        System.out.println("abc".matches("a.*c"));\n    }\n}',
      answer: 'a#b#c#\ntrue\ntrue\ntrue',
      explain: '`\\\\d+` 匹配连续的数字串，每段整体替换成一个 `#`。`matches` 要求**整个字符串**匹配，`.` 匹配任意单字符，`.*` 匹配任意长度。' },

    { id: 'jq26', ch: 'j6', lesson: 'j6l1', point: 'List 操作', type: 'output', diff: 2,
      prompt: '写出输出。',
      code: 'import java.util.*;\nclass Main {\n    public static void main(String[] args) {\n        List<String> l = new ArrayList<>(Arrays.asList("a", "b", "c"));\n        l.add(1, "x");\n        System.out.println(l);\n        l.remove(1);\n        System.out.println(l);\n        l.set(0, "z");\n        System.out.println(l);\n        System.out.println(l.size());\n    }\n}',
      answer: '[a, x, b, c]\n[a, b, c]\n[z, b, c]\n3',
      explain: '`add(1, "x")` 插到下标 1，原来元素后移。`remove(1)` 删下标 1（也就是 x）。`set` 是替换，不改变长度。' },
    { id: 'jq27', ch: 'j6', lesson: 'j6l2', point: 'Set 去重', type: 'output', diff: 2,
      prompt: '写出输出。',
      code: 'import java.util.*;\nclass Main {\n    public static void main(String[] args) {\n        Set<String> s = new HashSet<>();\n        System.out.println(s.add("a"));\n        System.out.println(s.add("a"));\n        System.out.println(s.size());\n        Set<Integer> t = new TreeSet<>(Arrays.asList(3, 1, 3, 2));\n        System.out.println(t);\n    }\n}',
      answer: 'true\nfalse\n1\n[1, 2, 3]',
      explain: '`add` 返回是否真的插入了：第一次 true，重复时 false（集合不变）。`TreeSet` 自动去重并排序，所以是 [1, 2, 3]。' },
    { id: 'jq28', ch: 'j6', lesson: 'j6l3', point: 'Map 基本操作', type: 'output', diff: 2,
      prompt: '写出输出。',
      code: 'import java.util.*;\nclass Main {\n    public static void main(String[] args) {\n        Map<String, Integer> m = new HashMap<>();\n        m.put("a", 1);\n        m.put("a", 2);\n        System.out.println(m.size() + " " + m.get("a"));\n        System.out.println(m.get("z"));\n        System.out.println(m.getOrDefault("z", 0));\n        m.putIfAbsent("b", 5);\n        System.out.println(new TreeMap<>(m));\n    }\n}',
      answer: '1 2\nnull\n0\n{a=2, b=5}',
      explain: '键重复时 `put` 覆盖旧值，size 仍是 1。取不存在的键返回 null（不会抛异常），`getOrDefault` 才给默认值。' },
    { id: 'jq29', ch: 'j6', lesson: 'j6l4', point: '类型擦除', type: 'choice', diff: 3,
      prompt: '关于 Java 的泛型，下面哪个说法正确？',
      opts: ['运行时能区分 List<String> 和 List<Integer>', '泛型在编译后会被擦除，运行时都是 List', '可以创建泛型数组 new T[10]', '静态方法可以使用类的类型参数 T'],
      ans: 1,
      explain: 'Java 泛型是「编译期检查 + 运行时擦除」。所以不能 `new T[]`、不能 `instanceof List<String>`、静态成员不能用类的 T——这些都是为兼容老代码付出的代价。' },
    { id: 'jq30', ch: 'j6', lesson: 'j6l5', point: '迭代器删除', type: 'output', diff: 2,
      prompt: '写出输出。',
      code: 'import java.util.*;\nclass Main {\n    public static void main(String[] args) {\n        List<Integer> l = new ArrayList<>(Arrays.asList(1, 2, 3, 4));\n        Iterator<Integer> it = l.iterator();\n        while (it.hasNext()) {\n            if (it.next() % 2 == 0) it.remove();\n        }\n        System.out.println(l);\n        l.remove(Integer.valueOf(3));\n        System.out.println(l);\n    }\n}',
      answer: '[1, 3]\n[1]',
      explain: '迭代器删除偶数，剩下 [1, 3]。`remove(Integer.valueOf(3))` 按值删除，剩下 [1]。注意 `remove(3)` 是按下标删，会抛越界。' },

    { id: 'jq31', ch: 'j7', lesson: 'j7l1', point: '受检异常', type: 'choice', diff: 2,
      prompt: '哪个异常是**受检异常**（必须 try-catch 或在方法上 throws）？',
      opts: ['NullPointerException', 'ArrayIndexOutOfBoundsException', 'IOException', 'IllegalArgumentException'],
      ans: 2,
      explain: '`IOException` 继承 `Exception` 但不是 `RuntimeException`，属于受检异常，编译器强制处理。其余三个都是 `RuntimeException` 的子类，编译器不管。' },
    { id: 'jq32', ch: 'j7', lesson: 'j7l2', point: 'finally 执行时机', type: 'output', diff: 3,
      prompt: '写出输出。',
      code: 'class Main {\n    static int f() {\n        try { return 1; }\n        finally { System.out.println("finally"); }\n    }\n    public static void main(String[] args) {\n        System.out.println(f());\n        try {\n            throw new RuntimeException("x");\n        } catch (RuntimeException e) {\n            System.out.println("catch " + e.getMessage());\n        } finally {\n            System.out.println("done");\n        }\n    }\n}',
      answer: 'finally\n1\ncatch x\ndone',
      explain: '`finally` 在方法真正返回**之前**执行，所以先打印 finally 再打印返回值 1。第二段同理：catch 打印完，finally 再打印 done。' },
    { id: 'jq33', ch: 'j7', lesson: 'j7l3', point: '读大文件', type: 'choice', diff: 2,
      prompt: '要读取一个 2 GB 的日志文件并统计行数，应该用？',
      opts: ['Files.readAllLines(path)', 'Files.readString(path)', 'Files.lines(path) 逐行流式处理', 'Files.readAllBytes(path)'],
      ans: 2,
      explain: '前两个和 `readAllBytes` 都会把整个文件读进内存，2 GB 直接 OOM。`Files.lines` 返回 Stream，逐行读取，内存占用恒定。' },
    { id: 'jq34', ch: 'j7', lesson: 'j7l4', point: 'Properties', type: 'output', diff: 2,
      prompt: '写出输出。',
      code: 'import java.util.Properties;\nclass Main {\n    public static void main(String[] args) {\n        Properties p = new Properties();\n        p.setProperty("a", "1");\n        System.out.println(p.getProperty("a"));\n        System.out.println(p.getProperty("b"));\n        System.out.println(p.getProperty("b", "默认"));\n        System.out.println(p.size());\n    }\n}',
      answer: '1\nnull\n默认\n1',
      explain: '`getProperty` 取不到返回 null，带默认值的重载才返回「默认」。size 只算真正设过的键。' },

    { id: 'jq35', ch: 'j8', lesson: 'j8l1', point: 'start 与 run', type: 'choice', diff: 2,
      prompt: '直接调用 `thread.run()` 而不是 `thread.start()`，会怎样？',
      opts: ['在新线程里执行', '在当前线程里当普通方法调用，没有并发', '抛异常', '启动两个线程'],
      ans: 1,
      explain: '`start()` 才会让 JVM 创建新线程并回调 `run()`。直接调 `run()` 只是一次普通方法调用，代码仍在当前线程顺序执行——不报错，但没有并发。' },
    { id: 'jq36', ch: 'j8', lesson: 'j8l2', point: '同步', type: 'output', diff: 2,
      prompt: '写出输出（4 个线程各加 2500 次，方法带 synchronized）。',
      code: 'class C {\n    private int n = 0;\n    synchronized void inc() { n++; }\n    int get() { return n; }\n}\nclass Main {\n    public static void main(String[] args) throws Exception {\n        C c = new C();\n        Thread t = new Thread(() -> { for (int i = 0; i < 1000; i++) c.inc(); });\n        t.start();\n        t.join();\n        System.out.println(c.get());\n        System.out.println(Thread.currentThread().getName().equals("main"));\n    }\n}',
      answer: '1000\ntrue',
      explain: '加锁后每次自增都不会丢失，结果就是 1000。主线程名字默认是 "main"。去掉 `synchronized` 后结果可能小于 1000。' },
    { id: 'jq37', ch: 'j8', lesson: 'j8l3', point: '线程池关闭', type: 'choice', diff: 2,
      prompt: '`pool.shutdown()` 的作用是？',
      opts: ['立刻中断所有正在执行的任务', '不再接受新任务，已提交的任务会执行完', '什么也不做', '清空队列并抛异常'],
      ans: 1,
      explain: '`shutdown()` 是「优雅关闭」：拒绝新任务，等已有任务跑完再退出。要立刻中断用 `shutdownNow()`（但它也只是发中断信号，不保证停）。' },
    { id: 'jq38', ch: 'j8', lesson: 'j8l4', point: 'URI 解析', type: 'output', diff: 2,
      prompt: '写出输出。',
      code: 'import java.net.URI;\nclass Main {\n    public static void main(String[] args) {\n        URI u = URI.create("https://example.com:8080/a/b?x=1");\n        System.out.println(u.getScheme());\n        System.out.println(u.getHost());\n        System.out.println(u.getPort());\n        System.out.println(u.getPath());\n    }\n}',
      answer: 'https\nexample.com\n8080\n/a/b',
      explain: '协议、主机、端口、路径各自独立。注意没写端口时 `getPort()` 返回 -1，而不是 80 或 443。' },

    { id: 'jq39', ch: 'j9', lesson: 'j9l1', point: '函数组合', type: 'output', diff: 3,
      prompt: '写出输出。',
      code: 'import java.util.function.*;\nclass Main {\n    public static void main(String[] args) {\n        Function<Integer, Integer> f = x -> x + 1;\n        Function<Integer, Integer> g = x -> x * 2;\n        System.out.println(f.andThen(g).apply(3));\n        System.out.println(g.andThen(f).apply(3));\n        System.out.println(f.compose(g).apply(3));\n    }\n}',
      answer: '8\n7\n7',
      explain: '`f.andThen(g)` 先 f 后 g：(3+1)*2 = 8。`g.andThen(f)` 先 g 后 f：3*2+1 = 7。`f.compose(g)` 等价于 `f(g(x))`，也是 7。' },
    { id: 'jq40', ch: 'j9', lesson: 'j9l2', point: 'Stream', type: 'output', diff: 3,
      prompt: '写出输出。',
      code: 'import java.util.*;\nimport java.util.stream.*;\nclass Main {\n    public static void main(String[] args) {\n        List<Integer> l = Arrays.asList(1, 2, 3, 4, 5);\n        System.out.println(l.stream().filter(x -> x % 2 == 1).mapToInt(x -> x).sum());\n        System.out.println(l.stream().reduce(0, Integer::sum));\n        System.out.println(l.stream().map(String::valueOf).collect(Collectors.joining(",")));\n        System.out.println(l.stream().anyMatch(x -> x > 4));\n    }\n}',
      answer: '9\n15\n1,2,3,4,5\ntrue',
      explain: 'filter 留下奇数 1+3+5 = 9；reduce 从 0 开始累加得 15；joining 用逗号拼成字符串；anyMatch 判断「是否存在大于 4 的元素」，5 满足所以是 true。' }
  ],

  checkin: [
    { id: 'jk1', ch: 'j1', point: 'JDK 与 JRE', type: 'choice', diff: 1,
      prompt: '只想运行别人编译好的 Java 程序，最少需要装什么？',
      opts: ['只要 JVM', 'JRE', 'JDK', '都不需要'],
      ans: 1,
      explain: 'JRE = JVM + 标准类库，能运行但不能编译。要自己编译代码才需要 JDK（它包含 JRE）。' },
    { id: 'jk2', ch: 'j1', point: '文件名规则', type: 'choice', diff: 1,
      prompt: '一个文件里有 `public class Hello`，文件名必须是？',
      opts: ['任意名字', 'Hello.java', 'hello.java', 'Hello.class'],
      ans: 1,
      explain: '`public` 类的名字必须和文件名完全一致（含大小写）。`hello.java` 会报「类 Hello 是 public，应在名为 Hello.java 的文件中声明」。' },
    { id: 'jk3', ch: 'j1', point: 'print 与 println', type: 'choice', diff: 1,
      prompt: '`System.out.print` 和 `System.out.println` 的区别是？',
      opts: ['前者更快', '后者输出后换行', '前者不能输出中文', '没有区别'],
      ans: 1,
      explain: '`println` 末尾会加换行符，`print` 不加。想连续在一行输出用 `print`，最后再 `println()` 收尾。' },
    { id: 'jk4', ch: 'j1', point: '成员变量默认值', type: 'output', diff: 2,
      prompt: '写出输出。',
      code: 'class A { int i; double d; boolean b; String s; }\nclass Main {\n    public static void main(String[] args) {\n        A a = new A();\n        System.out.println(a.i + " " + a.d + " " + a.b + " " + a.s);\n    }\n}',
      answer: '0 0.0 false null',
      explain: '成员变量有默认值：数值类型是 0、布尔是 false、引用类型是 null。**局部变量没有默认值**，不初始化直接用会编译报错。' },

    { id: 'jk5', ch: 'j1', point: 'String 的类型', type: 'choice', diff: 1,
      prompt: '`String` 是基本类型吗？',
      opts: ['是，和 int 一样', '不是，它是引用类型（类）', '看情况', '只有 String[] 才是'],
      ans: 1,
      explain: '八种基本类型是 byte/short/int/long/float/double/char/boolean。String 是类，属于引用类型，所以比较内容必须用 `equals`。' },
    { id: 'jk6', ch: 'j1', point: '字面量后缀', type: 'choice', diff: 2,
      prompt: '`long x = 10000000000;` 编译报错，怎么改？',
      opts: ['改成 `long x = 10000000000L;`', '改成 `double x = ...`', '加括号', '改成 `Long x = ...`'],
      ans: 0,
      explain: '整数字面量默认是 `int`，超过 21 亿就编译不过。加 `L` 表示这是 long 字面量。同理 float 要加 `f`。' },
    { id: 'jk7', ch: 'j1', point: '整数除法', type: 'output', diff: 1,
      prompt: '写出输出。',
      code: 'class Main {\n    public static void main(String[] args) {\n        int a = 7, b = 2;\n        System.out.println(a / b);\n        System.out.println((double) a / b);\n        System.out.println(a % b);\n    }\n}',
      answer: '3\n3.5\n1',
      explain: '整数相除结果是整数，小数被截断。想让结果带小数，至少一边要是 double。`%` 取余数。' },

    { id: 'jk8', ch: 'j2', point: '三元表达式', type: 'output', diff: 2,
      prompt: '写出输出。',
      code: 'class Main {\n    public static void main(String[] args) {\n        int a = 5;\n        String s = a > 3 ? "大" : "小";\n        System.out.println(s);\n        System.out.println(a > 10 ? 1 : 2.5);\n    }\n}',
      answer: '大\n2.5',
      explain: '三目是「条件 ? 值1 : 值2」，整个表达式的类型取两边的公共类型。1 和 2.5 的公共类型是 double，所以打印 2.5。' },
    { id: 'jk9', ch: 'j2', point: '自增单独成句', type: 'output', diff: 1,
      prompt: '写出输出。',
      code: 'class Main {\n    public static void main(String[] args) {\n        int i = 1;\n        i++;\n        ++i;\n        System.out.println(i);\n        System.out.println(i++);\n        System.out.println(i);\n    }\n}',
      answer: '3\n3\n4',
      explain: '单独成句时 `i++` 和 `++i` 都是加 1，两次之后 i=3。在 `println(i++)` 里才有区别：先打印 3，再自增成 4。' },

    { id: 'jk10', ch: 'j2', point: 'switch 支持类型', type: 'choice', diff: 2,
      prompt: '`switch` 的表达式**不能**是哪种类型？',
      opts: ['int', 'String', 'enum', 'double'],
      ans: 3,
      explain: '`switch` 支持整型、char、String、枚举，不支持 long 和浮点数。判断范围或浮点要用 if。' },
    { id: 'jk11', ch: 'j2', point: 'for-each 限制', type: 'choice', diff: 2,
      prompt: '用 `for (int x : arr)` 遍历时，`x = 0;` 能把数组元素改成 0 吗？',
      opts: ['能', '不能，x 是元素的副本', '只能改第一个', '会编译报错'],
      ans: 1,
      explain: '增强 for 的变量是**元素的副本**，改它不影响数组。要改元素必须用下标 `arr[i] = 0`。' },
    { id: 'jk12', ch: 'j2', point: '数组长度', type: 'choice', diff: 1,
      prompt: '获取数组长度的正确写法是？',
      opts: ['a.length()', 'a.length', 'a.size()', 'a.count'],
      ans: 1,
      explain: '数组用 `length`（属性，不带括号），字符串用 `length()`（方法），集合用 `size()`。三个容易混。' },
    { id: 'jk13', ch: 'j2', point: '打印数组', type: 'choice', diff: 2,
      prompt: '想打印 `int[] a` 的内容，应该用？',
      opts: ['System.out.println(a)', 'System.out.println(a.toString())', 'System.out.println(Arrays.toString(a))', 'System.out.println(a[0])'],
      ans: 2,
      explain: '数组的 `toString()` 没被重写，打印出来是 `[I@1b6d3586` 这种地址串。要打印内容必须用 `Arrays.toString`（二维用 `deepToString`）。' },

    { id: 'jk14', ch: 'j3', point: '重载 vs 重写', type: 'choice', diff: 2,
      prompt: '「重写（override）」发生的位置是？',
      opts: ['同一个类里，方法名相同参数不同', '子类与父类之间，方法签名相同', '任意两个类之间', '接口与实现类之间且方法名不同'],
      ans: 1,
      explain: '重写是子类重新实现父类的同名同参方法，运行时动态绑定。重载是同一个类里同名不同参，编译期决定。' },
    { id: 'jk15', ch: 'j3', point: '构造器', type: 'choice', diff: 1,
      prompt: '构造器的写法，正确的是？',
      opts: ['`public void Student() {}`', '`public Student() {}`', '`public Student(void) {}`', '`void Student() {}`'],
      ans: 1,
      explain: '构造器**没有返回类型**（连 void 都不能写），名字必须和类名完全一致。写了 void 就变成普通方法了。' },
    { id: 'jk16', ch: 'j3', point: 'this 的用途', type: 'choice', diff: 1,
      prompt: '`this.name = name;` 里的 `this` 指什么？',
      opts: ['当前类的类对象', '当前正在执行的对象', '父类对象', '方法参数'],
      ans: 1,
      explain: '`this` 指当前对象。当参数名和字段名相同时，用 `this.name` 明确「左边是字段」。`this(...)` 还能调用本类其他构造器。' },
    { id: 'jk17', ch: 'j3', point: 'private 的范围', type: 'choice', diff: 2,
      prompt: '`private` 成员的可见范围是？',
      opts: ['只有本类内部', '同包的类', '所有子类', '所有类'],
      ans: 0,
      explain: '`private` 只在**本类**内部可见，子类也访问不到（虽然能继承这块内存，但没法直接引用）。要通过 getter 或 protected 暴露。' },
    { id: 'jk18', ch: 'j3', point: 'static 方法限制', type: 'choice', diff: 2,
      prompt: '在 `static` 方法里直接写 `count++`（count 是实例字段），会怎样？',
      opts: ['正常执行', '编译错误：不能从静态上下文引用非静态变量', '运行时抛异常', 'count 变成 null'],
      ans: 1,
      explain: 'static 方法属于类，没有 this，不知道操作哪个对象的 count。要么把 count 也改成 static，要么改成实例方法。' },

    { id: 'jk19', ch: 'j4', point: '继承私有成员', type: 'choice', diff: 2,
      prompt: '子类能直接访问父类的 `private` 字段吗？',
      opts: ['能，继承下来了', '不能，只能通过父类提供的 public / protected 方法', '能，但要加 super', '取决于是否同包'],
      ans: 1,
      explain: 'private 成员对子类不可见。子类对象内部确实有那块内存，但无法直接命名访问，必须通过父类给的 getter / setter。' },
    { id: 'jk20', ch: 'j4', point: '@Override 作用', type: 'choice', diff: 1,
      prompt: '`@Override` 注解的实际作用是？',
      opts: ['让方法执行更快', '让编译器检查确实重写了父类方法', '自动生成方法体', '让方法变成静态'],
      ans: 1,
      explain: '它不改变运行行为，只是**编译期检查**：如果方法名拼错或签名不匹配，会立刻报错，而不是悄悄变成一个无关的新方法。' },
    { id: 'jk21', ch: 'j4', point: '抽象类构造器', type: 'choice', diff: 3,
      prompt: '抽象类可以有构造器吗？',
      opts: ['不能，抽象类不能被实例化', '能，供子类 super() 调用', '能，但只能是无参的', '只有接口不能有'],
      ans: 1,
      explain: '抽象类可以有任意构造器，子类构造时通过 `super(...)` 调用它。只是不能 `new 抽象类()` 而已。' },
    { id: 'jk22', ch: 'j4', point: '接口多实现', type: 'choice', diff: 1,
      prompt: '一个 Java 类最多能实现几个接口？',
      opts: ['1 个', '2 个', '数量不限', '取决于 JDK 版本'],
      ans: 2,
      explain: '接口可以实现任意多个：`class A implements X, Y, Z`。这是 Java 在「单继承」限制下获得多态灵活性的方式。' },
    { id: 'jk23', ch: 'j4', point: '枚举取值', type: 'output', diff: 2,
      prompt: '写出输出。',
      code: 'enum Color { RED, GREEN, BLUE }\nclass Main {\n    public static void main(String[] args) {\n        System.out.println(Color.GREEN.ordinal());\n        System.out.println(Color.values()[2]);\n        System.out.println(Color.valueOf("RED").name());\n    }\n}',
      answer: '1\nBLUE\nRED',
      explain: '`ordinal()` 是序号（从 0 开始），`values()` 返回所有常量数组，`valueOf("X")` 按名字取常量。' },

    { id: 'jk24', ch: 'j5', point: 'String 不可变', type: 'choice', diff: 2,
      prompt: '`s.toUpperCase();` 调用后 s 会变成大写吗？',
      opts: ['会', '不会，必须接收返回值', '只有纯字母才会', '取决于 JVM'],
      ans: 1,
      explain: 'String 不可变，所有「修改」方法都返回**新字符串**。写成 `s = s.toUpperCase();` 才生效。这个坑非常常见。' },
    { id: 'jk25', ch: 'j5', point: 'String 不可变的价值', type: 'choice', diff: 3,
      prompt: 'String 设计成不可变，带来哪些好处？',
      opts: ['拼接更快', '可以安全共享、哈希值可缓存、天然线程安全', '占用内存更少', '可以直接比较地址'],
      ans: 1,
      explain: '不可变意味着对象一旦创建就安全共享（常量池），`hashCode` 可以缓存（HashMap 快），多线程下也不用加锁。代价是拼接产生临时对象。' },
    { id: 'jk26', ch: 'j5', point: 'String 不可变实测', type: 'output', diff: 2,
      prompt: '写出输出。',
      code: 'class Main {\n    public static void main(String[] args) {\n        String s = "abc";\n        s.toUpperCase();\n        System.out.println(s);\n        s = s.toUpperCase();\n        System.out.println(s);\n        System.out.println(s.length());\n    }\n}',
      answer: 'abc\nABC\n3',
      explain: '第一次调用没有接收返回值，s 还是 "abc"。第二次赋回给 s 才变成 "ABC"。' },
    { id: 'jk27', ch: 'j5', point: 'StringBuilder 场景', type: 'choice', diff: 2,
      prompt: '为什么循环里拼接字符串建议用 StringBuilder？',
      opts: ['语法更短', 'String 每次 `+` 都创建新对象，循环多了会产生大量垃圾', 'StringBuilder 支持中文', 'String 不能拼接'],
      ans: 1,
      explain: '`s += x` 每次都新建一个 String（老对象变垃圾），n 次循环产生 n 个对象。StringBuilder 内部是可变数组，只有最后 `toString()` 才生成一次字符串。' },
    { id: 'jk28', ch: 'j5', point: '自动拆箱', type: 'output', diff: 3,
      prompt: '写出输出。',
      code: 'class Main {\n    public static void main(String[] args) {\n        Integer n = null;\n        try {\n            int x = n;\n            System.out.println(x);\n        } catch (NullPointerException e) {\n            System.out.println("空指针");\n        }\n        System.out.println(n == null);\n    }\n}',
      answer: '空指针\ntrue',
      explain: '`int x = n;` 会触发自动拆箱，也就是调用 `n.intValue()`，对 null 调用方法就抛 NPE。接口参数用包装类时这个坑很常见。' },
    { id: 'jk29', ch: 'j5', point: '日期不可变', type: 'choice', diff: 2,
      prompt: '`LocalDate d = LocalDate.of(2024,1,1); d.plusDays(1);` 之后 d 是？',
      opts: ['2024-01-02', '仍然是 2024-01-01', 'null', '报错'],
      ans: 1,
      explain: '`java.time` 的对象都不可变，`plusDays` 返回**新对象**。必须写 `d = d.plusDays(1);`。' },
    { id: 'jk30', ch: 'j5', point: 'Math.abs 边界', type: 'output', diff: 3,
      prompt: '写出输出。',
      code: 'class Main {\n    public static void main(String[] args) {\n        System.out.println(Math.abs(Integer.MIN_VALUE));\n        System.out.println(Integer.MAX_VALUE + 1);\n        System.out.println(Math.abs(-5));\n    }\n}',
      answer: '-2147483648\n-2147483648\n5',
      explain: 'int 的最小值是 -2147483648，它的相反数 2147483648 超出了 int 上限，所以 `Math.abs` 返回的还是负数。这是二进制补码的必然结果，取绝对值前要判断边界。' },

    { id: 'jk31', ch: 'j6', point: 'List 与 Set', type: 'choice', diff: 1,
      prompt: '既要保证元素不重复、又要保持插入顺序，用哪个？',
      opts: ['ArrayList', 'HashSet', 'LinkedHashSet', 'HashMap'],
      ans: 2,
      explain: '`LinkedHashSet` = 哈希表 + 链表，既能去重又能保持插入顺序。`HashSet` 不保证顺序，`TreeSet` 会排序。' },
    { id: 'jk32', ch: 'j6', point: 'Map 键的要求', type: 'choice', diff: 2,
      prompt: '自定义对象作为 `HashMap` 的键，必须正确重写哪两个方法？',
      opts: ['toString 和 clone', 'hashCode 和 equals', 'compareTo 和 equals', '只有 hashCode'],
      ans: 1,
      explain: 'HashMap 先按 `hashCode` 找桶，再用 `equals` 在桶内找。两个不配套就会「明明相等却取不到」，或者两个相等的对象被存成两份。' },
    { id: 'jk33', ch: 'j6', point: 'PECS 原则', type: 'choice', diff: 3,
      prompt: '只往集合里放元素、不读出来的方法，参数应该声明成？',
      opts: ['List<? extends Number>', 'List<? super Integer>', 'List<Object>', 'List<?>'],
      ans: 1,
      explain: 'PECS：Producer Extends, Consumer Super。作为「消费者」（往里写）用 `super`，能接受 `List<Integer>`、`List<Number>`、`List<Object>`。' },
    { id: 'jk34', ch: 'j6', point: '遍历时删除', type: 'choice', diff: 2,
      prompt: '遍历 List 的同时要删除元素，正确做法是？',
      opts: ['for-each 里直接 list.remove(x)', '用 Iterator.remove() 或 list.removeIf(...)', '先 for-each 遍历，再单独 remove', '用 while 无限循环删'],
      ans: 1,
      explain: 'for-each 里直接删会抛 `ConcurrentModificationException`（迭代器的修改计数对不上）。用 `Iterator.remove()` 或 `removeIf` 才对。' },

    { id: 'jk35', ch: 'j7', point: 'throws 声明', type: 'choice', diff: 2,
      prompt: '方法里可能抛 `IOException` 又不想当场处理，应该怎么写？',
      opts: ['在方法上加 `throws IOException`', '在方法上加 `throw IOException`', '什么都不用写', '在类上加 @Throws'],
      ans: 0,
      explain: '受检异常要么 try-catch，要么在方法签名上 `throws IOException` 交给自己调用方处理。`throw` 是抛出一个具体异常对象，不是声明。' },
    { id: 'jk36', ch: 'j7', point: 'try-with-resources 条件', type: 'choice', diff: 2,
      prompt: '一个资源类要能用在 try-with-resources 里，必须满足什么？',
      opts: ['实现 Serializable', '实现 AutoCloseable', '有 close 方法即可', '继承 Thread'],
      ans: 1,
      explain: '必须实现 `AutoCloseable`（或它的子接口 `Closeable`），编译器才会在 try 结束时自动调用 `close()`。' },
    { id: 'jk37', ch: 'j8', point: '线程启动', type: 'choice', diff: 1,
      prompt: '让线程真正开始执行，应该调用？',
      opts: ['t.run()', 't.start()', 't.exec()', 't.begin()'],
      ans: 1,
      explain: '`start()` 才会让 JVM 创建新线程并回调 `run()`。直接调 `run()` 只是在当前线程里当普通方法执行，没有并发。' },
    { id: 'jk38', ch: 'j8', point: '同步的锁对象', type: 'choice', diff: 3,
      prompt: '`synchronized void inc()` 用的锁是哪个对象？',
      opts: ['类对象', '当前实例 this', '一个隐式新建的锁', '调用线程'],
      ans: 1,
      explain: '实例方法上的 `synchronized` 锁的是 **this**。所以两个不同对象的方法可以同时执行，同一对象才互斥。要给整个类加锁得用 `synchronized (Xxx.class)` 或 static 同步方法。' },
    { id: 'jk39', ch: 'j9', point: 'lambda 捕获', type: 'choice', diff: 3,
      prompt: 'lambda 里引用外部局部变量，有什么限制？',
      opts: ['没有限制', '变量必须是 final 或事实不变（不再被赋值）', '必须是 static 变量', '必须是包装类型'],
      ans: 1,
      explain: 'lambda 捕获的是变量的**值**，所以要求它不变。想在 lambda 里累加，用 `AtomicInteger` 或单元素数组。' },
    { id: 'jk40', ch: 'j9', point: '单元测试', type: 'choice', diff: 1,
      prompt: 'JUnit 5 里标记一个测试方法的注解是？',
      opts: ['@Test', '@UnitTest', '@Case', '@Run'],
      ans: 0,
      explain: '`@Test` 标记测试方法，配合 `assertEquals`、`assertThrows` 等断言。方法通常写成包级可见（不用 public）。' }
  ]

            { t: 'code', run: false, label: 'main.js', x: 'let todos = [];\nconst listEl = document.querySelector("#todo");\nconst countEl = document.querySelector("#count");\n\nfunction render() {\n  listEl.innerHTML = "";\n  const frag = document.createDocumentFragment();\n\n  todos.forEach(t => {\n    const li = document.createElement("li");\n    li.dataset.id = t.id;\n    li.className = t.done ? "done" : "";\n    li.innerHTML = `<span>${t.text}</span><button class="del">×</button>`;\n    frag.append(li);\n  });\n\n  listEl.append(frag);\n  countEl.textContent = `共 ${todos.length} 条，未完成 ${todos.filter(t => !t.done).length} 条`;\n}\n\n/* 添加 */\ndocument.querySelector("#add").addEventListener("submit", e => {\n  e.preventDefault();\n  const input = document.querySelector("#text");\n  const text = input.value.trim();\n  if (!text) return;\n  todos = [...todos, { id: Date.now(), text, done: false }];\n  input.value = "";\n  render();\n});\n\n/* 一个监听器同时处理「勾选」和「删除」 */\nlistEl.addEventListener("click", e => {\n  const li = e.target.closest("li");\n  if (!li) return;\n  const id = Number(li.dataset.id);\n\n  if (e.target.classList.contains("del")) {\n    todos = todos.filter(t => t.id !== id);\n  } else {\n    todos = todos.map(t => (t.id === id ? { ...t, done: !t.done } : t));\n  }\n  render();\n});' },

            { t: 'code', x: 'function debounce(fn, ms) {\n  let timer;\n  return (...args) => {\n    clearTimeout(timer);\n    timer = setTimeout(() => fn(...args), ms);\n  };\n}\n\nfunction throttle(fn, ms) {\n  let last = 0;\n  return (...args) => {\n    const now = Date.now();\n    if (now - last >= ms) {\n      last = now;\n      fn(...args);\n    }\n  };\n}\n\nlet calls = 0;\nconst d = debounce(() => { calls++; }, 20);\nd(); d(); d();\nconsole.log("防抖：连续三次只排了一次，立即调用次数", calls);\n\nconst t = throttle(() => { calls++; }, 30);\nt(); t(); t();\nconsole.log("节流：三次里只有第一次生效，累计", calls);\n\nsetTimeout(() => console.log("20ms 后防抖真正执行，累计", calls), 60);', out: '防抖：连续三次只排了一次，立即调用次数 0\n节流：三次里只有第一次生效，累计 1\n20ms 后防抖真正执行，累计 2' },

    { id: 'jsq19', ch: 'js4', lesson: 'js4l4', point: '深浅拷贝', type: 'choice', diff: 2,
      prompt: '下面哪个是**深拷贝**？',
      opts: ['`{ ...obj }`', '`Object.assign({}, obj)`', '`structuredClone(obj)`', '`obj.slice()`'],
      ans: 2,
      explain: '前两个都只复制第一层，嵌套对象仍共享引用。`structuredClone` 会递归复制，并且能处理 Date、Map、Set、循环引用（函数不行）。' },

    { id: 'jsq20', ch: 'js4', lesson: 'js4l2', point: 'forEach 的局限', type: 'choice', diff: 2,
      prompt: '想遍历数组、遇到第一个满足条件的元素就**提前结束**，应该用哪个？',
      opts: ['forEach', 'map', 'for...of（或 some / find）', 'filter'],
      ans: 2,
      explain: '`forEach` 和 `map` 都会跑完全部元素，`return` 只能跳出当前回调，不能中断循环。要中途退出就用 `for...of` 配 `break`，或者用 `some`/`find` 这类语义化方法。' },

    { id: 'jsq21', ch: 'js5', lesson: 'js5l1', point: '微任务与宏任务', type: 'output', diff: 3,
      prompt: '写出输出顺序。',
      code: 'console.log("1");\nsetTimeout(() => console.log("2"), 0);\nPromise.resolve().then(() => console.log("3"));\nconsole.log("4");',
      answer: '1\n4\n3\n2',
      explain: '同步代码先跑完（1、4），然后清空**微任务**队列（Promise 的 then，输出 3），最后才轮到**宏任务**（setTimeout，输出 2）。哪怕延时写 0，定时器也排在微任务之后。' },

    { id: 'jsq22', ch: 'js5', lesson: 'js5l3', point: 'catch 之后链还能继续', type: 'output', diff: 2,
      prompt: '写出输出。',
      code: 'Promise.resolve(1)\n  .then(v => v + 1)\n  .then(v => { throw new Error("x"); })\n  .catch(e => 0)\n  .then(v => console.log(v));',
      answer: '0',
      explain: '中间抛错会跳到最近的 `catch`，`catch` 的返回值 0 让链条**恢复正常**，后面的 then 拿到 0。如果 catch 里又抛，就会继续往后找下一个 catch。' },

    { id: 'jsq23', ch: 'js5', lesson: 'js5l4', point: 'async 的返回值', type: 'choice', diff: 2,
      prompt: '`async function f() { return 1; }`，调用 `f()` 得到什么？',
      opts: ['数字 1', 'Promise，resolve 值是 1', 'undefined', '需要再调用一次才执行'],
      ans: 1,
      explain: '`async` 函数的返回值会被自动包成 Promise。所以拿结果要 `await f()` 或 `f().then(...)`。函数体是同步开始执行的，只是返回被包装了。' },

    { id: 'jsq24', ch: 'js5', lesson: 'js5l5', point: 'allSettled 的结果', type: 'output', diff: 3,
      prompt: '写出输出。',
      code: 'Promise.allSettled([Promise.resolve(1), Promise.reject(new Error("坏"))])\n  .then(r => console.log(r.map(x => x.status)));',
      answer: '["fulfilled","rejected"]',
      explain: '`allSettled` 等所有任务都有结果才 resolve，不管成功失败，每项带着 `status`。`Promise.all` 则是一遇到 reject 就整体失败，拿不到后面的结果。' },

    { id: 'jsq25', ch: 'js5', lesson: 'js5l2', point: '清除定时器', type: 'choice', diff: 1,
      prompt: '`setInterval` 创建后想让它停下来，应该调用什么？',
      opts: ['clearTimeout', 'clearInterval（传入返回的 id）', 'stop()', 'return false'],
      ans: 1,
      explain: '`setInterval` 返回一个 id，用 `clearInterval(id)` 清除。把 id 存到变量里很关键，否则组件卸载后就再也停不掉，会造成定时器泄漏。' },

    { id: 'jsq26', ch: 'js6', lesson: 'js6l1', point: 'textContent 与 innerHTML', type: 'choice', diff: 1,
      prompt: '要把用户输入的一段文字显示到页面，用哪个更安全？',
      opts: ['`el.innerHTML = text`', '`el.textContent = text`', '`el.outerHTML = text`', '`el.insertAdjacentHTML("beforeend", text)`'],
      ans: 1,
      explain: '`textContent` 把内容当**纯文本**，`<` 会被转义显示。用 innerHTML 系列拼接用户输入，等于给自己开了 XSS 的后门。' },

    { id: 'jsq27', ch: 'js6', lesson: 'js6l2', point: '事件冒泡', type: 'choice', diff: 2,
      prompt: '点击按钮时，想让事件**不再往上冒泡**给父元素，调用什么？',
      opts: ['`e.preventDefault()`', '`e.stopPropagation()`', '`e.target = null`', '`return true`'],
      ans: 1,
      explain: '`stopPropagation()` 阻止冒泡（和捕获阶段的继续传播）；`preventDefault()` 是取消默认行为（比如表单提交、链接跳转），两件事完全不同。' },

    { id: 'jsq28', ch: 'js6', lesson: 'js6l3', point: '阻止表单提交', type: 'choice', diff: 1,
      prompt: '用 JS 校验表单，校验不通过时想阻止页面刷新，应该在 submit 回调里做什么？',
      opts: ['`e.preventDefault()`', '`e.stopPropagation()`', '`form.reset()`', '`throw new Error()`'],
      ans: 0,
      explain: '表单提交会触发默认的导航行为，`preventDefault()` 正好取消它。`stopPropagation` 只管事件传播，表单照样提交。' },

    { id: 'jsq29', ch: 'js6', lesson: 'js6l4', point: '重排与重绘', type: 'choice', diff: 3,
      prompt: '做位移动画时，为什么推荐 `transform: translateX()` 而不是改 `left`？',
      opts: ['因为 left 不支持动画', '因为 transform 走合成层，通常不触发重排，只做合成', '因为 left 只能用整数', '两者性能完全一样'],
      ans: 1,
      explain: '改 `left`/`top`/`width` 会让浏览器重新计算布局（reflow），代价高；`transform` 和 `opacity` 可以只走合成（composite），由 GPU 处理，动画更顺。' },

    { id: 'jsq30', ch: 'js6', lesson: 'js6l5', point: '事件委托', type: 'choice', diff: 2,
      prompt: '给列表做事件委托，为了确认「点的是不是某个 li」，最合适的做法是？',
      opts: ['比较 `e.target === ul`', '用 `e.target.closest("li")` 判断并拿到那个 li', '给每个 li 都绑一次监听', '用 `e.target.id` 判断'],
      ans: 1,
      explain: '`e.target` 可能是 li 里面的 span，`closest("li")` 会沿祖先往上找最近的 li，既准确又不用管内部结构。给每个 li 绑监听就失去委托的意义了。' },

    { id: 'jsq31', ch: 'js7', lesson: 'js7l1', point: 'fetch 的错误处理', type: 'choice', diff: 3,
      prompt: '`fetch("/api/x")` 服务端返回 404 时，会怎样？',
      opts: ['Promise 直接 reject', 'Promise resolve，但 `res.ok` 是 false', '抛出同步异常', '自动重试一次'],
      ans: 1,
      explain: 'fetch 只在**网络层失败**（断网、DNS 错）时 reject。HTTP 4xx/5xx 算「请求成功完成」，需要自己判断 `res.ok`（或 `res.status`）后手动 `throw`。' },

    { id: 'jsq32', ch: 'js7', lesson: 'js7l1', point: '响应体只能读一次', type: 'choice', diff: 2,
      prompt: '已经调用过 `await res.json()`，再调用一次 `await res.json()` 会怎样？',
      opts: ['再返回一份同样的数据', '抛出 TypeError：body 已被读取', '返回空对象', '返回字符串'],
      ans: 1,
      explain: '响应体是**流**，只能消费一次。需要多次使用就先存到变量里：`const data = await res.json()`，后面都用 data。' },

    { id: 'jsq33', ch: 'js7', lesson: 'js7l2', point: 'localStorage 的限制', type: 'choice', diff: 2,
      prompt: '关于 localStorage，下面哪个说法对？',
      opts: ['可以直接存对象', '只能存字符串，存对象要先 JSON.stringify', '关闭浏览器就清空', '容量有几 GB'],
      ans: 1,
      explain: 'localStorage 的值统一按字符串存，存对象会被转成 `"[object Object]"`。容量一般 5MB 左右，不会随会话清空（那是 sessionStorage），并且是**同步** API，大量读写会卡主线程。' },

    { id: 'jsq34', ch: 'js7', lesson: 'js7l3', point: '模块导出', type: 'choice', diff: 2,
      prompt: '一个模块里能写几个 `export default`？',
      opts: ['任意多个', '最多一个', '必须至少一个', '一个都不能有'],
      ans: 1,
      explain: '`export default` 是「这个模块的主出口」，只能有一个；具名导出 `export const a = ...` 可以有任意多个，导入时用 `import { a }`。' },

    { id: 'jsq35', ch: 'js7', lesson: 'js7l3', point: '模块作用域', type: 'choice', diff: 3,
      prompt: '用 `<script type="module">` 引入的代码，和普通 script 相比有什么不同？',
      opts: ['没有区别', '默认严格模式、有独立作用域、自动延迟执行', '不能使用箭头函数', '必须写 window.onload'],
      ans: 1,
      explain: '模块默认 `"use strict"`，顶层变量不会挂到 window 上（有自己的作用域），并且默认 `defer`（等 HTML 解析完再执行），还支持 import/export。' },

    { id: 'jsq36', ch: 'js8', lesson: 'js8l1', point: '可选链与空值合并', type: 'output', diff: 2,
      prompt: '写出输出。',
      code: 'const o = { a: { b: 0 } };\nconsole.log(o?.a?.b ?? "默认");\nconsole.log(o?.x?.y ?? "默认");\nconsole.log(o.a.b || "默认");',
      answer: '0\n默认\n默认',
      explain: '`??` 只在左值是 `null`/`undefined` 时取右边，0 是有效值所以照常输出；`o?.x` 是 undefined，`?.y` 短路后整体 undefined，取默认值。`||` 把 0 当成假值，所以最后一行也给了默认值——这就是 `??` 存在的理由。' },

    { id: 'jsq37', ch: 'js8', lesson: 'js8l2', point: '生成器的返回值', type: 'output', diff: 3,
      prompt: '写出输出。',
      code: 'function* gen() { yield 1; yield 2; return 3; }\nconst it = gen();\nconsole.log(it.next());\nconsole.log([...gen()]);',
      answer: '{"value":1,"done":false}\n[1,2]',
      explain: '`next()` 返回 `{value, done}` 对象。展开运算符只收集 `yield` 出来的值，`return 3` 只是提前结束并把 3 放进最后一次 `next()` 的 value，不会被展开收集。' },

    { id: 'jsq38', ch: 'js8', lesson: 'js8l3', point: '全局匹配与替换', type: 'output', diff: 2,
      prompt: '写出输出。',
      code: 'const s = "a1 b22 c333";\nconsole.log(s.match(/\\d+/g));\nconsole.log(s.replace(/\\d+/g, "#"));\nconsole.log(/\\d+/.test(s));',
      answer: '["1","22","333"]\na# b# c#\ntrue',
      explain: '带 `g` 的 `match` 返回所有匹配组成的数组（此时没有分组信息）；`replace` 配 `g` 会把每一处数字整体换成 #；`test` 只问「有没有匹配」，返回布尔值。' },

    { id: 'jsq39', ch: 'js8', lesson: 'js8l4', point: '防抖与节流', type: 'choice', diff: 2,
      prompt: '搜索框输入联想，希望「用户停手 300ms 后再请求」，应该用？',
      opts: ['节流（throttle）', '防抖（debounce）', 'requestAnimationFrame', 'setInterval 轮询'],
      ans: 1,
      explain: '防抖是「等你不再触发一段时间后才执行一次」，正是输入联想的场景。节流是「固定频率最多执行一次」，适合滚动、拖拽、resize 这类需要持续响应的场景。' },

    { id: 'jsq40', ch: 'js8', lesson: 'js8l1', point: '展开是浅拷贝', type: 'output', diff: 2,
      prompt: '写出输出。',
      code: 'const a = { x: 1, y: { z: 2 } };\nconst b = { ...a };\nb.x = 9;\nb.y.z = 9;\nconsole.log(a.x, a.y.z);',
      answer: '1 9',
      explain: '`{ ...a }` 只复制第一层的值：`x` 是基本类型，改了互不影响；`y` 复制的是**同一个对象的引用**，通过 b 改内部属性，a 看到的也变了。要彻底隔离得用深拷贝。' },
  ],
  checkin: [
    { id: 'jsk1', ch: 'js1', lesson: 'js1l1', point: 'Node 的全局对象', type: 'choice', diff: 1,
      prompt: '下面哪个在浏览器里**没有**、但在 Node 里能用？',
      opts: ['setTimeout', 'require', 'console', 'Promise'],
      ans: 1,
      explain: '`setTimeout`、`console`、`Promise` 在两边都有。`require`（以及 `process`、`fs`）是 Node 宿主提供的，浏览器里没有。' },

    { id: 'jsk2', ch: 'js1', lesson: 'js1l2', point: '块作用域', type: 'output', diff: 1,
      prompt: '写出输出。',
      code: 'let x = 1;\n{\n  let x = 2;\n  x++;\n}\nconsole.log(x);',
      answer: '1',
      explain: '花括号里那个 `x` 用 `let` 声明，是块内的新变量，和外面完全无关。块内加到了 3 也不会影响外面，外面还是 1。' },

    { id: 'jsk3', ch: 'js1', lesson: 'js1l3', point: 'typeof 的结果', type: 'output', diff: 1,
      prompt: '写出输出。',
      code: 'console.log(typeof "1", typeof 1, typeof true, typeof undefined);\nconsole.log(typeof []);',
      answer: 'string number boolean undefined\nobject',
      explain: '前四个好记。`typeof []` 是 `"object"`——数组在 JS 里就是对象，判断数组要用 `Array.isArray()`。' },

    { id: 'jsk4', ch: 'js1', lesson: 'js1l4', point: '比较运算符', type: 'choice', diff: 1,
      prompt: '日常写代码时，比较两个值应该默认用哪个？',
      opts: ['`==`', '`===`', '`Object.is` 之外都行', '三种完全等价'],
      ans: 1,
      explain: '`===` 不做类型转换，行为可预测。`==` 的转换规则很容易踩坑（`"" == 0` 是 true）。`Object.is` 只在处理 NaN、-0 这些极端情况时才需要。' },

    { id: 'jsk5', ch: 'js1', lesson: 'js1l5', point: '常用字符串方法', type: 'output', diff: 1,
      prompt: '写出输出。',
      code: 'const name = "小明";\nconsole.log(`你好，${name}！${1 + 1}`);\nconsole.log("abc".toUpperCase(), "ABC".toLowerCase());\nconsole.log("a,b,c".split(",").length);',
      answer: '你好，小明！2\nABC abc\n3',
      explain: '模板字符串里 `${}` 可以是任意表达式，`1 + 1` 先算成 2 再拼进去。`split` 按逗号切成数组，长度是 3。' },

    { id: 'jsk6', ch: 'js2', lesson: 'js2l1', point: '箭头函数没有 this', type: 'choice', diff: 2,
      prompt: '箭头函数和普通函数相比，少了什么？',
      opts: ['返回值', '自己的 this 和 arguments', '参数列表', '函数名'],
      ans: 1,
      explain: '箭头函数不创建自己的 `this`，它会向外层作用域借用；也没有自己的 `arguments`（要用 rest 参数）。所以它不适合当对象方法或构造器。' },

    { id: 'jsk7', ch: 'js2', lesson: 'js2l2', point: '参数默认值', type: 'output', diff: 1,
      prompt: '写出输出。',
      code: 'function f(a, b = a * 2) {\n  return a + b;\n}\nconsole.log(f(3));\nconsole.log(f(3, 1));',
      answer: '9\n4',
      explain: '默认值可以是**引用前面参数**的表达式，`f(3)` 时 b 取 3*2=6，返回 9；显式传了 1 就覆盖默认值，返回 4。' },

    { id: 'jsk8', ch: 'js2', lesson: 'js2l3', point: 'var 的提升陷阱', type: 'output', diff: 2,
      prompt: '写出输出。',
      code: 'var v = 1;\nfunction t() {\n  console.log(String(v));\n  var v = 2;\n}\nt();',
      answer: 'undefined',
      explain: '函数内部声明了 `var v`，声明被提到函数顶部，于是这个 v **遮蔽**了外面的全局 v。打印时赋值还没执行，值是 undefined——这就是经典的提升陷阱。' },

    { id: 'jsk9', ch: 'js2', lesson: 'js2l4', point: '闭包的作用', type: 'choice', diff: 1,
      prompt: '闭包最核心的能力是什么？',
      opts: ['让代码运行更快', '让函数在离开定义环境后，仍能访问那里的变量', '自动回收内存', '替代 class'],
      ans: 1,
      explain: '函数被返回或传出后，它携带的作用域链还在，外层变量不会被回收，所以能持续读写那些变量。计数器、私有变量、缓存都是靠这个实现的。' },

    { id: 'jsk10', ch: 'js2', lesson: 'js2l5', point: 'call 改变 this', type: 'output', diff: 2,
      prompt: '写出输出。',
      code: 'const o = { n: 7, get() { return this.n; } };\nconsole.log(o.get());\nconsole.log(o.get.call({ n: 9 }));',
      answer: '7\n9',
      explain: '`o.get()` 里 this 是 o，得到 7；`call` 把 this 临时换成 `{n: 9}`，同一个函数返回 9。函数体没变，只是接收者变了。' },

    { id: 'jsk11', ch: 'js3', lesson: 'js3l1', point: '剩余属性', type: 'output', diff: 2,
      prompt: '写出输出。',
      code: 'const p = { name: "小明", age: 18, city: "上海" };\nconst { name, ...rest } = p;\nconsole.log(name, rest);',
      answer: '小明 {"age":18,"city":"上海"}',
      explain: '`...rest` 收集**剩下的可枚举自有属性**，组成一个新对象。常用在「排除某个字段」：`const { password, ...safe } = user`。' },

    { id: 'jsk12', ch: 'js3', lesson: 'js3l2', point: 'instanceof 的依据', type: 'choice', diff: 2,
      prompt: '`a instanceof B` 判断的是什么？',
      opts: ['a 是不是 B 的实例', 'B.prototype 是否在 a 的原型链上', 'a 和 B 的类型是否相同', 'a 能否调用 B 的方法'],
      ans: 1,
      explain: '本质是沿 a 的原型链往上找，看有没有 `B.prototype`。所以原型被改动时 instanceof 的结果也会变，跨 iframe 时还会失效。' },

    { id: 'jsk13', ch: 'js3', lesson: 'js3l3', point: 'super 调用父类方法', type: 'output', diff: 2,
      prompt: '写出输出。',
      code: 'class A { hi() { return "A"; } }\nclass B extends A { hi() { return super.hi() + "B"; } }\nconsole.log(new B().hi());\nconsole.log(new B() instanceof A);',
      answer: 'AB\ntrue',
      explain: '`super.hi()` 调用父类的同名方法拿到 "A"，再拼上 "B"。B 的实例原型链上有 A.prototype，所以 instanceof A 为 true。' },

    { id: 'jsk14', ch: 'js3', lesson: 'js3l5', point: 'JSON 往返', type: 'output', diff: 1,
      prompt: '写出输出。',
      code: 'const o = JSON.parse(\'{"a":1,"b":[2,3]}\');\nconsole.log(o.b.length);\nconsole.log(JSON.stringify(o));',
      answer: '2\n{"a":1,"b":[2,3]}',
      explain: '`JSON.parse` 把字符串变成真正的对象，可以正常取属性；`JSON.stringify` 再序列化回去，键的顺序按对象自有属性的顺序输出，所以和原文一致。' },

    { id: 'jsk15', ch: 'js3', lesson: 'js3l4', point: 'Symbol 的用途', type: 'choice', diff: 2,
      prompt: '`Symbol("x")` 主要解决什么问题？',
      opts: ['提供一种更快的字符串', '创建不会重名、不会出现在 for...in 里的对象键', '压缩 JSON 体积', '替代数字下标'],
      ans: 1,
      explain: '每个 Symbol 都独一无二，用它当键不会和任何已有属性冲突，也不会被 `for...in`、`Object.keys` 枚举到（要用 `Object.getOwnPropertySymbols`）。框架内部属性常用它。' },

    { id: 'jsk16', ch: 'js4', lesson: 'js4l1', point: 'push 与 unshift', type: 'output', diff: 1,
      prompt: '写出输出。',
      code: 'const a = [1, 2, 3];\na.push(4);\na.unshift(0);\nconsole.log(a);\nconsole.log(a.pop(), a.length);',
      answer: '[0,1,2,3,4]\n4 4',
      explain: '`push` 加在尾部，`unshift` 加在头部；`pop` 从尾部取走一个并返回它（4），此时剩 4 个元素。' },

    { id: 'jsk17', ch: 'js4', lesson: 'js4l2', point: 'map 与 find', type: 'output', diff: 1,
      prompt: '写出输出。',
      code: 'const words = ["a", "bb", "ccc"];\nconsole.log(words.map(w => w.length));\nconsole.log(words.find(w => w.length > 1));',

      explain: '`fn?.()` 在 fn 是 null 时不执行调用，整体结果是 undefined（不会报错）；第二行 `??` 接住这个 undefined，给出「没调用」。' },

</script>
<script>
/* ---- js/core.js ---- */
/* ============================================================
   CodeCraft · 核心逻辑（纯函数，不依赖 DOM）
   计划生成 / 进度范围 / 每日打卡出题 / 答案比对
   ============================================================ */
window.CORE = (function () {
  'use strict';

  /* ---------------- 基础工具 ---------------- */
  function fmtDate(d) {
    const p = n => (n < 10 ? '0' : '') + n;
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function todayKey() { return fmtDate(new Date()); }
  function parseDate(s) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
    if (!m) return new Date();
    return new Date(+m[1], +m[2] - 1, +m[3]);
  }
  function diffDays(a, b) {
    const d1 = parseDate(a), d2 = parseDate(b);
    return Math.round((d2 - d1) / 86400000);
  }
  function addDays(s, n) {
    const d = parseDate(s);
    d.setDate(d.getDate() + n);
    return fmtDate(d);
  }
  function hashStr(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, rnd) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ---------------- 课程索引 ---------------- */
  const idxCache = {};
  function index(lang) {
    if (idxCache[lang.id]) return idxCache[lang.id];
    const CH = {}, LMAP = {}, ALL = [], QMAP = {}, KMAP = {}, CH_Q = {}, CH_K = {};
    lang.chapters.forEach((c, ci) => {
      const chapter = Object.assign({}, c, { idx: ci });
      CH[c.id] = chapter;
      c.lessons.forEach((l, li) => {
        const item = Object.assign({}, l, {
          ch: c.id, chTitle: c.title, chNum: c.num != null ? c.num : ci + 1,
          chIdx: ci, li: li, flat: ALL.length
        });
        LMAP[l.id] = item;
        ALL.push(item);
      });
    });
    (lang.quiz || []).forEach(q => { QMAP[q.id] = q; (CH_Q[q.ch] = CH_Q[q.ch] || []).push(q); });
    (lang.checkin || []).forEach(q => { KMAP[q.id] = q; (CH_K[q.ch] = CH_K[q.ch] || []).push(q); });

    const ix = { CH, LMAP, ALL, QMAP, KMAP, CH_Q, CH_K, chapters: lang.chapters };
    idxCache[lang.id] = ix;
    return ix;
  }

  /* ---------------- 学习计划 ----------------
     规则：
     · 天数少 → 每天多学几课（最多 4 课/天）
     · 天数多 → 每天 1 课，多余的天变成「复习日 / 冲刺日」
     · 每 4 个学习日插一个复习日（如果还有余量）
  */
  function buildPlan(lang, days) {
    const ix = index(lang);
    const lessons = ix.ALL;
    const N = Math.max(3, Math.min(200, Math.floor(days) || 14));

    let learnWanted = N;
    if (N >= 10) learnWanted = Math.round(N * 0.84);
    if (N >= 30) learnWanted = Math.round(N * 0.8);
    learnWanted = Math.max(learnWanted, Math.ceil(lessons.length / 4));
    learnWanted = Math.min(learnWanted, Math.max(1, lessons.length));
    const learnDays = Math.max(1, Math.min(N, learnWanted));

    // 均衡切分课时
    const base = Math.floor(lessons.length / learnDays);
    const rem = lessons.length % learnDays;
    const chunks = [];
    let p = 0;
    for (let i = 0; i < learnDays; i++) {
      const size = base + (i < rem ? 1 : 0);
      chunks.push(lessons.slice(p, p + size));
      p += size;
    }

    const list = [];
    let n = 0;
    chunks.forEach((ch, i) => {
      if (!ch.length) return;
      list.push({
        n: ++n, type: 'learn',
        title: ch.map(l => l.title).join(' + ').slice(0, 80),
        chIds: uniq(ch.map(l => l.ch)),
        lessons: ch.map(l => ({ id: l.id, title: l.title, ch: l.ch, time: l.time || 10 })),
        desc: ch.length > 1
          ? '先读 ' + ch[0].title + ' 的讲解 → 跑示例 → 再看 ' + ch[ch.length - 1].title + '，最后做本章测试'
          : '读讲解 → 跑示例代码 → 做本章测试题，把这一课真正拿下来'
      });
    });

    const rest = N - list.length;
    if (rest > 0) {
      const reviewCount = Math.min(rest, Math.max(1, Math.round(rest * 0.42)));
      const sprintCount = rest - reviewCount;
      const chs = lang.chapters.map(c => c.id);

      /* 先按「复习 / 冲刺」交替生成额外日 */
      const extras = [];
      let r = reviewCount, sp = sprintCount, k = 0;
      while (extras.length < rest) {
        if ((k % 2 === 0 && r > 0) || sp === 0) { extras.push('review'); r--; }
        else { extras.push('sprint'); sp--; }
        k++;
      }

      /* 均匀分配到 n+1 个插槽里，再倒序插入，保证下标不被打乱 */
      const n = list.length;
      const buckets = [];
      for (let i = 0; i <= n; i++) buckets.push([]);
      extras.forEach((type, i) => {
        /* 位置取 1..n：永远排在学习日之后，第 1 天一定是学习日 */
        let pos = extras.length === 1
          ? Math.max(1, Math.floor(n / 2))
          : 1 + Math.round(i * (n - 1) / (extras.length - 1));
        buckets[Math.max(1, Math.min(n, pos))].push(type);
      });

      let sprintRound = 0;
      for (let p = n; p >= 0; p--) {
        const types = buckets[p];
        if (!types.length) continue;
        const prev = list[Math.max(0, p - 1)];
        const chIds = uniq(prev && prev.chIds && prev.chIds.length ? prev.chIds : [chs[0]]);
        const days = types.map(type => {
          if (type === 'review') {
            const c = ix.CH[chIds[0]];
            return {
              n: 0, type: 'review',
              title: '复习日 · ' + (c ? c.title : '错题清零'),
              chIds: chIds,
              lessons: [],
              desc: '把错题本里这几章的题重做一遍，错的题才是真正的知识盲区；再回读一遍最不熟的那一课'
            };
          }
          const chId = chs[sprintRound % chs.length];
          const c = ix.CH[chId];
          sprintRound++;
          return {
            n: 0, type: 'sprint',
            title: '冲刺 · ' + (c ? c.title : lang.name) + (sprintRound > chs.length ? ' 加练' : ''),
            chIds: [chId],
            lessons: [],
            desc: '从本章随机抽题连做，做完看错题解析；这一天的目标是「不用翻笔记也能写对」'
          };
        });
        list.splice.apply(list, [p, 0].concat(days));
      }
    }

    list.forEach((d, i) => { d.n = i + 1; });
    return {
      lang: lang.id, days: list.length, requested: N,
      learnDays: list.filter(d => d.type === 'learn').length,
      plan: list
    };
  }

  function uniq(a) {
    const out = [];
    a.forEach(x => { if (out.indexOf(x) < 0) out.push(x); });
    return out;
  }

  /* ---------------- 进度 ---------------- */
  function doneCount(lang, st) {
    const ix = index(lang);
    return ix.ALL.filter(l => st.done[l.id]).length;
  }
  function chapterPct(lang, st, chId) {
    const ix = index(lang);
    const ls = ix.CH[chId] ? ix.CH[chId].lessons : [];
    if (!ls.length) return 0;
    return Math.round(ls.filter(l => st.done[l.id]).length / ls.length * 100);
  }
  function overallPct(lang, st) {
    const ix = index(lang);
    const lp = ix.ALL.length ? doneCount(lang, st) / ix.ALL.length : 0;
    const qt = (lang.quiz || []).length || 1;
    const qp = Math.min(1, Object.keys(st.solved).length / qt);
    return Math.round((lp * 0.55 + qp * 0.45) * 100);
  }
  /* 已学范围：最后一个已读课时所在章节（含）之前的所有章节 */
  function learnedChapters(lang, st) {
    const ix = index(lang);
    let lastIdx = -1;
    ix.ALL.forEach(l => { if (st.done[l.id]) lastIdx = Math.max(lastIdx, l.chIdx); });
    if (lastIdx < 0) lastIdx = 0;
    return lang.chapters.slice(0, lastIdx + 1).map(c => c.id);
  }
  function nextLesson(lang, st) {
    const ix = index(lang);
    for (const l of ix.ALL) if (!st.done[l.id]) return l;
    return ix.ALL[ix.ALL.length - 1] || null;
  }
  function streak(st) {
    let c = 0;
    const d = new Date();
    for (let i = 0; i < 730; i++) {
      const rec = st.days[fmtDate(d)];
      if (rec && rec.checkin) c++;
      else if (i > 0) break;
      d.setDate(d.getDate() - 1);
    }
    return c;
  }
  function planDayOf(plan, startDate, dateKey) {
    if (!plan || !plan.plan || !plan.plan.length) return null;
    const d = diffDays(startDate, dateKey || todayKey());
    const i = Math.max(0, Math.min(plan.plan.length - 1, d));
    return plan.plan[i];
  }
  function dayDone(st, day) {
    if (!day) return false;
    if (day.type === 'learn') return day.lessons.length > 0 && day.lessons.every(l => st.done[l.id]);
    return false;
  }

  /* ---------------- 每日打卡出题 ----------------
     硬性约束：打卡题库（checkin）与章节测试题库（quiz）完全隔离
     —— 不同 id、不同题干，且再按 id 交叉过滤一次防呆。
  */
  const LEVELS = {
    easy:   { name: '轻松', total: 4, theory: 2, code: 1, desc: '每天 4 题，适合忙碌日，保持手感不断档' },
    normal: { name: '标准', total: 6, theory: 3, code: 2, desc: '每天 6 题，默认节奏，稳扎稳打' },
    hard:   { name: '挑战', total: 8, theory: 4, code: 3, desc: '每天 8 题，含更多实景编程，进步最快' }
  };

  function pickCheckin(lang, st, dateKey, level) {
    const ix = index(lang);
    const cfg = LEVELS[level] || LEVELS.normal;
    const quizIds = new Set(Object.keys(ix.QMAP));
    const scope = learnedChapters(lang, st);
    const near = st.daily[dateKey];

    // 最近两天出过的题往后排，避免连着重复
    const recent = new Set();
    [addDays(dateKey, -1), addDays(dateKey, -2)].forEach(dk => {
      const rec = st.daily[dk];
      if (rec && rec.qids) rec.qids.forEach(id => recent.add(id));
    });

    let pool = (lang.checkin || []).filter(q => scope.indexOf(q.ch) >= 0 && !quizIds.has(q.id));
    if (pool.length < cfg.total + 2) {
      // 已学章节的题不够一天用时，放宽到全书（但仍不碰章节测试题）
      pool = (lang.checkin || []).filter(q => !quizIds.has(q.id));
    }
    const rnd = mulberry32(hashStr(lang.id + '|' + dateKey + '|' + level));
    const fresh = shuffle(pool.filter(q => !recent.has(q.id)), rnd);
    const older = shuffle(pool.filter(q => recent.has(q.id)), rnd);
    const ordered = fresh.concat(older);

    const picked = [];
    const takeOne = fn => {
      for (const q of ordered) {
        if (picked.indexOf(q) >= 0) continue;
        if (fn(q)) { picked.push(q); return true; }
      }
      return false;
    };

    // 1) 先保证一道实景编程题
    takeOne(q => q.type === 'code' && q.scene);
    // 2) 再补编程题到配额
    for (let i = 0; i < cfg.code && picked.filter(q => q.type === 'code').length < cfg.code; i++) {
      takeOne(q => q.type === 'code');
    }
    // 3) 理论题：选择 / 输出预测交替
    let guard = 0;
    while (picked.filter(q => q.type !== 'code').length < cfg.theory && guard < 40) {
      guard++;
      const wantChoice = picked.filter(q => q.type !== 'code').length % 2 === 0;
      if (!takeOne(q => q.type !== 'code' && (wantChoice ? q.type === 'choice' : q.type === 'output'))) {
        if (!takeOne(q => q.type !== 'code')) break;
      }
    }
    // 4) 不够就随便补
    while (picked.length < cfg.total && picked.length < ordered.length) {
      if (!takeOne(() => true)) break;
    }

    const out = shuffle(picked, rnd);
    // 最终防呆：绝对不能出现章节测试同 id 的题
    return out.filter(q => !quizIds.has(q.id)).map(q => q.id);
  }

  /* ---------------- 题库隔离自检 ---------------- */
  function auditBank(lang) {
    const quiz = lang.quiz || [], chk = lang.checkin || [];
    const qid = new Set(quiz.map(q => q.id));
    const kid = new Set(chk.map(q => q.id));
    const dupId = [...kid].filter(id => qid.has(id));
    const norm = s => String(s || '').replace(/<[^>]+>/g, '').replace(/\s+/g, '');
    const qp = new Map(quiz.map(q => [norm(q.prompt) + '|' + norm(q.code || ''), q.id]));
    const dupPrompt = [];
    chk.forEach(q => {
      const k = norm(q.prompt) + '|' + norm(q.code || '');
      if (qp.has(k)) dupPrompt.push(q.id + ' ↔ ' + qp.get(k));
    });
    const missingQuizCh = quiz.filter(q => !index(lang).CH[q.ch]).map(q => q.id);
    const missingChkCh = chk.filter(q => !index(lang).CH[q.ch]).map(q => q.id);
    return { quiz: quiz.length, checkin: chk.length, dupId, dupPrompt, missingQuizCh, missingChkCh,
             ok: !dupId.length && !dupPrompt.length && !missingQuizCh.length && !missingChkCh.length };
  }

  /* ---------------- 答案比对 ---------------- */
  function normalizeOut(s) {
    return String(s == null ? '' : s)
      .replace(/\r\n?/g, '\n')
      .split('\n').map(l => l.replace(/[ \t]+$/g, '')).join('\n')
      .replace(/^\n+/, '').replace(/\n+$/, '');
  }
  function sameOut(got, want) {
    return normalizeOut(got) === normalizeOut(want);
  }

  return {
    fmtDate, todayKey, parseDate, diffDays, addDays, hashStr, mulberry32, shuffle,
    index, buildPlan, LEVELS,
    doneCount, chapterPct, overallPct, learnedChapters, nextLesson, streak,
    planDayOf, dayDone, pickCheckin, auditBank, normalizeOut, sameOut
  };
})();

/* ============================================================

window.UI = (function () {
  'use strict';

  /* ---------------- 转义 ---------------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* ---------------- 语法高亮 ---------------- */
  const KW = {
    python: 'False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield match case',
    c: 'auto break case char const continue default do double else enum extern float for goto if inline int long register return short signed sizeof static struct switch typedef union unsigned void volatile while bool',
    cpp: 'auto break case catch char class const constexpr continue default delete do double else enum explicit extern false float for friend goto if inline int long namespace new nullptr operator private protected public return short signed sizeof static struct switch template this throw true try typedef typename union unsigned using virtual void volatile while override include define',
    java: 'abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for if implements import instanceof int interface long native new package private protected public return short static strictfp super switch synchronized this throw throws transient try void volatile while true false null var record',
    javascript: 'async await break case catch class const continue debugger default delete do else export extends finally for function if import in instanceof let new of return static super switch this throw try typeof var void while with yield true false null undefined'
  };
  const BI = {
    python: 'print len range input int str float bool list dict set tuple abs sum max min sorted enumerate zip map filter open isinstance type super repr round any all divmod',
    c: 'printf scanf malloc free strlen strcpy strcmp strcat memset sizeof fprintf fgets puts gets strncpy sprintf',
    cpp: 'cout cin endl string vector map set unordered_map sort printf scanf push_back size',
    java: 'System String Math Integer Double Object Arrays List ArrayList HashMap Map Scanner StringBuilder Character Long',
    javascript: 'console Math JSON Object Array String Number Boolean Promise fetch document window parseInt parseFloat Map Set'
  };
  const LIT = { python: '# ', c: '// ', cpp: '// ', java: '// ', javascript: '// ' };

  function hl(code, lang) {
    lang = lang || 'python';
    const kws = new Set((KW[lang] || KW.python).split(' '));
    const bis = new Set((BI[lang] || '').split(' '));
    const hashCmt = (lang === 'python');
    const src = String(code == null ? '' : code);

    // 主扫描：注释 | 字符串 | 数字 | 标识符 | 其他
    const re = hashCmt
      ? /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|(\b\d[\d_]*(?:\.\d+)?(?:[eE][+-]?\d+)?j?\b)|([A-Za-z_$][\w$]*)/g
      : /(\/\/[^\n]*|\/\*[\s\S]*?\*\/|^[ \t]*#[^\n]*)|("(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|`(?:\\.|[^`\\])*`)|(\b\d[\d_]*(?:\.\d+)?(?:[eE][+-]?\d+)?[fFlLuU]*\b)|([A-Za-z_$][\w$]*)/gm;

    let out = '', last = 0, m;
    while ((m = re.exec(src))) {
      out += esc(src.slice(last, m.index));
      const [full, cmt, str, num, ident] = m;
      if (cmt) out += '<span class="c">' + esc(cmt) + '</span>';
      else if (str) out += '<span class="s">' + esc(str) + '</span>';
      else if (num) out += '<span class="n">' + esc(num) + '</span>';
      else if (ident) {
        if (kws.has(ident)) out += '<span class="k">' + esc(ident) + '</span>';
        else if (bis.has(ident)) out += '<span class="b">' + esc(ident) + '</span>';
        else if (/^\s*\(/.test(src.slice(re.lastIndex, re.lastIndex + 3))) out += '<span class="f">' + esc(ident) + '</span>';
        else out += esc(ident);
      } else out += esc(full);
      last = re.lastIndex;
    }
    out += esc(src.slice(last));
    return out;
  }

  function inline(s) {
    // 支持正文里的行内标记：`code` 与 **加粗**（先转义，避免把代码里的 < > 当标签）
    let out = esc(String(s == null ? '' : s));
    out = out.replace(/`([^`]+)`/g, (m, p1) => '<code class="inline">' + p1 + '</code>');
    out = out.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    return out;
  }

  /* ---------------- 代码块 ---------------- */
  const store = {};
  let seq = 0;
  function resetStore() { for (const k in store) delete store[k]; seq = 0; }
  function putCode(code) { const id = 'c' + (++seq); store[id] = code; return id; }
  function getCode(id) { return store[id]; }

  function codeBox(code, opts) {
    opts = opts || {};
    const lang = opts.lang || 'python';
    const id = putCode(String(code == null ? '' : code).replace(/\s+$/, ''));
    let h = '<div class="codebox">';
    h += '<div class="codebox-head"><span class="dots"><i></i><i></i><i></i></span>' +
      '<span>' + esc(opts.label || (code[0] === '>' ? '终端' : (opts.fileName || lang))) + '</span><span class="sp"></span>';

    h += '</div>';
    h += '<pre class="code"><code>' + hl(code, lang) + '</code></pre>';
    if (opts.out != null) h += '<div class="outbox">' + esc(opts.out) + '</div>';
    h += '<div class="outbox err" data-out-for="' + id + '" hidden></div>';
    h += '</div>';
    return h;
  }

  /* ---------------- 正文块 ---------------- */
  function blocksHtml(blocks, lang) {
    let h = '';
    (blocks || []).forEach(b => {
      if (typeof b === 'string') { h += '<p>' + inline(b) + '</p>'; return; }
      switch (b.t) {
        case 'h': h += '<h3>' + inline(b.x) + '</h3>'; break;
        case 'p': h += '<p>' + inline(b.x) + '</p>'; break;
        case 'quote': h += '<p style="border-left:3px solid #dbe6f7;padding-left:14px;color:#5b6b82">' + inline(b.x) + '</p>'; break;
        case 'ul': h += '<ul>' + (b.x || []).map(x => '<li>' + inline(x) + '</li>').join('') + '</ul>'; break;
        case 'ol': h += '<ol>' + (b.x || []).map(x => '<li>' + inline(x) + '</li>').join('') + '</ol>'; break;
        case 'table': {
          h += '<div style="overflow-x:auto"><table class="tbl"><thead><tr>' +
            b.head.map(x => '<th>' + inline(x) + '</th>').join('') + '</tr></thead><tbody>';
          b.rows.forEach(r => {
            h += '<tr>' + r.map((c, i) => '<td>' + (i === 0 ? '<strong>' + inline(c) + '</strong>' : inline(c)) + '</td>').join('') + '</tr>';
          });
          h += '</tbody></table></div>';
          break;
        }
        case 'code':
          h += codeBox(b.x, { lang: lang, run: b.run !== false, out: b.out, label: b.label, fileName: b.file });
          break;
        case 'note': h += callout('note', '💡', b.x); break;
        case 'warn': h += callout('warn', '⚠️', b.x); break;
        case 'tip': h += callout('tip', '✅', b.x); break;
        case 'principle': h += callout('principle', '🎯', b.x); break;
        default: if (b.x) h += '<p>' + inline(b.x) + '</p>';
      }
    });
    return h;
  }

  const CI = { note: '💡', warn: '⚠️', tip: '✅', principle: '🎯' };
  function callout(kind, icon, html) {

      '</span><div>' + inline(html) + '</div></div>';
  }

  /* ---------------- Toast / Modal ---------------- */
  function toast(msg, type) {
    const wrap = document.getElementById('toast-wrap');
    if (!wrap) return;
    const el = document.createElement('div');
    el.className = 'toast' + (type === 'ok' ? ' ok' : type === 'bad' ? ' bad' : '');
    el.textContent = msg;
    wrap.appendChild(el);

    setTimeout(() => el.remove(), 2700);
  }

  function modal(html, opts) {

  }
  function closeModal() {
    const root = document.getElementById('modal-root');
    if (root) root.innerHTML = '';
  }

  /* ---------------- 小部件 ---------------- */
  function ring(pct, size, color) {
    size = size || 84;
    const r = (size - 10) / 2, c = 2 * Math.PI * r;
    const off = c * (1 - Math.max(0, Math.min(100, pct)) / 100);
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" style="transform:rotate(-90deg)">' +
      '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="#eef2f8" stroke-width="8"/>' +
      '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + (color || '#2f6be0') +
      '" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/>' +
      '</svg>';

  function heatmap(dayMap, weeks) {
    weeks = weeks || 16;
    const today = new Date();
    const cells = [];
    // 从 weeks 周前的周日开始
    const start = new Date(today);
    start.setDate(start.getDate() - ((today.getDay()) + (weeks - 1) * 7));
    const cur = new Date(start);
    let h = '';
    let count = 0;
    for (let i = 0; i < weeks * 7; i++) {
      const key = fmtDate(cur);
      const rec = dayMap[key];
      let cls = 'hm-cell';
      if (rec && rec.checkin) {
        const score = (rec.lessons || 0) + (rec.solved || 0) / 2;
        cls += score >= 6 ? ' l4' : score >= 3 ? ' l3' : score >= 1 ? ' l2' : ' l1';
      }
      if (key === fmtDate(today)) cls += ' today';
      h += '<div class="' + cls + '" data-day="' + key + '" title="' + key + (rec && rec.checkin ? ' · 已打卡' : '') + '"></div>';
      count++;

    }
    return '<div class="heatmap">' + h + '</div>' +
      '<div class="hm-legend"><span>少</span><i class="hm-cell" style="width:10px;height:10px"></i>' +
      '<i class="hm-cell l2" style="width:10px;height:10px"></i><i class="hm-cell l3" style="width:10px;height:10px"></i>' +
      '<i class="hm-cell l4" style="width:10px;height:10px"></i><span>多</span></div>';
  }
  function fmtDate(d) {
    const p = n => (n < 10 ? '0' : '') + n;
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function diffHint(got, want) {
    const g = String(got == null ? '' : got).replace(/\r/g, '').trim();
    const w = String(want == null ? '' : want).replace(/\r/g, '').trim();
    if (g === w) return '';
    const gl = g.split('\n'), wl = w.split('\n');
    const tips = [];
    if (gl.length !== wl.length) tips.push('行数不一致：你输出 ' + gl.length + ' 行，期望 ' + wl.length + ' 行');
    for (let i = 0; i < Math.min(gl.length, wl.length); i++) {
      if (gl[i].replace(/\s+$/, '') !== wl[i].replace(/\s+$/, '')) {
        tips.push('第 ' + (i + 1) + ' 行不同：你的是 <code>' + esc(gl[i]) + '</code>，期望 <code>' + esc(wl[i]) + '</code>');
        break;
      }
    }
    if (!tips.length) tips.push('内容几乎一样，检查一下空格、换行或大小写');
    return tips.join('；');
  }

  /* ---------------- 编辑器 ---------------- */
  function mountEditor(box, opts) {
    const lang = opts.lang || 'python';
    const taId = 'ta' + Math.random().toString(36).slice(2, 8);

      '<div class="editor">' +
        '<div class="editor-head"><span>' + esc(opts.file || ('main.' + extOf(lang))) + '</span><span class="sp"></span>' +

        '<textarea spellcheck="false" id="' + taId + '"></textarea></div>' +
        '<div class="editor-foot"><button class="btn btn-primary btn-sm" data-act="run">▶ 运行</button>' +
        '<button class="btn btn-ghost btn-sm" data-act="reset">重置代码</button>' +
        '<span class="sp"></span><span class="hintline">' + esc(opts.hint || '') + '</span></div>' +
      '</div>' +
      '<div data-result></div>';

    const ta = box.querySelector('textarea');
    const gutter = box.querySelector('[data-gutter]');
    ta.value = opts.code || '';
    function sync() {
      const lines = ta.value.split('\n').length;
      let g = '';
      for (let i = 1; i <= Math.max(lines, 8); i++) g += i + '\n';
      gutter.textContent = g;
      ta.style.height = 'auto';
      ta.style.height = Math.max(150, ta.scrollHeight + 4) + 'px';
    }
    ta.addEventListener('input', sync);
    ta.addEventListener('keydown', e => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const s = ta.selectionStart, en = ta.selectionEnd;
        ta.value = ta.value.slice(0, s) + '    ' + ta.value.slice(en);
        ta.selectionStart = ta.selectionEnd = s + 4;
        sync();
      }
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        if (opts.onRun) opts.onRun(ta.value);
      }
    });
    box.querySelector('[data-act="reset"]').addEventListener('click', () => {
      ta.value = opts.code || ''; sync();
    });
    box.querySelector('[data-act="run"]').addEventListener('click', () => {
      if (opts.onRun) opts.onRun(ta.value);
    });
    sync();
    return { getValue: () => ta.value, setValue: v => { ta.value = v; sync(); }, textarea: ta };
  }

  function extOf(lang) {
    return { python: 'py', c: 'c', cpp: 'cpp', java: 'java', javascript: 'js' }[lang] || 'txt';
  }

  function renderRun(el, r) {
    if (!el) return;
    const kind = r.ok ? 'ok' : 'bad';
    let body = '';
    if (r.phase === 'compile' && r.err) {
      body = '<div style="font-size:12.5px;color:#a83232;margin-bottom:6px">编译没有通过：</div><pre>' + esc(r.err) + '</pre>';
    } else if (r.ok) {
      body = '<pre>' + esc(r.out || '(没有输出)') + '</pre>';
    } else {
      body = r.err ? '<pre>' + esc(r.err) + '</pre>' : '<div>没有执行结果</div>';
    }
    el.innerHTML = '<div class="runpanel ' + kind + '">' +
      '<div class="rp-head">' + (r.ok ? '✓ 运行成功' : '✕ 运行失败') +
      '<span style="margin-left:auto;font-weight:500;font-size:11.5px;opacity:.8">' + esc(r.note || '') + '</span></div>' +
      '<div class="rp-body">' + body + '</div></div>';
  }

  return {
    esc, hl, inline, codeBox, blocksHtml, callout, toast, modal, closeModal,
    ring, heatmap, diffHint, mountEditor, renderRun, fmtDate,
    putCode, getCode, resetStore, extOf
  };
})();

    // Java 的 JVM 默认按系统编码输出，在服务器上会把中文变成 ?，必须显式指定 UTF-8
    java:       { compiler: 'openjdk-jdk-21+35', options: '', file: 'Main.java',
                  runtime: '-Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8' }
  };

  const caps = {
    python: '在线运行 · 需联网',
    c: '在线编译 · GCC 13 / C11',
    cpp: '在线编译 · GCC 13 / C++17',
    java: '在线编译 · OpenJDK 21（主类写 class Main）',
    javascript: '浏览器内运行 · 可离线'
  };

  /* ---------- 请求队列：避免高频打挂公共接口 ---------- */
  let chain = Promise.resolve();
  let lastAt = 0;
  function enqueue(task) {
    const run = chain.then(async () => {
      const wait = Math.max(0, 420 - (Date.now() - lastAt));
      if (wait) await new Promise(r => setTimeout(r, wait));
      lastAt = Date.now();
      return task();
    });
    chain = run.catch(() => {});
    return run;
  }

  function fetchJSON(body, timeout) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeout || 25000);
    return fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: ctrl.signal
    }).then(async res => {
      const text = await res.text();
      let data = null;
      try { data = JSON.parse(text); } catch (e) {}
      if (!data) {
        const brief = String(text || '').replace(/\s+/g, ' ').slice(0, 120);
        const err = new Error('接口返回异常（HTTP ' + res.status + '）' + (brief ? '：' + brief : ''));
        err.tooMany = /too many|rate.?limit|429/i.test(text || '') || res.status === 429;
        throw err;
      }
      return data;
    }).finally(() => clearTimeout(timer));
  }

  function runRemote(lang, code, stdin, attempt) {
    attempt = attempt || 0;
    const cfg = MAP[lang];
    if (!cfg) return Promise.resolve({ ok: false, out: '', err: '暂不支持这门语言在线运行', phase: 'config', note: '' });
    const t0 = Date.now();
    return enqueue(() => fetchJSON({
      compiler: cfg.compiler,
      code: code,
      stdin: stdin || '',
      options: cfg.options || '',
      'compiler-option-raw': '',
      'runtime-option-raw': cfg.runtime || ''
    })).then(d => {
      const out = d.program_output || '';
      const perr = d.program_error || '';
      const cerr = d.compiler_error || '';
      const ok = String(d.status) === '0' && !cerr;
      return {
        ok: ok,
        out: out || perr,
        err: cerr || (ok ? '' : perr) || '',
        phase: cerr ? 'compile' : 'run',
        timeMs: Date.now() - t0,
        note: (Date.now() - t0) + ' ms · ' + (caps[lang] || '在线运行')
      };
    }).catch(e => {
      /* 公共接口限流时稍等重试，最多两次 */
      if (e && e.tooMany && attempt < 2) {
        return new Promise(r => setTimeout(r, 1200 * (attempt + 1)))
          .then(() => runRemote(lang, code, stdin, attempt + 1));
      }
      const msg = e && e.name === 'AbortError'
        ? '在线编译超时（超过 25 秒），检查一下是不是死循环，或稍后重试'
        : '连不上在线编译服务：' + (e && e.message ? e.message : e) + '。请检查网络后重试（Python/C/C++/Java 需要联网运行）';
      return { ok: false, out: '', err: msg, phase: 'network', note: '网络/服务异常', timeMs: Date.now() - t0 };
    });
  }

  /* ---------- JavaScript：iframe 沙箱 ---------- */
  let jsSeq = 0;
  function jstr(s) {
    return JSON.stringify(String(s == null ? '' : s)).replace(/</g, '\\u003c').replace(/\u2028|\u2029/g, ' ');
  }

  function runJS(code, stdin, timeout) {
    return new Promise(resolve => {
      const id = 'jsr' + (++jsSeq) + '_' + Math.random().toString(36).slice(2, 6);
      const t0 = Date.now();
      const iframe = document.createElement('iframe');
      iframe.setAttribute('sandbox', 'allow-scripts');
      iframe.style.cssText = 'position:fixed;left:-9999px;top:0;width:2px;height:2px;border:0;opacity:0';
      let settled = false;

      const harness =
        '<!DOCTYPE html><html><body><script>(function(){' +
        'var INPUT=' + jstr(stdin) + ';' +
        'var LINES=String(INPUT).split("\\n"),P=0;' +
        'function readline(){return P<LINES.length?LINES[P++]:"";}' +
        'function readInt(){var v=String(readline()).trim();return v===""?0:Number(v);}' +
        'var buf=[];function fmt(v){if(typeof v==="string")return v;try{return JSON.stringify(v);}catch(e){return String(v);}}' +
        'function push(){buf.push(Array.prototype.slice.call(arguments).map(fmt).join(" "));}' +
        'var fake={log:push,error:push,warn:push,info:push,debug:push};' +
        'function finish(ok,err){if(window.__done)return;window.__done=1;' +
        'parent.postMessage({__cc:1,id:' + jstr(id) + ',ok:ok,out:buf.join("\\n"),err:err||""},"*");}' +
        'try{var fn=new Function("console","readline","readInt","print","INPUT",' + jstr(code) + ');' +
        'fn(fake,readline,readInt,push,INPUT);}catch(e){finish(false,(e&&e.stack)?e.stack:String(e));return;}' +
        'setTimeout(function(){finish(true,"");},140);' +
        '})();<\/script></body></html>';

      function onMsg(e) {
        const d = e.data;
        if (!d || d.__cc !== 1 || d.id !== id) return;
        settled = true;
        window.removeEventListener('message', onMsg);
        cleanup();
        resolve({ ok: !!d.ok, out: d.out || '', err: d.err || '', phase: d.ok ? 'run' : 'compile',
          timeMs: Date.now() - t0, note: (Date.now() - t0) + ' ms · 浏览器内运行' });
      }
      function cleanup() {
        try { iframe.remove(); } catch (e) {}
      }
      window.addEventListener('message', onMsg);
      setTimeout(() => {
        if (settled) return;
        settled = true;
        window.removeEventListener('message', onMsg);
        cleanup();
        resolve({ ok: false, out: '', err: '运行超时（超过 5 秒），可能是死循环', phase: 'timeout', note: '超时', timeMs: 5000 });
      }, timeout || 5000);

      iframe.srcdoc = harness;
      document.body.appendChild(iframe);
    });
  }

  function run(lang, code, stdin) {
    if (lang === 'javascript') return runJS(code, stdin);
    return runRemote(lang, code, stdin);
  }

  function caption(lang) { return caps[lang] || '在线运行'; }

  return { run, caption, runJS, runRemote, supports: Object.keys(MAP).concat(['javascript']) };
})();

  App.VER = 'k1';
  App.ORDER = ['python', 'c', 'cpp', 'java', 'javascript'];
  App.list = App.ORDER.filter(id => LANGS[id]);

  /* ---------------- 状态 ---------------- */
  function defaults() {
    return {
      v: 2,
      profile: { lang: '', days: 0, startDate: '', level: 'normal' },
      langs: {}
    };
  }

  App.load = function () {
    let raw = {};
    try { raw = JSON.parse(localStorage.getItem(App.KEY) || '{}') || {}; } catch (e) { raw = {}; }
    const d = defaults();
    const S = {
      v: 2,
      profile: Object.assign(d.profile, raw.profile || {}),
      langs: raw.langs || {}
    };
    if (S.profile.lang && !LANGS[S.profile.lang]) S.profile.lang = '';
    App.S = S;
    return S;
  };

  App.save = function () {
    try { localStorage.setItem(App.KEY, JSON.stringify(App.S)); } catch (e) {}
  };

  App.langState = function (id) {
    const S = App.S;
    if (!S.langs[id]) {
      S.langs[id] = {
        done: {}, solved: {}, tries: {}, wrong: {}, days: {}, daily: {},
        plan: null, planDays: 0, level: 'normal', startDate: ''
      };
    }
    const st = S.langs[id];
    ['done', 'solved', 'tries', 'wrong', 'days', 'daily'].forEach(k => { if (!st[k]) st[k] = {}; });
    if (!st.level) st.level = 'normal';
    return st;
  };

  /* 当前语言上下文 */
  App.bindLang = function (id) {
    id = id || App.S.profile.lang;

    App.st = id ? App.langState(id) : null;
    App.ix = App.L ? CORE.index(App.L) : null;
    if (App.st && !App.st.plan && App.st.planDays) {
      App.st.plan = CORE.buildPlan(App.L, App.st.planDays);
    }
    return App.L;
  };

  App.touchDay = function (field, inc) {
    if (!App.st) return;
    const k = CORE.todayKey();
    const rec = App.st.days[k] || (App.st.days[k] = { checkin: false, lessons: 0, solved: 0 });

  };
